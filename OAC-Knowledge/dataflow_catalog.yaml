  KGR_DF_Daily_Nganh_Report:
    dataflow_id: '''minhndn@bizin.vn''.''KGR_DF_Daily_Nganh_Report'''
    name: KGR_DF_Daily_Nganh_Report
    object_path:
    last_modified: '2026-06-03'
    version: '2.6'
    input_datasets:
    - Nganh_Report_Long_#
    - AOP LINE CF
    - SPmoi_ng_v3
    output_datasets:
    - Daily_Nganh_Report
    in_closure: true
    n_steps: 14
    steps:
    - step: InputDataset_0
      type: InputDataset
      label: Nganh_Report_Long_#
      input_dataset: Nganh_Report_Long_#
      dataset_type: db
    - step: AddColumns_0
      type: AddColumns
      label: Add Columns
      adds:
      - name: DS_AOP
        expression: CASE WHEN Metric_Code = 1 THEN AOP_Amount END
      - name: DS_TT
        expression: CASE WHEN Metric_Code = 1 THEN Actual_Amount END
      - name: CKKM_AOP
        expression: CASE WHEN Metric_Code = 5 THEN AOP_Amount END
      - name: CKKM_TT
        expression: CASE WHEN Metric_Code = 5 THEN Actual_Amount END
      - name: LNGiao
        expression: CASE WHEN Metric_Code = 23 THEN AOP_Amount END
      - name: LNST
        expression: CASE WHEN Metric_Code = 23 THEN Actual_Amount END
      - name: LNGop
        expression: CASE WHEN Metric_Code = 4 THEN Actual_Amount END
      - name: TyLeXD
        expression: CASE WHEN Metric_Code = 24 THEN Actual_Amount END
    - step: RenameColumns_0
      type: RenameColumns
      label: Rename Columns
      renames:
      - ID CLASS -> IDCLASS
    - step: AddColumns_1
      type: AddColumns
      label: Add Columns 1
      adds:
      - name: TenNganh
        expression: CASE WHEN IDCLASS = 1 THEN 'Water care' WHEN IDCLASS = 2 THEN 'Home care' WHEN IDCLASS = 3 THEN 'Cold
          & Hygen care' WHEN IDCLASS = 4 THEN 'Sanitary care' ELSE 'Khac' END
    - step: GroupBy_1
      type: GroupBy
      label: Aggregate 1
      group_by:
      - PERIODNAME
      - AsOfDate
      - TenNganh
      aggregations:
      - Metric_Code Sum = sum(Metric_Code)
      - "\uFEFFSort_Order Sum = sum(\uFEFFSort_Order)"
      - Actual_Amount Sum = sum(Actual_Amount)
      - DT_grain Sum = sum(DT_grain)
      - AOP_Amount Sum = sum(AOP_Amount)
      - IDCLASS Maximum = max(IDCLASS)
      - DS_AOP Sum = sum(DS_AOP)
      - DS_TT Sum = sum(DS_TT)
      - CKKM_AOP Sum = sum(CKKM_AOP)
      - CKKM_TT Sum = sum(CKKM_TT)
      - LNGiao Sum = sum(LNGiao)
      - LNST Sum = sum(LNST)
      - LNGop Sum = sum(LNGop)
      - TyLeXD Sum = sum(TyLeXD)
    - step: RenameColumns_1
      type: RenameColumns
      label: Rename Columns 1
      renames:
      - DS_AOP Sum -> DS_AOP
      - DS_TT Sum -> DS_TT
      - CKKM_AOP Sum -> CKKM_AOP
      - CKKM_TT Sum -> CKKM_TT
      - LNGiao Sum -> LNGiao
      - LNST Sum -> LNST
      - LNGop Sum -> LNGop
      - TyLeXD Sum -> TyLeXD
    - step: AddColumns_2
      type: AddColumns
      label: Add Columns 2
      adds:
      - name: DS_ConPhaiThucHien
        expression: '"CUSTCOL_SCV_AOP_DOANH_SO Sum" - "DS_TT"'
      - name: CKKM_ConDuocSuDung
        expression: '"CUSTCOL_SCV_AOP_CP_CKKM Sum" - "CKKM_TT"'
      - name: LN_ConPhaiThucHien
        expression: ' "CUSTCOL_SCV_AOP_LN_GIAO Sum" - "LNGop"'
      - name: PhanTram_CKKM_AOP
        expression: ' "CUSTCOL_SCV_AOP_CKKM Average"'
      - name: PhanTram_LoiNhuan_AOP
        expression: CASE WHEN TenNganh = 'Cold & Hygen care' THEN 0.012 WHEN TenNganh = 'Home care' THEN 0.021 WHEN TenNganh
          = 'Sanitary care' THEN 0.014 WHEN TenNganh = 'Water care' THEN 0.030 ELSE 0 END
      - name: TyTrong_SP_Moi
        expression: CASE WHEN TenNganh = 'Cold & Hygen care' THEN 0.0734 WHEN TenNganh = 'Home care' THEN 0.2884 WHEN TenNganh
          = 'Sanitary care' THEN 0.0 WHEN TenNganh = 'Water care' THEN 0.0472 ELSE 0 END
      - name: TyTrong_SP_Moi_dyn
        expression: '"DT_SPmoi_ng" / "DT_ng"'
    - step: OutputDataset_0
      type: OutputDataset
      label: Save Data
      output_dataset: Daily_Nganh_Report
      save_type: obi
      output_type: Create
      output_columns:
      - PERIODNAME
      - AsOfDate
      - TenNganh
      - Metric_Code Sum
      - "\uFEFFSort_Order Sum"
      - Actual_Amount Sum
      - DT_grain Sum
      - AOP_Amount Sum
      - IDCLASS Maximum
      - DS_AOP
      - DS_TT
      - CKKM_AOP
      - CKKM_TT
      - LNGiao
      - LNST
      - LNGop
      - TyLeXD
      - PERIODNAME_1
      - CLASS
      - CUSTCOL_SCV_AOP_DOANH_SO Sum
      - NETAMOUNT Sum
      - CUSTCOL_SCV_AOP_CP_CKKM Sum
      - CUSTCOL_SCV_AOP_LN_GIAO Sum
      - CUSTCOL_SCV_AOP_CKKM Average
      - CUSTCOL_SCV_AOP_LOI_NHUAN Sum
      - DS_ConPhaiThucHien
      - CKKM_ConDuocSuDung
      - LN_ConPhaiThucHien
      - PhanTram_CKKM_AOP
      - PhanTram_LoiNhuan_AOP
      - TyTrong_SP_Moi
    - step: InputDataset_2
      type: InputDataset
      label: (KGR) AOP_UPDATE
      input_dataset: AOP LINE CF
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_AOP_HEADER_CF:
        - CUSTBODY_SCV_AOP_LOAI_BAO_CAO
        DW_NS_X_AOP_LINE_SF:
        - CLASS
        - NETAMOUNT
        DW_NS_ACCOUNTINGPERIOD_D:
        - PERIODNAME
        DW_NS_X_AOP_HEADER_SF:
        - POSTINGPERIOD
        DW_NS_X_AOP_LINE_CF:
        - CUSTCOL_SCV_AOP_DOANH_SO
        - CUSTCOL_SCV_AOP_CP_CKKM
        - CUSTCOL_SCV_AOP_LN_GIAO
        - CUSTCOL_SCV_AOP_CKKM
        - CUSTCOL_SCV_AOP_LOI_NHUAN
    - step: Filter_0
      type: Filter
      label: Filter
      filters:
      - '"CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 4 and 4'
    - step: GroupBy_0
      type: GroupBy
      label: Aggregate
      group_by:
      - PERIODNAME
      - CLASS
      aggregations:
      - CUSTCOL_SCV_AOP_DOANH_SO Sum = sum(CUSTCOL_SCV_AOP_DOANH_SO)
      - NETAMOUNT Sum = sum(NETAMOUNT)
      - CUSTCOL_SCV_AOP_CP_CKKM Sum = sum(CUSTCOL_SCV_AOP_CP_CKKM)
      - CUSTCOL_SCV_AOP_LN_GIAO Sum = sum(CUSTCOL_SCV_AOP_LN_GIAO)
      - CUSTCOL_SCV_AOP_CKKM Average = avg(CUSTCOL_SCV_AOP_CKKM)
      - CUSTCOL_SCV_AOP_LOI_NHUAN Sum = sum(CUSTCOL_SCV_AOP_LOI_NHUAN)
    - step: Join_1
      type: Join
      label: Join 1
      join_type: innerjoin
      left: RenameColumns_1
      right: GroupBy_0
      'on':
      - PERIODNAME = PERIODNAME
      - IDCLASS Maximum = CLASS
      condition: and
    - step: InputDataset_1
      type: InputDataset
      label: SPmoi_ng_v3
      input_dataset: SPmoi_ng_v3
      dataset_type: parquet
    - step: Join_0
      type: Join
      label: Join
      join_type: innerjoin
      left: Join_1
      right: InputDataset_1
      'on':
