    output_datasets:
    - KGR_DS_ACTUAL_AOP_MONTHLY_v2
    in_closure: false
    n_steps: 21
    steps:
    - step: InputDataset_0
      type: InputDataset
      label: (KGR) DTF_ACTUAL_AOP_EXPENSE
      input_dataset: (KGR) DTF_ACTUAL_AOP_EXPENSE
      dataset_type: db
    - step: AddColumns_0
      type: AddColumns
      label: Pivot LNG & LNTT theo tháng
      adds:
      - name: Lợi nhuận gộp kinh doanh T1
        expression: '0'
      - name: Lợi nhuận trước thuế T1
        expression: '0'
      - name: Lợi nhuận gộp kinh doanh T2
        expression: '0'
      - name: Lợi nhuận trước thuế T2
        expression: '0'
      - name: Lợi nhuận gộp kinh doanh T3
        expression: IFNULL(CASE WHEN "Posting_Period"='39' THEN "LNG KD" ELSE 0 END,0)
      - name: Lợi nhuận trước thuế T3
        expression: IFNULL(CASE WHEN "Posting_Period"='39' THEN "LNTT" ELSE 0 END,0)
      - name: Lợi nhuận gộp kinh doanh T4
        expression: IFNULL(CASE WHEN "Posting_Period"='41' THEN "LNG KD" ELSE 0 END,0)
      - name: Lợi nhuận trước thuế T4
        expression: IFNULL(CASE WHEN "Posting_Period"='41' THEN "LNTT" ELSE 0 END,0)
      - name: Lợi nhuận gộp kinh doanh T5
        expression: IFNULL(CASE WHEN "Posting_Period"='42' THEN "LNG KD" ELSE 0 END,0)
      - name: Lợi nhuận trước thuế T5
        expression: IFNULL(CASE WHEN "Posting_Period"='42' THEN "LNTT" ELSE 0 END,0)
      - name: Lợi nhuận gộp kinh doanh T6
        expression: IFNULL(CASE WHEN "Posting_Period"='43' THEN "LNG KD" ELSE 0 END,0)
      - name: Lợi nhuận trước thuế T6
        expression: IFNULL(CASE WHEN "Posting_Period"='43' THEN "LNTT" ELSE 0 END,0)
      - name: Lợi nhuận gộp kinh doanh T7
        expression: '0'
      - name: Lợi nhuận trước thuế T7
        expression: '0'
      - name: Lợi nhuận gộp kinh doanh T8
        expression: '0'
      - name: Lợi nhuận trước thuế T8
        expression: '0'
      - name: Lợi nhuận gộp kinh doanh T9
        expression: '0'
      - name: Lợi nhuận trước thuế T9
        expression: '0'
      - name: Lợi nhuận gộp kinh doanh T10
        expression: '0'
      - name: Lợi nhuận trước thuế T10
        expression: '0'
      - name: Lợi nhuận gộp kinh doanh T11
        expression: '0'
      - name: Lợi nhuận trước thuế T11
        expression: '0'
      - name: Lợi nhuận gộp kinh doanh T12
        expression: '0'
      - name: Lợi nhuận trước thuế T12
        expression: '0'
    - step: GroupBy_0
      type: GroupBy
      label: Gộp theo Sub/Class/SC/Chain
      group_by:
      - Sub_Id
      - Class Id
      - SC id
      - Chain Id
      aggregations:
      - Doanh số T1 = sum(DS T1)
      - Doanh số T2 = sum(DS T2)
      - Doanh số T3 = sum(DS T3)
      - Doanh số T4 = sum(DS T4)
      - Doanh số T5 = sum(DS T5)
      - Doanh số T6 = sum(DS T6)
      - Doanh số T7 = sum(DS T7)
      - Doanh số T8 = sum(DS T8)
      - Doanh số T9 = sum(DS T9)
      - Doanh số T10 = sum(DS T10)
      - Doanh số T11 = sum(DS T11)
      - Doanh số T12 = sum(DS T12)
      - Lợi nhuận gộp kinh doanh T1 = sum(Lợi nhuận gộp kinh doanh T1)
      - Lợi nhuận trước thuế T1 = sum(Lợi nhuận trước thuế T1)
      - Lợi nhuận gộp kinh doanh T2 = sum(Lợi nhuận gộp kinh doanh T2)
      - Lợi nhuận trước thuế T2 = sum(Lợi nhuận trước thuế T2)
      - Lợi nhuận gộp kinh doanh T3 = sum(Lợi nhuận gộp kinh doanh T3)
      - Lợi nhuận trước thuế T3 = sum(Lợi nhuận trước thuế T3)
      - Lợi nhuận gộp kinh doanh T4 = sum(Lợi nhuận gộp kinh doanh T4)
      - Lợi nhuận trước thuế T4 = sum(Lợi nhuận trước thuế T4)
      - Lợi nhuận gộp kinh doanh T5 = sum(Lợi nhuận gộp kinh doanh T5)
      - Lợi nhuận trước thuế T5 = sum(Lợi nhuận trước thuế T5)
      - Lợi nhuận gộp kinh doanh T6 = sum(Lợi nhuận gộp kinh doanh T6)
      - Lợi nhuận trước thuế T6 = sum(Lợi nhuận trước thuế T6)
      - Lợi nhuận gộp kinh doanh T7 = sum(Lợi nhuận gộp kinh doanh T7)
      - Lợi nhuận trước thuế T7 = sum(Lợi nhuận trước thuế T7)
      - Lợi nhuận gộp kinh doanh T8 = sum(Lợi nhuận gộp kinh doanh T8)
      - Lợi nhuận trước thuế T8 = sum(Lợi nhuận trước thuế T8)
      - Lợi nhuận gộp kinh doanh T9 = sum(Lợi nhuận gộp kinh doanh T9)
      - Lợi nhuận trước thuế T9 = sum(Lợi nhuận trước thuế T9)
      - Lợi nhuận gộp kinh doanh T10 = sum(Lợi nhuận gộp kinh doanh T10)
      - Lợi nhuận trước thuế T10 = sum(Lợi nhuận trước thuế T10)
      - Lợi nhuận gộp kinh doanh T11 = sum(Lợi nhuận gộp kinh doanh T11)
      - Lợi nhuận trước thuế T11 = sum(Lợi nhuận trước thuế T11)
      - Lợi nhuận gộp kinh doanh T12 = sum(Lợi nhuận gộp kinh doanh T12)
      - Lợi nhuận trước thuế T12 = sum(Lợi nhuận trước thuế T12)
    - step: AddColumns_1
      type: AddColumns
      label: Lũy kế T3+T4+T5
      adds:
      - name: Doanh số lũy kế
        expression: IFNULL("Doanh số T3"+"Doanh số T4"+"Doanh số T5",0)
      - name: Lợi nhuận gộp kinh doanh lũy kế
        expression: IFNULL("Lợi nhuận gộp kinh doanh T3"+"Lợi nhuận gộp kinh doanh T4"+"Lợi nhuận gộp kinh doanh T5",0)
      - name: Lợi nhuận trước thuế lũy kế
        expression: IFNULL("Lợi nhuận trước thuế T3"+"Lợi nhuận trước thuế T4"+"Lợi nhuận trước thuế T5",0)
      - name: __j
        expression: '1'
    - step: Filter_AOP
      type: Filter
      label: Lọc kỳ 39/41/42 (AOP)
      filters:
      - '"Posting_Period" IN(''39'',''41'',''42'')'
    - step: AddColumns_TDj
      type: AddColumns
      label: Thêm khóa TĐ (__j=1)
      adds:
      - name: __j
        expression: '1'
    - step: GroupBy_TDmax
      type: GroupBy
      label: 'AOP TĐ: MAX theo kỳ'
      group_by:
      - __j
      - Posting_Period
      aggregations:
      - m_dsTD = max(Doanh số (AOP) TĐ)
      - m_lnTD = max(LN Giao (AOP) TĐ)
    - step: GroupBy_TDsum
      type: GroupBy
      label: 'AOP TĐ: SUM 3 kỳ'
      group_by:
      - __j
      aggregations:
      - Doanh số kế hoạch lũy kế TĐ = sum(m_dsTD)
      - Lợi nhuận kế hoạch lũy kế TĐ = sum(m_lnTD)
    - step: GroupBy_NGmax
      type: GroupBy
      label: 'AOP Ngành: MAX theo kỳ'
      group_by:
      - Class Id
      - Posting_Period
      aggregations:
      - m_dsNG = max(Doanh số (AOP) Ngành)
      - m_lnNG = max(LN Giao (AOP) Ngành)
    - step: GroupBy_NGsum
      type: GroupBy
      label: 'AOP Ngành: SUM 3 kỳ'
      group_by:
