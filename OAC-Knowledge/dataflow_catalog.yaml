      label: Filter 8
      filters:
      - '"Check ID = 0" IN(''T'')'
    - step: AddColumns_19
      type: AddColumns
      label: Check ID = 0
      adds:
      - name: Check ID = 0
        expression: Case When "ID" = 0 then 'T' else 'F' End
    - step: AddColumns_20
