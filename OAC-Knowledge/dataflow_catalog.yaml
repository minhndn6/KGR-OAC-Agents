  KGR_DF_Group Rate As-Of:
    dataflow_id: '''minhndn@bizin.vn''.''KGR_DF_Group Rate As-Of'''
    name: KGR_DF_Group Rate As-Of
    object_path:
    last_modified: '2026-05-27'
    version: '2.6'
    input_datasets:
    - (KGR) DTF_CALC_INVOICE_MEMO_#
    output_datasets:
    - KGR_DTF_CHI_PHI_XUC_TIEN
    in_closure: false
    n_steps: 14
    steps:
    - step: InputDataset_0
      type: InputDataset
      label: (KGR) DTF_CALC_INVOICE_MEMO_#
      input_dataset: (KGR) DTF_CALC_INVOICE_MEMO_#
      dataset_type: db
    - step: AddColumns_0
      type: AddColumns
      label: Add Columns
      adds:
      - name: a10_CP Xúc tiến bán hàng
        expression: '247258890.4666666'
    - step: Filter_0
      type: Filter
      label: Filter
      filters:
      - '"POSTINGPERIOD" between 42 and 42'
    - step: Filter_1
      type: Filter
      label: Filter 1
      filters:
      - '"ACCTTYPE" IN(''Income'')'
    - step: Branch_0
      type: Branch
      label: Branch
    - step: RenameColumns_0
      type: RenameColumns
      label: Rename Columns
      renames:
      - TRANDATE -> AsOfDate
    - step: SelectColumns_0
      type: SelectColumns
      label: Select Columns
      selected_columns:
      - AsOfDate
      - PERIODNAME
      - POSTINGPERIOD
    - step: GroupBy_0
      type: GroupBy
      label: Distinct AsOf list
      group_by:
      - AsOfDate
      - PERIODNAME
      aggregations:
      - POSTINGPERIOD Count = count(POSTINGPERIOD)
    - step: SelectColumns_1
      type: SelectColumns
      label: Select Columns 1
      selected_columns:
      - POSTINGPERIOD
      - PERIODNAME
      - TRANDATE
      - SUBSIDIARY
      - Tên Ngành
      - ACCTTYPE
      - Giá Vốn
      - TAX AMT
      - Doanh số thực tế
      - Doanh thu ngành khác
      - Doanh thu thực tế
      - a10_CP Xúc tiến bán hàng
    - step: Join_0
      type: Join
      label: Join non-equi cum
      join_type: rightouterjoin
      left: SelectColumns_1
      right: GroupBy_0
      'on':
      - PERIODNAME = PERIODNAME
      - TRANDATE <= AsOfDate
      condition: and
    - step: GroupBy_1
      type: GroupBy
      label: Aggregate cumulative
      group_by:
      - PERIODNAME
      - AsOfDate
      aggregations:
      - DT_Cum_GROUP = sum(Doanh thu thực tế)
      - a10_CP_Xuc_tien_ban_hang_max = max(a10_CP Xúc tiến bán hàng)
    - step: AddColumns_2
      type: AddColumns
      label: a10_CP_Xuc_tien_ban_hang_AOD
      adds:
      - name: a10_CP_Xuc_tien_ban_hang_AOD
        expression: DAYOFMONTH("AsOfDate")*"a10_CP_Xuc_tien_ban_hang_max"
    - step: AddColumns_3
      type: AddColumns
      label: Rate_Xuc_tien_ban_hang
      adds:
      - name: Rate_Xuc_tien_ban_hang
        expression: '"a10_CP_Xuc_tien_ban_hang_AOD"/"DT_Cum_GROUP"'
    - step: OutputDataset_2
      type: OutputDataset
      label: Save Data 2
      output_dataset: KGR_DTF_CHI_PHI_XUC_TIEN
      save_type: conn
      output_type: Create
      output_columns:
      - PERIODNAME
      - AsOfDate
      - DT_Cum_GROUP
      - a10_CP_Xuc_tien_ban_hang_max
      - a10_CP_Xuc_tien_ban_hang_AOD
      - Rate_Xuc_tien_ban_hang
