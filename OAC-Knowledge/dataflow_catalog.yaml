      - name: VALID_FLAG_RSHN_NVKD
        expression: |-
          CASE WHEN
          "TRANDATE" >= "CUSTRECORD_SCV_TY_LE_RSHN_TU_NGAY"
          AND
          "TRANDATE" <= "CUSTRECORD_SCV_TY_LE_RSHN_DEN_NGAY"
          THEN 'T'
          ELSE 'F'
          END
