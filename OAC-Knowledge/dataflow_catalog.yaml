      type: RenameColumns
      label: Rename Columns
      renames:
      - TRANDATE -> AsOfDate
    - step: SelectColumns_0
      type: SelectColumns
      label: Select Columns
      selected_columns:
      - PERIODNAME
      - ID CLASS
      - AsOfDate
      - POSTINGPERIOD
    - step: GroupBy_0
      type: GroupBy
      label: Distinct AsOf list
      group_by:
      - AsOfDate
