      - mnL = min(Chi phí Lương)
      - mxR = max(Chi phí Roadshow HN)
      - mnR = min(Chi phí Roadshow HN)
      - mxK = max(Chi phí CTTK)
      - mnK = min(Chi phí CTTK)
    - step: K_GBdedup
