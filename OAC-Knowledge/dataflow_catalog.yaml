      dataset_type: db
    - step: AddColumns_0
      type: AddColumns
      label: Add Columns
      adds:
      - name: DS_TT
        expression: CASE WHEN Metric_Code = 1 THEN Actual_Amount END
      - name: CKKM_TT
        expression: CASE WHEN Metric_Code = 5 THEN Actual_Amount END
      - name: LNST
        expression: CASE WHEN Metric_Code = 23 THEN Actual_Amount END
      - name: LNGop
        expression: CASE WHEN Metric_Code = 4 THEN Actual_Amount END
      - name: TyLeXD
        expression: CASE WHEN Metric_Code = 24 THEN Actual_Amount END
    - step: RenameColumns_0
      type: RenameColumns
      label: Rename Columns
      renames:
      - ID CLASS -> IDCLASS
    - step: AddColumns_1
      type: AddColumns
      label: Add Columns 1
      adds:
      - name: TenNganh
        expression: CASE WHEN IDCLASS = 1 THEN 'Water care' WHEN IDCLASS = 2 THEN 'Home care' WHEN IDCLASS = 3 THEN 'Cold
          & Hygen care' WHEN IDCLASS = 4 THEN 'Sanitary care' ELSE 'Khac' END
    - step: GroupBy_1
      type: GroupBy
