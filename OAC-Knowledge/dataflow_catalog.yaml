      - name: a24
        expression: CASE WHEN "DS Đỏ Sum_ng" = 0 THEN NULL ELSE "DS Xanh Sum_ng" / "DS Đỏ Sum_ng" END
    - step: AddColumns_2
      type: AddColumns
      label: M1 wide _k
      adds:
      - name: _k
        expression: '1'
    - step: InputDataset_2
      type: InputDataset
      label: Metric_Dim
      input_dataset: Metric_Dim
      dataset_type: datamodel
      physical_tables:
        Metric_Dim:
        - "\uFEFFSort_Order"
        - Metric_Code
        - Metric_Name
        - Type
    - step: AddColumns_11
      type: AddColumns
      label: M2 dim _k
      adds:
      - name: _k
        expression: '1'
    - step: Join_2
      type: Join
      label: M3 Join cross
      join_type: leftouterjoin
      left: AddColumns_2
      right: AddColumns_11
      'on':
      - _k = _k
      condition: and
    - step: AddColumns_12
      type: AddColumns
      label: M4 Actual_Amount
      adds:
      - name: Actual_Amount
        expression: |-
          CASE WHEN "Metric_Code" = 1 THEN "a1_ng"
               WHEN "Metric_Code" = 2 THEN "DT_ng"
               WHEN "Metric_Code" = 3 THEN "a3_ng"
               WHEN "Metric_Code" = 4 THEN "a4"
               WHEN "Metric_Code" = 5 THEN "a5_ng"
               WHEN "Metric_Code" = 6 THEN "a6"
               WHEN "Metric_Code" = 7 THEN "a7"
               WHEN "Metric_Code" = 8 THEN "a8"
               WHEN "Metric_Code" = 9 THEN "a9"
               WHEN "Metric_Code" = 10 THEN "a10"
               WHEN "Metric_Code" = 11 THEN "a11"
               WHEN "Metric_Code" = 12 THEN "a12"
               WHEN "Metric_Code" = 13 THEN "a13"
               WHEN "Metric_Code" = 14 THEN "a14"
               WHEN "Metric_Code" = 15 THEN "a15"
               WHEN "Metric_Code" = 16 THEN "a16"
               WHEN "Metric_Code" = 17 THEN "a17"
               WHEN "Metric_Code" = 101 THEN "adp"
               WHEN "Metric_Code" = 18 THEN "a18"
               WHEN "Metric_Code" = 19 THEN "a19"
               WHEN "Metric_Code" = 20 THEN "a20"
               WHEN "Metric_Code" = 21 THEN "a21"
               WHEN "Metric_Code" = 22 THEN "a22"
               WHEN "Metric_Code" = 23 THEN CASE WHEN "a22" > 0 THEN "a22" * 0.8 ELSE "a22" END
               WHEN "Metric_Code" = 24 THEN "a24"
               ELSE NULL END
      - name: DT_grain
        expression: '"DT_TĐ"'
      - name: AOP_Amount
        expression: CASE "Metric_Code" WHEN 1 THEN "AOP_DoanhSo_ng" WHEN 2 THEN "AOP_DT_ng" WHEN 3 THEN "AOP_GiaVon_ng" WHEN
          4 THEN ("AOP_DT_ng" - "AOP_GiaVon_ng") WHEN 5 THEN "AOP_CKKM_ng" WHEN 6 THEN "AOP_PER_A6_1" WHEN 7 THEN "AOP_PER_A7_1"
          WHEN 8 THEN "AOP_PER_A8_1" WHEN 9 THEN (("AOP_DT_ng" - "AOP_GiaVon_ng") - "AOP_CKKM_ng" - "AOP_PER_A6_1" - "AOP_PER_A7_1"
          - "AOP_PER_A8_1") WHEN 10 THEN ABS("AOP_AMT_A10_ng") WHEN 11 THEN ((("AOP_DT_ng" - "AOP_GiaVon_ng") - "AOP_CKKM_ng"
          - "AOP_PER_A6_1" - "AOP_PER_A7_1" - "AOP_PER_A8_1") - ABS("AOP_AMT_A10_ng")) WHEN 12 THEN ABS("AOP_AMT_A12_ng")
          WHEN 13 THEN (((("AOP_DT_ng" - "AOP_GiaVon_ng") - "AOP_CKKM_ng" - "AOP_PER_A6_1" - "AOP_PER_A7_1" - "AOP_PER_A8_1")
          - ABS("AOP_AMT_A10_ng")) - ABS("AOP_AMT_A12_ng")) WHEN 14 THEN ("AOP_PER_A15_1" + "AOP_PER_A16_1" + "AOP_PER_A17_1"
          + ABS("AOP_AMT_A101_ng") + ABS("AOP_AMT_A18_ng")) WHEN 15 THEN "AOP_PER_A15_1" WHEN 16 THEN "AOP_PER_A16_1" WHEN
          17 THEN "AOP_PER_A17_1" WHEN 101 THEN ABS("AOP_AMT_A101_ng") WHEN 18 THEN ABS("AOP_AMT_A18_ng") WHEN 19 THEN ABS("AOP_AMT_A19_ng")
          WHEN 20 THEN ((((("AOP_DT_ng" - "AOP_GiaVon_ng") - "AOP_CKKM_ng" - "AOP_PER_A6_1" - "AOP_PER_A7_1" - "AOP_PER_A8_1")
          - ABS("AOP_AMT_A10_ng")) - ABS("AOP_AMT_A12_ng")) - ("AOP_PER_A15_1" + "AOP_PER_A16_1" + "AOP_PER_A17_1" + ABS("AOP_AMT_A101_ng")
          + ABS("AOP_AMT_A18_ng")) + ABS("AOP_AMT_A19_ng")) WHEN 21 THEN ABS("AOP_AMT_A21_ng") WHEN 22 THEN ABS("AOP_AMT_A104_ng")
          WHEN 23 THEN ABS("AOP_AMT_A105_ng") WHEN 24 THEN CASE WHEN "DS Đỏ Sum" = 0 THEN NULL ELSE "DS Xanh Sum" / "DS Đỏ
          Sum" END ELSE NULL END
    - step: SelectColumns_2
      type: SelectColumns
      label: M5 Select 7 cols
      selected_columns:
      - PERIODNAME
      - Metric_Code
      - Metric_Name
      - "\uFEFFSort_Order"
      - Type
      - Actual_Amount
