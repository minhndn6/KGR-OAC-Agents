    - step: Select_Sectors
      type: SelectColumns
      label: Keep 5 cols (sectors)
      selected_columns:
      - Metric_Name
      - AsOfDate
      - Actual_Amount
      - AOP_Amount
      - ID CLASS
    - step: GroupBy_Group
      type: GroupBy
      label: SUM over sectors
      group_by:
