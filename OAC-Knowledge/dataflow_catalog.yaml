      - Lợi nhuận gộp kinh doanh T12 = sum(Lợi nhuận gộp kinh doanh T12)
      - Lợi nhuận trước thuế T12 = sum(Lợi nhuận trước thuế T12)
    - step: ACluy
      type: AddColumns
      adds:
      - name: Doanh số lũy kế
        expression: IFNULL("Doanh số T3"+"Doanh số T4"+"Doanh số T5",0)
      - name: Lợi nhuận gộp kinh doanh lũy kế
        expression: IFNULL("Lợi nhuận gộp kinh doanh T3"+"Lợi nhuận gộp kinh doanh T4"+"Lợi nhuận gộp kinh doanh T5",0)
      - name: Lợi nhuận trước thuế lũy kế
        expression: IFNULL("Lợi nhuận trước thuế T3"+"Lợi nhuận trước thuế T4"+"Lợi nhuận trước thuế T5",0)
      - name: __j
        expression: '1'
    - step: FTD
      type: Filter
      filters:
      - '"Posting_Period" IN(''39'',''41'',''42'')'
    - step: GBtdp
      type: GroupBy
      group_by:
      - Posting_Period
      aggregations:
      - tdds = max(Doanh số (AOP) TĐ)
      - tdln = max(LN Giao (AOP) TĐ)
    - step: ACtdj
      type: AddColumns
      adds:
      - name: __j
        expression: '1'
    - step: GBtd
      type: GroupBy
      group_by:
      - __j
      aggregations:
      - Doanh số kế hoạch lũy kế TĐ = sum(tdds)
      - Lợi nhuận kế hoạch lũy kế TĐ = sum(tdln)
    - step: FNH
      type: Filter
      filters:
      - '"Posting_Period" IN(''39'',''41'',''42'')'
    - step: GBnhp
      type: GroupBy
      group_by:
      - Class Id
      - Posting_Period
      aggregations:
      - nhds = max(Doanh số (AOP) Ngành)
      - nhln = max(LN Giao (AOP) Ngành)
    - step: GBnh
      type: GroupBy
      group_by:
      - Class Id
      aggregations:
      - Doanh số kế hoạch lũy kế Ngành = sum(nhds)
      - Lợi nhuận kế hoạch lũy kế Ngành = sum(nhln)
    - step: FKE
      type: Filter
      filters:
      - '"Posting_Period" IN(''39'',''41'',''42'')'
    - step: GBkep
      type: GroupBy
      group_by:
      - SC id
      - Posting_Period
      aggregations:
      - keds = max(Doanh số (AOP) Kênh)
      - keln = max(LN Giao (AOP) Kênh)
    - step: GBke
      type: GroupBy
      group_by:
      - SC id
      aggregations:
      - Doanh số kế hoạch lũy kế Kênh = sum(keds)
      - Lợi nhuận kế hoạch lũy kế Kênh = sum(keln)
    - step: FCH
      type: Filter
      filters:
      - '"Posting_Period" IN(''39'',''41'',''42'')'
    - step: GBchp
      type: GroupBy
      group_by:
      - Chain Id
      - Posting_Period
      aggregations:
      - chds = max(Doanh số (AOP) Chuỗi)
      - chln = max(LN Giao (AOP) Chuỗi)
    - step: GBch
      type: GroupBy
      group_by:
      - Chain Id
      aggregations:
      - Doanh số kế hoạch lũy kế Chuỗi = sum(chds)
      - Lợi nhuận kế hoạch lũy kế Chuỗi = sum(chln)
    - step: JTD
      type: Join
      join_type: leftouterjoin
      left: ACluy
      right: GBtd
      'on':
      - __j = __j
      condition: and
    - step: JNH
      type: Join
      join_type: leftouterjoin
      left: JTD
      right: GBnh
      'on':
      - Class Id = Class Id
      condition: and
    - step: JKE
      type: Join
      join_type: leftouterjoin
      left: JNH
      right: GBke
      'on':
      - SC id = SC id
      condition: and
    - step: JCH
      type: Join
      join_type: leftouterjoin
      left: JKE
      right: GBch
      'on':
      - Chain Id = Chain Id
      condition: and
    - step: OUT
      type: OutputDataset
      output_dataset: KGR_DS_AOP_v3test
      save_type: obi
      output_type: Create
      dataset_description: AOP fix test
