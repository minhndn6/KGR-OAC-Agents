      type: AddColumns
      adds:
      - name: Chi phí Lương
        expression: CASE WHEN ABS("mxL") >= ABS("mnL") THEN "mxL" ELSE "mnL" END
      - name: Chi phí Roadshow HN
        expression: CASE WHEN ABS("mxR") >= ABS("mnR") THEN "mxR" ELSE "mnR" END
      - name: Chi phí CTTK
        expression: CASE WHEN ABS("mxK") >= ABS("mnK") THEN "mxK" ELSE "mnK" END
    - step: K_recomb
      type: AddColumns
      adds:
      - name: Chi phí Lương
        expression: CASE WHEN ABS("mxL") >= ABS("mnL") THEN "mxL" ELSE "mnL" END
      - name: Chi phí Roadshow HN
        expression: CASE WHEN ABS("mxR") >= ABS("mnR") THEN "mxR" ELSE "mnR" END
      - name: Chi phí CTTK
