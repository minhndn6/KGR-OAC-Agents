      - DS T10
      - DS T11
      - DS T12
      - a5_CP chiết khấu khuyến mại
      - a6_CP nhân viên KD
      - a7_CP roadshow hội nghị
      - a8_CP công tác, tiếp khách KD
      - a10_CP xúc tiến bán hàng
      - a12_CP nhân viên BO
      - a15_+ CP vận chuyển
      - a16_+ CP bảo hành
      - a17_+ CP tài chính
      - a18_+ CP khác
      - Doanh thu ngành khác
      - Hoàn thành doanh số TT_TD
      - Hoàn thành doanh số quy đổi_TD
      - Hoàn thành doanh số TT_NH
      - Hoàn thành doanh số quy đổi_NH
      - Hoàn thành doanh số TT_SC
      - Hoàn thành doanh số quy đổi_SC
      - Hoàn thành doanh số TT_Chain
      - Hoàn thành doanh số quy đổi_Chain
      - CP tồn kho
      - LNG KD
      - LN XTBH
      - LNNV
      - LN QLVH
      - CP Dự phòng
      - LNTT
    - step: AddColumns_1
      type: AddColumns
      label: Add LNG KD
      adds:
      - name: LNG KD
        expression: IFNULL("LN Gộp",0) - IFNULL("a5_CP chiết khấu khuyến mại",0) - IFNULL("a6_CP nhân viên KD",0) - IFNULL("a7_CP
          roadshow hội nghị",0) - IFNULL("a8_CP công tác, tiếp khách KD",0)
    - step: AddColumns_2
      type: AddColumns
      label: Add LN XTBH
      adds:
      - name: LN XTBH
        expression: IFNULL("LNG KD",0) - IFNULL("a10_CP xúc tiến bán hàng",0)
    - step: AddColumns_3
      type: AddColumns
      label: Add LN NV
      adds:
      - name: LNNV
        expression: IFNULL("LN XTBH",0) - IFNULL("a12_CP nhân viên BO",0)
    - step: AddColumns_4
      type: AddColumns
      label: Add LN QLVH
      adds:
      - name: LN QLVH
        expression: IFNULL("LNNV",0) - IFNULL("a15_+ CP vận chuyển",0) - IFNULL("a16_+ CP bảo hành",0) - IFNULL("a17_+ CP
          tài chính",0) - IFNULL("a18_+ CP khác",0) - IFNULL("CP tồn kho",0) + IFNULL("Doanh thu ngành khác",0)
    - step: AddColumns_6
      type: AddColumns
      label: Add CP tồn kho thanh lý
      adds:
      - name: CP tồn kho
        expression: IFNULL("Doanh thu thực tế" * 0.015,0)
    - step: AddColumns_7
      type: AddColumns
      label: Add CP dự phòng
      adds:
      - name: CP Dự phòng
        expression: IFNULL(IFNULL("LN QLVH",0 )* 0.21,0)
    - step: AddColumns_8
      type: AddColumns
      label: Add LNTT
      adds:
      - name: LNTT
        expression: IFNULL((IFNULL("LN QLVH",0) - IFNULL("CP Dự phòng",0)),0)
    - step: AddColumns_5
      type: AddColumns
      label: Add % Hoàn thành
      adds:
      - name: Hoàn thành doanh số TT_TD
        expression: 'IFNULL("Doanh số thực tế"/"Doanh số (AOP) TĐ",0) '
      - name: Hoàn thành doanh số quy đổi_TD
        expression: 'IFNULL("Doanh số quy đổi"/"Doanh số (AOP) TĐ",0) '
      - name: Hoàn thành doanh số TT_NH
        expression: 'IFNULL("Doanh số thực tế"/"Doanh số (AOP) Ngành",0) '
      - name: Hoàn thành doanh số quy đổi_NH
        expression: 'IFNULL("Doanh số quy đổi"/"Doanh số (AOP) Ngành",0) '
      - name: Hoàn thành doanh số TT_SC
        expression: 'IFNULL("Doanh số thực tế"/"Doanh số (AOP) Kênh",0) '
      - name: Hoàn thành doanh số quy đổi_SC
        expression: 'IFNULL("Doanh số quy đổi"/"Doanh số (AOP) Kênh",0) '
      - name: Hoàn thành doanh số TT_Chain
        expression: 'IFNULL("Doanh số thực tế"/"Doanh số (AOP) Chuỗi",0) '
      - name: Hoàn thành doanh số quy đổi_Chain
        expression: 'IFNULL("Doanh số quy đổi"/"Doanh số (AOP) Chuỗi",0) '
    - step: GroupBy_1
      type: GroupBy
      label: Aggregate 1
      group_by:
      - Posting_Period
      - Sub_Id
      - Class Id
      - SC id
      - Chain Id
      aggregations:
      - Doanh số thực tế = sum(Doanh số thực tế)
      - Doanh thu thực tế = sum(Doanh thu thực tế)
      - Doanh số quy đổi = sum(Doanh số quy đổi)
      - Doanh số lũy kế = sum(Doanh số lũy kế)
      - Giá Vốn = sum(Giá Vốn)
      - LN Gộp = sum(LN Gộp)
      - Doanh số (AOP) TĐ = max(Doanh số (AOP) TĐ)
      - LN Giao (AOP) TĐ = max(LN Giao (AOP) TĐ)
      - Doanh số (AOP) Ngành = max(Doanh số (AOP) Ngành)
      - LN Giao (AOP) Ngành = max(LN Giao (AOP) Ngành)
      - Doanh số (AOP) Kênh = max(Doanh số (AOP) Kênh)
      - LN Giao (AOP) Kênh = max(LN Giao (AOP) Kênh)
      - Doanh số (AOP) Chuỗi = max(Doanh số (AOP) Chuỗi)
      - LN Giao (AOP) Chuỗi = max(LN Giao (AOP) Chuỗi)
      - DS T1 = sum(DS T1)
      - DS T2 = sum(DS T2)
