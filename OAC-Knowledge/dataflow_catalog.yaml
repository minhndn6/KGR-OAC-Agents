_meta:
  purpose: 'Mọi dataflow KGR: chuỗi step (Join/Aggregate/AddColumns/Filter/Union/Output), input→output dataset, logic biến
    đổi đầy đủ (expression giữ nguyên).'
  extracted_live: '2026-06-20'
  total_dataflows: 40
  note: in_closure=true nếu output dataset nằm trong chuỗi nuôi 1 trong 4 workbook. Flow in_closure=false là ứng viên archive
    (xem archive_recommendations.md).
dataflows:
  KGR_DF_TD_Metrics_bk:
    dataflow_id: '''minhndn@bizin.vn''.''KGR_DF_TD_Metrics_bk'''
    name: KGR_DF_TD_Metrics_bk
    object_path:
    last_modified: '2026-06-20'
    version: '2.6'
    input_datasets:
    - (KGR) DTF_CALC_INVOICE_MEMO_#
    - (KGR) AOP Dataset
    - Metric_Dim
    output_datasets:
    - TD_Report_Long
    - TD_Metrics_Wide
    in_closure: true
    n_steps: 42
    steps:
    - step: InputDataset_0
      type: InputDataset
      label: (KGR) DTF_CALC_INVOICE_MEMO_#
      input_dataset: (KGR) DTF_CALC_INVOICE_MEMO_#
      dataset_type: db
    - step: AddColumns_0
      type: AddColumns
      label: Add Columns
      adds:
      - name: a10_CP Xúc tiến bán hàng
        expression: '247258890.4666666'
    - step: Filter_0
      type: Filter
      label: Filter PERIOD
      filters:
      - (1 = 1)
    - step: Filter_1
      type: Filter
      label: Filter
      filters:
      - '"ACCTTYPE" IN(''Income'')'
    - step: Branch_0
      type: Branch
      label: Branch
    - step: RenameColumns_0
      type: RenameColumns
      label: Rename Columns
      renames:
      - TRANDATE -> AsOfDate
    - step: SelectColumns_0
      type: SelectColumns
      label: Select Columns
      selected_columns:
      - AsOfDate
      - PERIODNAME
      - POSTINGPERIOD
    - step: GroupBy_0
      type: GroupBy
      label: Distinct AsOf list
      group_by:
      - AsOfDate
      - PERIODNAME
      aggregations:
      - POSTINGPERIOD Count = count(POSTINGPERIOD)
    - step: SelectColumns_1
      type: SelectColumns
      label: Select Columns 1
      selected_columns:
      - POSTINGPERIOD
      - PERIODNAME
      - TRANDATE
      - SUBSIDIARY
      - Tên Ngành
      - ACCTTYPE
      - Giá Vốn
      - Doanh số thực tế
      - Doanh thu ngành khác
      - Doanh thu thực tế
      - a10_CP Xúc tiến bán hàng
      - CP CKKM
      - DS Xanh
      - DS Đỏ
      - Vụ việc
      - LN Gộp
    - step: Join_0
      type: Join
      label: Join non-equi cum
      join_type: rightouterjoin
      left: SelectColumns_1
      right: GroupBy_0
      'on':
      - PERIODNAME = PERIODNAME
      - TRANDATE <= AsOfDate
      condition: and
    - step: GroupBy_1
      type: GroupBy
      label: Aggregate cumulative
      group_by:
      - PERIODNAME
      - AsOfDate
      aggregations:
      - DT_TĐ = sum(Doanh thu thực tế)
      - a10_CP_Xuc_tien_ban_hang_max = max(a10_CP Xúc tiến bán hàng)
      - a1_Doanh số thực tế Sum = sum(Doanh số thực tế)
      - a3_Giá Vốn = sum(Giá Vốn)
      - a5_CP CKKM = sum(CP CKKM)
      - a19_Doanh thu ngành khác = sum(Doanh thu ngành khác)
      - DS Xanh Sum = sum(DS Xanh)
      - DS Đỏ Sum = sum(DS Đỏ)
    - step: InputDataset_1
      type: InputDataset
      label: '[KGR] AOP'
      input_dataset: (KGR) AOP Dataset
      dataset_type: datamodel
      physical_tables:
        DW_NS_ACCOUNTINGPERIOD_D:
        - PERIODNAME
        DW_NS_X_AOP_HEADER_SF_1:
        - POSTINGPERIOD
        DW_NS_X_AOP_HEADER_CF_1:
        - CUSTBODY_SCV_AOP_LOAI_BAO_CAO
        DW_NS_X_AOP_LINE_SF_1:
        - SUBSIDIARY
        - CLASS
        - ID
        - NETAMOUNT
        DW_NS_X_AOP_LINE_CF:
        - CSEG_SCV_CHAIN
        - Per DS (AOP)
        - CSEG_SCV_NHOMXANHDO
        - Chỉ tiêu (AOP)
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_PRODCATG:
        - Ngành hàng
    - step: Filter_2
      type: Filter
      label: Filter 2
      filters:
      - '"CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 2 and 2 and "Chỉ tiêu (AOP)" between 1 and 200'
    - step: AddColumns_4
      type: AddColumns
      label: Add Columns 4
      adds:
      - name: per_A6
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 6 THEN "Per DS (AOP)" END
      - name: per_A7
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 7 THEN "Per DS (AOP)" END
      - name: per_A8
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 8 THEN "Per DS (AOP)" END
      - name: per_A15
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 15 THEN "Per DS (AOP)" END
      - name: per_A16
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 16 THEN "Per DS (AOP)" END
      - name: per_A17
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 17 THEN "Per DS (AOP)" END
      - name: amt_A10
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 10 THEN ABS("NETAMOUNT") END
      - name: amt_A12
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 12 THEN ABS("NETAMOUNT") END
      - name: amt_A18
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 18 THEN ABS("NETAMOUNT") END
      - name: amt_A19
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 19 THEN ABS("NETAMOUNT") END
    - step: GroupBy_2
      type: GroupBy
      label: Aggregate 2
      group_by:
      - PERIODNAME
      - Ngành hàng
      aggregations:
      - per_A6 Maximum = max(per_A6)
      - per_A7 Sum = sum(per_A7)
      - per_A8 Maximum = max(per_A8)
      - per_A15 Maximum = max(per_A15)
      - per_A16 Sum = sum(per_A16)
      - per_A17 Sum = sum(per_A17)
      - amt_A10 Sum = sum(amt_A10)
      - amt_A12 Maximum = max(amt_A12)
      - amt_A18 Maximum = max(amt_A18)
      - amt_A19 Sum = sum(amt_A19)
    - step: GroupBy_3
      type: GroupBy
      label: Aggregate 2 TĐ
      group_by:
      - PERIODNAME
      aggregations:
      - AOP_PER_A6 = max(per_A6 Maximum)
      - AOP_PER_A7 = max(per_A7 Sum)
      - AOP_PER_A8 = max(per_A8 Maximum)
      - AOP_PER_A15 = sum(per_A15 Maximum)
      - AOP_PER_A16 = max(per_A16 Sum)
      - AOP_PER_A17 = max(per_A17 Sum)
      - AOP_AMT_A10 = sum(amt_A10 Sum)
      - AOP_AMT_A12 = sum(amt_A12 Maximum)
      - AOP_AMT_A18 = sum(amt_A18 Maximum)
      - AOP_AMT_A19 = sum(amt_A19 Sum)
    - step: Join_1
      type: Join
      label: Join AOP TĐ
      join_type: leftouterjoin
      left: AddColumns_1
      right: GroupBy_3
      'on':
      - PERIODNAME = PERIODNAME
      condition: and
    - step: AddColumns_1
      type: AddColumns
      label: Add So_Ngay
      adds:
      - name: So_Ngay
        expression: DayOfMonth("AsOfDate")
    - step: AddColumns_3
      type: AddColumns
      label: Metrics leaf
      adds:
      - name: a4
        expression: '"DT_TĐ" - "a3_Giá Vốn"'
      - name: a6
        expression: '"AOP_PER_A6" * "DT_TĐ"'
      - name: a7
        expression: '"AOP_PER_A7" * "DT_TĐ"'
      - name: a8
        expression: '"AOP_PER_A8" * "DT_TĐ"'
      - name: a15
        expression: '"AOP_PER_A15" * "DT_TĐ"'
      - name: a16
        expression: '"AOP_PER_A16" * "DT_TĐ"'
      - name: a17
        expression: '"AOP_PER_A17" * "DT_TĐ"'
      - name: adp
        expression: 0.015 * "DT_TĐ"
      - name: a10
        expression: '"So_Ngay" * "AOP_AMT_A10" / 30'
      - name: a12
        expression: '"So_Ngay" * "AOP_AMT_A12" / 30'
      - name: a18
        expression: '"So_Ngay" * "AOP_AMT_A18" / 30'
    - step: AddColumns_5
      type: AddColumns
      label: Subtotal T1
      adds:
      - name: a14
        expression: '"a15" + "a16" + "a17" + "adp" + "a18"'
      - name: a9
        expression: '"a4" - "a5_CP CKKM" - "a6" - "a7" - "a8"'
    - step: AddColumns_6
      type: AddColumns
      label: Subtotal T2
      adds:
      - name: a11
        expression: '"a9" - "a10"'
    - step: AddColumns_7
      type: AddColumns
      label: Subtotal T3
      adds:
      - name: a13
        expression: '"a11" - "a12"'
    - step: AddColumns_8
      type: AddColumns
      label: Subtotal T4
      adds:
      - name: a20
        expression: '"a13" - "a14" + "a19_Doanh thu ngành khác"'
    - step: AddColumns_9
      type: AddColumns
      label: Subtotal T5
      adds:
      - name: a21
        expression: '"a20" * 0.21'
    - step: AddColumns_10
      type: AddColumns
      label: Subtotal T6
      adds:
      - name: a22
        expression: '"a20" - "a21"'
      - name: a23
        expression: '"a20" - "a21"'
      - name: a24
        expression: CASE WHEN "DS Đỏ Sum" = 0 THEN NULL ELSE "DS Xanh Sum" / "DS Đỏ Sum" END
    - step: AddColumns_2
      type: AddColumns
      label: M1 wide _k
      adds:
      - name: _k
        expression: '1'
    - step: InputDataset_2
      type: InputDataset
      label: Metric_Dim
      input_dataset: Metric_Dim
      dataset_type: datamodel
      physical_tables:
        Metric_Dim:
        - "\uFEFFSort_Order"
        - Metric_Code
        - Metric_Name
        - Type
    - step: AddColumns_11
      type: AddColumns
      label: M2 dim _k
      adds:
      - name: _k
        expression: '1'
    - step: Join_2
      type: Join
      label: M3 Join cross
      join_type: leftouterjoin
      left: AddColumns_2
      right: AddColumns_11
      'on':
      - _k = _k
      condition: and
    - step: AddColumns_12
      type: AddColumns
      label: M4 Actual_Amount
      adds:
      - name: Actual_Amount
        expression: |-
          CASE WHEN "Metric_Code" = 1 THEN "a1_Doanh số thực tế Sum"
               WHEN "Metric_Code" = 2 THEN "DT_TĐ"
               WHEN "Metric_Code" = 3 THEN "a3_Giá Vốn"
               WHEN "Metric_Code" = 4 THEN "a4"
               WHEN "Metric_Code" = 5 THEN "a5_CP CKKM"
               WHEN "Metric_Code" = 6 THEN "a6"
               WHEN "Metric_Code" = 7 THEN "a7"
               WHEN "Metric_Code" = 8 THEN "a8"
               WHEN "Metric_Code" = 9 THEN "a9"
               WHEN "Metric_Code" = 10 THEN "a10"
               WHEN "Metric_Code" = 11 THEN "a11"
               WHEN "Metric_Code" = 12 THEN "a12"
               WHEN "Metric_Code" = 13 THEN "a13"
               WHEN "Metric_Code" = 14 THEN "a14"
               WHEN "Metric_Code" = 15 THEN "a15"
               WHEN "Metric_Code" = 16 THEN "a16"
               WHEN "Metric_Code" = 17 THEN "a17"
               WHEN "Metric_Code" = 101 THEN "adp"
               WHEN "Metric_Code" = 18 THEN "a18"
               WHEN "Metric_Code" = 19 THEN "a19_Doanh thu ngành khác"
               WHEN "Metric_Code" = 20 THEN "a20"
               WHEN "Metric_Code" = 21 THEN "a21"
               WHEN "Metric_Code" = 22 THEN "a22"
               WHEN "Metric_Code" = 23 THEN CASE WHEN "a22" > 0 THEN "a22" * 0.8 ELSE "a22" END
               WHEN "Metric_Code" = 24 THEN "a24"
               ELSE NULL END
      - name: DT_grain
        expression: '"DT_TĐ"'
      - name: AOP_Amount
        expression: |-
          CASE WHEN "Metric_Code" = 10 THEN "AOP_AMT_A10"
               WHEN "Metric_Code" = 12 THEN "AOP_AMT_A12"
               WHEN "Metric_Code" = 18 THEN "AOP_AMT_A18"
               WHEN "Metric_Code" = 19 THEN "AOP_AMT_A19"
               ELSE NULL END
    - step: SelectColumns_2
      type: SelectColumns
      label: M5 Select 7 cols
      selected_columns:
      - PERIODNAME
      - AsOfDate
      - Metric_Code
      - Metric_Name
      - "\uFEFFSort_Order"
      - Type
      - Actual_Amount
      - DT_grain
      - AOP_Amount
    - step: AddColumns_13
      type: AddColumns
      label: N2 AOP prep
      adds:
      - name: Metric_Code
        expression: '"Chỉ tiêu (AOP)"'
      - name: AOP_Amount
        expression: ABS("NETAMOUNT")
      - name: AOP_Per
        expression: '"Per DS (AOP)"'
    - step: OutputDataset_0
      type: OutputDataset
      label: Save Data
      output_dataset: TD_Report_Long
      save_type: conn
      output_type: Create
      dataset_description: TD_Report_Long
      output_columns:
      - PERIODNAME
      - AsOfDate
      - Metric_Code
      - Metric_Name
      - "\uFEFFSort_Order"
      - Type
      - Actual_Amount
      - DT_grain
      - AOP_Amount
      - PERIODNAME_1
      - Chỉ tiêu (AOP)
      - AOP_Amount_1
      - AOP_Per
      - AOP_Amount_2
      - AOP_Per_24
    - step: Branch_1
      type: Branch
      label: Branch 1
    - step: OutputDataset_1
      type: OutputDataset
      label: Save Data 1
      output_dataset: TD_Metrics_Wide
      save_type: obi
      output_type: Create
      dataset_description: TD_Metrics_Wide
      output_columns:
      - PERIODNAME
      - AsOfDate
      - DT_TĐ
      - a10_CP_Xuc_tien_ban_hang_max
      - a1_Doanh số thực tế Sum
      - a3_Giá Vốn
      - a5_CP CKKM
      - a19_Doanh thu ngành khác
      - DS Xanh Sum
      - DS Đỏ Sum
      - So_Ngay
      - PERIODNAME_1
      - AOP_PER_A6
      - AOP_PER_A7
      - AOP_PER_A8
      - AOP_PER_A15
      - AOP_PER_A16
      - AOP_PER_A17
      - AOP_AMT_A10
      - AOP_AMT_A12
      - AOP_AMT_A18
      - AOP_AMT_A19
      - a4
      - a6
      - a7
      - a8
      - a15
      - a16
      - a17
      - adp
      - a10
      - a12
      - a18
      - a14
      - a9
      - a11
      - a13
      - a20
      - a21
      - a22
      - a23
      - a24
    - step: Branch_2
      type: Branch
      label: Branch 2
    - step: Filter_3
      type: Filter
      label: Filter 3
      filters:
      - '"Chỉ tiêu AOP is NULL" IN(''NOT NULL'')'
    - step: AddColumns_14
      type: AddColumns
      label: Chỉ tiêu AOP is NULL
      adds:
      - name: Chỉ tiêu AOP is NULL
        expression: CASE WHEN "Chỉ tiêu (AOP)"is NULL THEN 'NULL' ELSE 'NOT NULL' END
    - step: AddColumns_15
      type: AddColumns
      label: Add Columns 15
      adds:
      - name: AOP_Amount
        expression: ABS("NETAMOUNT")
      - name: AOP_Per
        expression: '"Per DS (AOP)"'
    - step: SelectColumns_3
      type: SelectColumns
      label: AOP long
      selected_columns:
      - PERIODNAME
      - Chỉ tiêu (AOP)
      - AOP_Amount
      - AOP_Per
    - step: Join_3
      type: Join
      label: Join 3
      join_type: leftouterjoin
      left: SelectColumns_2
      right: SelectColumns_3
      'on':
      - PERIODNAME = PERIODNAME
      - Metric_Code = Chỉ tiêu (AOP)
      condition: and
    - step: AddColumns_16
      type: AddColumns
      label: Add Columns 16
      adds:
      - name: AOP_Amount_2
        expression: CASE WHEN "Metric_Code"=24 THEN null ELSE "AOP_Amount_1" END
      - name: AOP_Per_24
        expression: CASE WHEN "Metric_Code"=24 THEN null ELSE "AOP_Per" END
  (KGR) 1. DTF_CALC_INVOICE_MEMO_#:
    dataflow_id: '''anhdk@bizin.vn''.''(KGR) 1. DTF_CALC_INVOICE_MEMO_V2'''
    name: (KGR) 1. DTF_CALC_INVOICE_MEMO_#
    object_path:
    last_modified: '2026-06-20'
    version: '2.6'
    input_datasets:
    - Giá vốn mục tiêu
    - Giá vốn tồn kho
    - 1. Invoice_v2
    - (KGR) CKKM TT
    - (KGR) Tỉ lệ chi phí Lương
    - (KGR) Invoice_Line+Header+Pro
    - DW_CREDIT_MEMO
    output_datasets:
    - (KGR) DTF_CALC_INVOICE_MEMO_#
    in_closure: true
    n_steps: 54
    steps:
    - step: InputDataset_3
      type: InputDataset
      label: Giá vốn mục tiêu
      input_dataset: Giá vốn mục tiêu
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_GIA_VON_MUC_TIEU_CT:
        - CUSTRECORD_SCV_GVMT_LINE_END_DATE
        - CUSTRECORD_SCV_GVMT_LINE_GVMT_SP
        - CUSTRECORD_SCV_GVMT_LINE_MODEL
        - CUSTRECORD_SCV_GVMT_LINE_MSP
        - CUSTRECORD_SCV_GVMT_LINE_START_DATE
        - ID
        - ISINACTIVE
        - NAME
    - step: InputDataset_4
      type: InputDataset
      label: Giá vốn tồn kho
      input_dataset: Giá vốn tồn kho
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_GIA_VON_TON_KHO:
        - CUSTRECORD_SCV_GVTK_ITEM_CODE_L
        - Next period
        - CUSTRECORD_SCV_GVTK_ITEM_NAME_L
        - CUSTRECORD_SCV_GVTK_PERIOD_L
        - CUSTRECORD_SCV_GVTK_SUBSIDIARY_L
        - CUSTRECORD_SCV_GVTK_UNITS_L
        - CUSTRECORD_SCV_GVTK_UNIT_COST_L
        - ID
        - ISINACTIVE
        - NAME
    - step: GroupBy_6
      type: GroupBy
      label: Aggregate 6
      group_by:
      - GVMT_LINE_MSP
      - Month Key
      aggregations:
      - GVMT = max(GVMT_LINE_GVMT_SP)
    - step: RenameColumns_1
      type: RenameColumns
      label: Rename Columns 1
      renames:
      - CUSTRECORD_SCV_GVMT_LINE_END_DATE -> GVMT_LINE_END_DATE
      - CUSTRECORD_SCV_GVMT_LINE_GVMT_SP -> GVMT_LINE_GVMT_SP
      - CUSTRECORD_SCV_GVMT_LINE_MODEL -> GVMT_LINE_MODEL
      - CUSTRECORD_SCV_GVMT_LINE_MSP -> GVMT_LINE_MSP
      - CUSTRECORD_SCV_GVMT_LINE_START_DATE -> GVMT_LINE_START_DATE
    - step: Filter_3
      type: Filter
      label: Filter 3
      filters:
      - '"ISINACTIVE" IN(''F'')'
    - step: RenameColumns_2
      type: RenameColumns
      label: Rename Columns 2
      renames:
      - CUSTRECORD_SCV_GVTK_ITEM_CODE_L -> GVTK_ITEM_CODE_L
      - CUSTRECORD_SCV_GVTK_ITEM_NAME_L -> GVTK_ITEM_NAME_L
      - CUSTRECORD_SCV_GVTK_PERIOD_L -> GVTK_PERIOD_L
      - CUSTRECORD_SCV_GVTK_SUBSIDIARY_L -> GVTK_SUBSIDIARY_L
      - CUSTRECORD_SCV_GVTK_UNITS_L -> GVTK_UNITS_L
      - CUSTRECORD_SCV_GVTK_UNIT_COST_L -> GVTK_UNIT_COST_L
    - step: Filter_4
      type: Filter
      label: Filter 4
      filters:
      - '"ISINACTIVE" IN(''F'')'
    - step: GroupBy_7
      type: GroupBy
      label: Aggregate 7
      group_by:
      - GVTK_ITEM_CODE_L
      - GVTK_PERIOD_L
      - GVTK_SUBSIDIARY_L
      aggregations:
      - GVTK = max(GVTK_UNIT_COST_L)
    - step: InputDataset_0
      type: InputDataset
      label: DW_INVOICE
      input_dataset: 1. Invoice_v2
      dataset_type: datamodel
      physical_tables:
        DW_NS_CUSTOMER_INVOICE_LINES_F:
        - ID
        - TRANDATE
        - TRANSACTION
        - ITEM
        - QUANTITY
        - BASE_REVENUE
        - TAXLINE
        - TYPE
        - POSTINGPERIOD - 1
        - SUBSIDIARY
        - POSTINGPERIOD
        - CUSTOMER
        - CLASS
        - ITEMTYPE
        DW_NS_ACCOUNT_D:
        - ACCTTYPE
        DW_NS_ACCOUNTINGPERIOD_D:
        - PERIODNAME
        - Month_No
        - ISPOSTING
        DW_NS_X_CAM_CUSTINVCTRANSACTIONLINEEXTENSION:
        - CSEG_SCV_CHAIN
        - CSEG_SCV_NHOMXANHDO
        - CSEG_SCV_SC
        - CUSTCOL_SCV_LINE_ISFREEGIFT
        DW_NS_X_SALE_CHANNEL:
        - Tên Kênh
        - ID
        DW_NS_SUBSIDIARY_D:
        - Tên Đơn vị
        DW_NS_CLASSIFICATION_D:
        - Tên ngành
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_CHAIN:
        - Tên Chuỗi
        DW_NS_X_LIST_SALE_CHANEL_NS:
        - Nhóm Kênh
        - ID Nhóm kênh
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_MODEL:
        - NAME
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_NHOMXANHDO:
        - Nhóm xanh đỏ
        - ID XD
        DW_NS_X_CAM_CUSTOMLIST_SCV_QUY_HOACH_SP:
        - Quy hoạch SP
        DW_NS_X_CAM_EMPLOYEEEXTENSION:
        - ID_employee
        DW_NS_LOCATION_D:
        - Location Name
        DW_NS_X_CAM_CUSTOMLIST_SCV_SALES_CATEGORY:
        - Sales Category
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_SG_PRO:
        - Vụ việc
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_PRODGROUP:
        - Nhóm SP
        DW_NS_ITEM_D:
        - Item Name
        DW_NS_X_CAM_CUSTOMEREXTENSION:
        - CSEG_SCV_CHAIN
        - CSEG_SCV_SC
        DW_NS_X_CUST_INVOICE_LINES_SUPPLEMENTARY_1:
        - ID
        - TAX1AMT
        - TAXCODE
