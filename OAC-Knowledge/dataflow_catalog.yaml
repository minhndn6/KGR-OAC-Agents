  (KGR) DF_DAILY_SC_CHAIN_ASOF:
    dataflow_id: '''minhndn@bizin.vn''.''(KGR) DF_DAILY_SC_CHAIN_ASOF'''
    name: (KGR) DF_DAILY_SC_CHAIN_ASOF
    object_path: /@default/{dataflows}'minhndn@bizin.vn'.'(KGR) DF_DAILY_SC_CHAIN_ASOF'
    last_modified: '2026-07-04'
    version:
    input_datasets:
    - (KGR) DTF_CALC_INVOICE_MEMO_#
    - (KGR) Tỉ lệ chi phí Lương
    - (KGR) Tỷ lệ chi phí Roadshow, Hội nghị
    - (KGR) Tỷ lệ chi phí khác
    - AOP LINE CF
    output_datasets:
    - Daily_Chuoi_Report
    - Daily_Kenh_Report
    in_closure: false
    n_steps: 87
    steps:
    - step: InputDataset_1
      type: InputDataset
      label: (KGR) DTF_CALC_INVOICE_MEMO_#
      input_dataset: (KGR) DTF_CALC_INVOICE_MEMO_#
      dataset_type: db
    - step: SelectColumns_0
      type: SelectColumns
      label: Select Columns
      selected_columns:
      - POSTINGPERIOD
      - TRANDATE
      - Tên Đơn vị
      - SUBSIDIARY
      - Tên Ngành
      - ID Chuỗi
      - Tên Chuỗi
      - ID Kênh
      - Tên Kênh
      - Nhóm Kênh
      - Nhóm xanh đỏ
      - Quy hoạch SP
      - Nhóm SP
      - ITEM
      - LINE ID
      - TYPE
      - ACCTTYPE
      - CUSTOMER
      - Doanh số thực tế
      - Doanh thu ngành khác
      - Doanh thu thực tế
      - Doanh thu SP mới
      - LN Gộp
      - ID Nhóm kênh
      - CP CKKM
      - TRANSACTION
      - PERIODNAME
      - DS Xanh
      - DS Đỏ
      - Tỷ trọng SP mới
    - step: AddColumns_3
      type: AddColumns
      label: Add Columns 3
      adds:
      - name: ID Chain
        expression: Case When "ID Chuỗi" = 5 then Null Else "ID Chuỗi" End
      - name: SUB_ID
        expression: CASE WHEN "Tên Kênh" LIKE 'GT%' THEN "SUBSIDIARY" ELSE 9 END
    - step: InputDataset_2
      type: InputDataset
      label: (KGR) Tỉ lệ chi phí Lương
      input_dataset: (KGR) Tỉ lệ chi phí Lương
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_BANG_CP_LUONG:
        - CUSTRECORD_SCV_TY_LE_CHAIN
        - CUSTRECORD_SCV_TY_LE_DEN_NGAY
        - CUSTRECORD_SCV_TY_LE_KENH
        - CUSTRECORD_SCV_TY_LE_PER_LUONG
        - CUSTRECORD_SCV_TY_LE_TU_NGAY
        - ID
        - ISINACTIVE
        - NAME
    - step: InputDataset_3
      type: InputDataset
      label: (KGR) Tỷ lệ chi phí Roadshow, Hội nghị
      input_dataset: (KGR) Tỷ lệ chi phí Roadshow, Hội nghị
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_TY_LE_RSHN:
        - CUSTRECORD_SCV_RSHN_KENH
        - CUSTRECORD_SCV_RSHN_PER
        - CUSTRECORD_SCV_TY_LE_RSHN_CHAIN
        - CUSTRECORD_SCV_TY_LE_RSHN_DEN_NGAY
        - CUSTRECORD_SCV_TY_LE_RSHN_TU_NGAY
        - ID
        - ISINACTIVE
        - NAME
    - step: InputDataset_4
      type: InputDataset
      label: (KGR) Tỷ lệ chi phí khác
      input_dataset: (KGR) Tỷ lệ chi phí khác
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_CUSTOMRECORD_SCV_TY_LE_CP_CT_TK:
        - CUSTRECORD_SCV_TY_LE_CTTK_CHUOI
        - CUSTRECORD_SCV_TY_LE_CTTK_KENH
        - CUSTRECORD_SCV_TY_LE_CTTK_PER
        - CUSTRECORD_SCV_TY_LE_CTTK_TU_NGAY
        - CUSTRECORD_SCV_TY_LE_CTTK_DEN_NGAY
    - step: Join_2
      type: Join
      label: Join 2
      join_type: leftouterjoin
      left: AddColumns_3
      right: InputDataset_2
      'on':
      - ID Kênh = CUSTRECORD_SCV_TY_LE_KENH
      - ID Chain = CUSTRECORD_SCV_TY_LE_CHAIN
      - TRANDATE >= CUSTRECORD_SCV_TY_LE_TU_NGAY
      - TRANDATE <= CUSTRECORD_SCV_TY_LE_DEN_NGAY
      condition: and
    - step: Join_3
      type: Join
      label: Join 3
      join_type: leftouterjoin
      left: Join_2
      right: InputDataset_3
      'on':
      - ID Kênh = CUSTRECORD_SCV_RSHN_KENH
      - ID Chain = CUSTRECORD_SCV_TY_LE_RSHN_CHAIN
      - TRANDATE >= CUSTRECORD_SCV_TY_LE_RSHN_TU_NGAY
      - TRANDATE <= CUSTRECORD_SCV_TY_LE_RSHN_DEN_NGAY
      condition: and
    - step: Join_4
      type: Join
      label: Join 4
      join_type: leftouterjoin
      left: Join_3
      right: InputDataset_4
      'on':
      - ID Kênh = CUSTRECORD_SCV_TY_LE_CTTK_KENH
      - ID Chain = CUSTRECORD_SCV_TY_LE_CTTK_CHUOI
      - TRANDATE >= CUSTRECORD_SCV_TY_LE_CTTK_TU_NGAY
      - TRANDATE <= CUSTRECORD_SCV_TY_LE_CTTK_DEN_NGAY
      condition: and
    - step: AddColumns_2
      type: AddColumns
      label: Add Columns 2
      adds:
      - name: VALID_FLAG_LUONG_NVKD
        expression: |-
          CASE WHEN
          "TRANDATE" >= "CUSTRECORD_SCV_TY_LE_TU_NGAY"
          AND
          "TRANDATE" <= "CUSTRECORD_SCV_TY_LE_DEN_NGAY"
          THEN 'T'
          ELSE 'F'
          END
      - name: VALID_FLAG_CTTK_NVKD
        expression: |-
          CASE WHEN
          "TRANDATE" >= "CUSTRECORD_SCV_TY_LE_CTTK_TU_NGAY"
          AND
          "TRANDATE" <= "CUSTRECORD_SCV_TY_LE_CTTK_DEN_NGAY"
          THEN 'T'
