      type: AddColumns
      label: Add Columns 3
      adds:
      - name: Transaction Type
        expression: '''Credit Memo'''
    - step: AddColumns_7
      type: AddColumns
      label: Add Columns 7
      adds:
      - name: Transaction Type
        expression: '''Invoice'''
    - step: RenameColumns_4
      type: RenameColumns
      label: Rename Columns 4
      renames:
      - NAME -> Tên CTKM
      - TRANDATE -> Ngày CT
      - CUSTENTITY_SCV_ENTITY_CODE -> Mã Khách Hàng
      - MEMO -> Diễn giải
      - ACCTNUMBER -> TK đối ứng
      - SUBSIDIARY -> Đơn vị
      - UPCCODE -> Mã hàng
      - Location Name -> Tên kho
      - TRANSACTION -> Transaction ID
      - CUSTBODY_SCV_TRANS_SCT_FAST -> Số CT FAST
    - step: AddColumns_10
      type: AddColumns
      label: Invoice Column
      adds:
      - name: SL xuất bán
        expression: Case When "Transaction Type"  like 'Invoice' then - "QUANTITY" Else 0 End
      - name: Giá bán TB
        expression: Case When "Transaction Type"  like 'Invoice' then -("Doanh thu thực tế" + IFNULL("CUSTCOL_SCV_DISCOUNT_AMOUNT_01",0))/"QUANTITY"
          Else 0 End
      - name: Doanh thu xuất bán
        expression: Case When "Transaction Type"  like 'Invoice' then "Doanh thu thực tế" + IFNULL("CUSTCOL_SCV_DISCOUNT_AMOUNT_01",0)
          Else 0 End
      - name: Thuế
        expression: Case When "Transaction Type"  like 'Invoice' then - "TAX AMT" Else 0 End
      - name: Chiết khấu
        expression: Case When "Transaction Type"  like 'Invoice'then Ifnull("CUSTCOL_SCV_DISCOUNT_AMOUNT_01",0) Else 0 End
      - name: Tiền vốn
        expression: Case When "Transaction Type"  like 'Invoice' then "Giá Vốn" Else 0 End
    - step: AddColumns_11
      type: AddColumns
      label: Credit Memo Column
      adds:
      - name: SL trả lại
        expression: Case When "Transaction Type"  like 'Credit Memo' then "QUANTITY" Else 0 End
      - name: Giá trả lại TB
        expression: Case When "Transaction Type"  like 'Credit Memo' then -("Doanh thu thực tế" + IFNULL("CUSTCOL_SCV_DISCOUNT_AMOUNT_01",0))/"QUANTITY"
          Else 0 End
      - name: Doanh thu trả lại
        expression: Case When "Transaction Type"  like 'Credit Memo' then -("Doanh thu thực tế" + IFNULL("CUSTCOL_SCV_DISCOUNT_AMOUNT_01",0))
          Else 0 End
      - name: Thuế trả lại
        expression: Case When "Transaction Type"  like 'Credit Memo' then "TAX AMT" Else 0 End
      - name: Chiết khấu trả lại
        expression: Case When "Transaction Type"  like 'Credit Memo' then -Ifnull("CUSTCOL_SCV_DISCOUNT_AMOUNT_01",0) Else
          0 End
      - name: Tiền vốn tl
        expression: Case When "Transaction Type"  like 'Credit Memo' then "Giá Vốn" Else 0 End
    - step: AddColumns_12
      type: AddColumns
      label: Thực bán
      adds:
      - name: Thực bán
        expression: (Ifnull("Doanh thu xuất bán",0) - Ifnull("Chiết khấu",0))-(Ifnull("Doanh thu trả lại",0) - Ifnull("Chiết
          khấu trả lại",0))
    - step: AddColumns_13
      type: AddColumns
      label: Tiền vốn thực tế, lãi
      adds:
      - name: Lãi
        expression: Ifnull("Thực bán",0) - (Ifnull("Tiền vốn",0) - Ifnull("Tiền vốn tl",0))
      - name: Tiền vốn thực tế
        expression: Ifnull("Tiền vốn",0) - Ifnull("Tiền vốn tl",0)
    - step: AddColumns_14
      type: AddColumns
      label: '%TB/DT, %GV/DT'
      adds:
      - name: '%TB/DT'
        expression: Case when "Thực bán" > 0 then "Thực bán"/"Doanh thu xuất bán" Else 0 End
      - name: '%GV/DT'
        expression: Case when "Tiền vốn" > 0 then "Tiền vốn"/"Doanh thu xuất bán" Else 0 End
    - step: SplitColumn_0
      type: AddColumns
      label: Split Columns
      adds:
      - name: Mã tỉnh
        expression: CASE WHEN POSITION('_' IN "Địa chỉ") > 0 THEN       CASE WHEN POSITION('_' IN "Địa chỉ") = 1 THEN ''      ELSE
          SUBSTRING("Địa chỉ",1, POSITION('_' IN "Địa chỉ")-1) END   ELSE "Địa chỉ" END
      - name: Địa chỉ KH
        expression: CASE WHEN POSITION('_' IN "Địa chỉ") > 0 THEN  SUBSTRING("Địa chỉ", POSITION('_' IN "Địa chỉ")+1, LENGTH("Địa
          chỉ")) ELSE '' END
