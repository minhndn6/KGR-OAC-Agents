    - step: RenameColumns_3
      type: RenameColumns
      label: Rename Columns 3
      renames:
      - FULLNAME -> Ngành
      - ID_1 -> ID Kênh
      - NAME -> Model name
      - ID -> LINE ID
      - TAX1AMT -> TAX AMT
      - TAXRATE1 -> TAX RATE
