      label: Filter 5
      filters:
      - '"Is Công ty con Chi nhánh Memo" IN(''F'') and ("Is Công ty con Chi nhánh Memo" IS NULL or "Is Công ty con Chi nhánh
        Memo" NOT IN(''T''))'
    - step: AddColumns_15
      type: AddColumns
      label: Add Columns 15
      adds:
      - name: Is Công ty con Chi nhánh Invoice
        expression: Case When "CSEG_SCV_SC" = 14 then 'T' Else 'F' End
    - step: Filter_2
      type: Filter
      label: Filter 2
      filters:
      - ("Is Công ty con Chi nhánh Invoice" IS NULL or "Is Công ty con Chi nhánh Invoice" NOT IN('T'))
    - step: AddColumns_17
      type: AddColumns
      label: Add Columns 17
      adds:
      - name: Month Key
        expression: YEAR("GVMT_LINE_START_DATE") * 100 + MONTH("GVMT_LINE_START_DATE")
  KGR_DF_TD_Metrics_v1.0:
    description: Phiên bản 1.0 của bảng lãi lỗ Tập đoàn. Dựng P&L theo kỳ từ doanh số thực tế tới lợi nhuận sau thuế, lấy
      doanh thu/giá vốn từ dataflow gốc và ghép kế hoạch AOP; xuất bảng dạng ngang và dạng dài.
    dataflow_id: '''minhndn@bizin.vn''.''KGR_DF_TD_Metrics_v1.0'''
    name: KGR_DF_TD_Metrics_v1.0
    object_path: /@default/{dataflows}'minhndn@bizin.vn'.'KGR_DF_TD_Metrics_v1.0'
    last_modified: '2026-06-22'
    version:
    input_datasets:
    - (KGR) DTF_CALC_INVOICE_MEMO_#
    - (KGR) AOP Dataset
    - Metric_Dim
    output_datasets:
    - TD_Report_Long
    - TD_Metrics_Wide
    in_closure: true
    n_steps: 42
    steps:
    - step: InputDataset_0
      type: InputDataset
      label: (KGR) DTF_CALC_INVOICE_MEMO_#
      input_dataset: (KGR) DTF_CALC_INVOICE_MEMO_#
      dataset_type: db
    - step: AddColumns_0
      type: AddColumns
      label: Add Columns
      adds:
      - name: a10_CP Xúc tiến bán hàng
        expression: '247258890.4666666'
    - step: Filter_0
      type: Filter
      label: Filter PERIOD
      filters:
      - '"POSTINGPERIOD" between 42 and 42'
    - step: Filter_1
      type: Filter
      label: Filter
      filters:
      - '"ACCTTYPE" IN(''Income'')'
    - step: Branch_0
      type: Branch
      label: Branch
    - step: RenameColumns_0
      type: RenameColumns
      label: Rename Columns
      renames:
      - TRANDATE -> AsOfDate
    - step: SelectColumns_0
      type: SelectColumns
      label: Select Columns
      selected_columns:
      - AsOfDate
      - PERIODNAME
      - POSTINGPERIOD
    - step: GroupBy_0
      type: GroupBy
      label: Distinct AsOf list
      group_by:
      - AsOfDate
      - PERIODNAME
      aggregations:
      - POSTINGPERIOD Count = count(POSTINGPERIOD)
    - step: SelectColumns_1
      type: SelectColumns
      label: Select Columns 1
      selected_columns:
      - POSTINGPERIOD
      - PERIODNAME
      - TRANDATE
      - SUBSIDIARY
      - Tên Ngành
      - ACCTTYPE
      - Giá Vốn
      - Doanh số thực tế
      - Doanh thu ngành khác
      - Doanh thu thực tế
      - a10_CP Xúc tiến bán hàng
      - CP CKKM
      - DS Xanh
      - DS Đỏ
      - Vụ việc
      - LN Gộp
    - step: Join_0
      type: Join
      label: Join non-equi cum
      join_type: rightouterjoin
      left: SelectColumns_1
      right: GroupBy_0
      'on':
      - PERIODNAME = PERIODNAME
      - TRANDATE <= AsOfDate
      condition: and
    - step: GroupBy_1
      type: GroupBy
      label: Aggregate cumulative
      group_by:
      - PERIODNAME
      - AsOfDate
      aggregations:
      - DT_TĐ = sum(Doanh thu thực tế)
      - a10_CP_Xuc_tien_ban_hang_max = max(a10_CP Xúc tiến bán hàng)
      - a1_Doanh số thực tế Sum = sum(Doanh số thực tế)
      - a3_Giá Vốn = sum(Giá Vốn)
      - a5_CP CKKM = sum(CP CKKM)
      - a19_Doanh thu ngành khác = sum(Doanh thu ngành khác)
      - DS Xanh Sum = sum(DS Xanh)
      - DS Đỏ Sum = sum(DS Đỏ)
    - step: InputDataset_1
      type: InputDataset
      label: '[KGR] AOP'
      input_dataset: (KGR) AOP Dataset
      dataset_type: datamodel
      physical_tables:
        DW_NS_ACCOUNTINGPERIOD_D:
        - PERIODNAME
        DW_NS_X_AOP_HEADER_SF_1:
        - POSTINGPERIOD
        DW_NS_X_AOP_HEADER_CF_1:
        - CUSTBODY_SCV_AOP_LOAI_BAO_CAO
        DW_NS_X_AOP_LINE_SF_1:
        - SUBSIDIARY
        - CLASS
        - ID
        - NETAMOUNT
        DW_NS_X_AOP_LINE_CF:
        - CSEG_SCV_CHAIN
        - Per DS (AOP)
        - CSEG_SCV_NHOMXANHDO
        - Chỉ tiêu (AOP)
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_PRODCATG:
        - Ngành hàng
    - step: Filter_2
      type: Filter
      label: Filter 2
      filters:
      - '"PERIODNAME" IN(''May 2026'') and "CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 2 and 2 and "Chỉ tiêu (AOP)" between 1
        and 200'
    - step: AddColumns_4
      type: AddColumns
      label: Add Columns 4
      adds:
      - name: per_A6
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 6 THEN "Per DS (AOP)" END
      - name: per_A7
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 7 THEN "Per DS (AOP)" END
      - name: per_A8
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 8 THEN "Per DS (AOP)" END
      - name: per_A15
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 15 THEN "Per DS (AOP)" END
      - name: per_A16
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 16 THEN "Per DS (AOP)" END
      - name: per_A17
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 17 THEN "Per DS (AOP)" END
      - name: amt_A10
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 10 THEN ABS("NETAMOUNT") END
      - name: amt_A12
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 12 THEN ABS("NETAMOUNT") END
      - name: amt_A18
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 18 THEN ABS("NETAMOUNT") END
      - name: amt_A19
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 19 THEN ABS("NETAMOUNT") END
    - step: GroupBy_2
      type: GroupBy
      label: Aggregate 2
      group_by:
      - PERIODNAME
      - Ngành hàng
      aggregations:
      - per_A6 Maximum = max(per_A6)
      - per_A7 Sum = sum(per_A7)
      - per_A8 Maximum = max(per_A8)
      - per_A15 Maximum = max(per_A15)
      - per_A16 Sum = sum(per_A16)
      - per_A17 Sum = sum(per_A17)
      - amt_A10 Sum = sum(amt_A10)
      - amt_A12 Maximum = max(amt_A12)
      - amt_A18 Maximum = max(amt_A18)
