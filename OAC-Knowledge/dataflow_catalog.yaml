  KGR_DF_TD_Metrics_bk:
    description: Dựng bảng lãi lỗ (P&L) cấp Tập đoàn theo kỳ, đi từ doanh số thực tế xuống tới lợi nhuận sau thuế. Lấy doanh
      thu/giá vốn từ dataflow gốc, ghép kế hoạch AOP và danh mục chỉ tiêu. Xuất bảng dạng ngang (TD_Metrics_Wide) và dạng
      dài (TD_Report_Long).
    dataflow_id: '''minhndn@bizin.vn''.''KGR_DF_TD_Metrics_bk'''
    name: KGR_DF_TD_Metrics_bk
    object_path: /@default/{dataflows}'minhndn@bizin.vn'.'KGR_DF_TD_Metrics_bk'
    last_modified: '2026-07-03'
    version:
    input_datasets:
    - (KGR) DTF_CALC_INVOICE_MEMO_#
    - (KGR) AOP Dataset
    - Metric_Dim
    output_datasets:
    - TD_Report_Long
    - TD_Metrics_Wide
    in_closure: true
    n_steps: 42
    steps:
    - step: InputDataset_0
      type: InputDataset
      label: (KGR) DTF_CALC_INVOICE_MEMO_#
      input_dataset: (KGR) DTF_CALC_INVOICE_MEMO_#
      dataset_type: db
    - step: AddColumns_0
      type: AddColumns
      label: Add Columns
      adds:
      - name: a10_CP Xúc tiến bán hàng
        expression: '247258890.4666666'
    - step: Filter_0
      type: Filter
      label: Filter PERIOD
      filters:
      - (1 = 1)
    - step: Filter_1
      type: Filter
      label: Filter
      filters:
      - '"ACCTTYPE" IN(''Income'')'
    - step: Branch_0
      type: Branch
      label: Branch
    - step: RenameColumns_0
      type: RenameColumns
      label: Rename Columns
      renames:
      - TRANDATE -> AsOfDate
    - step: SelectColumns_0
      type: SelectColumns
      label: Select Columns
      selected_columns:
      - AsOfDate
      - PERIODNAME
      - POSTINGPERIOD
    - step: GroupBy_0
      type: GroupBy
      label: Distinct AsOf list
      group_by:
      - AsOfDate
      - PERIODNAME
      aggregations:
      - POSTINGPERIOD Count = count(POSTINGPERIOD)
    - step: SelectColumns_1
      type: SelectColumns
      label: Select Columns 1
      selected_columns:
      - POSTINGPERIOD
      - PERIODNAME
      - TRANDATE
      - SUBSIDIARY
      - Tên Ngành
      - ACCTTYPE
      - Giá Vốn
      - Doanh số thực tế
      - Doanh thu ngành khác
      - Doanh thu thực tế
      - a10_CP Xúc tiến bán hàng
      - CP CKKM
      - DS Xanh
      - DS Đỏ
      - Vụ việc
      - LN Gộp
      - a6_CP nhân viên KD
    - step: Join_0
      type: Join
      label: Join non-equi cum
      join_type: rightouterjoin
      left: SelectColumns_1
      right: GroupBy_0
      'on':
      - PERIODNAME = PERIODNAME
      - TRANDATE <= AsOfDate
      condition: and
    - step: GroupBy_1
      type: GroupBy
      label: Aggregate cumulative
      group_by:
      - PERIODNAME
      - AsOfDate
      aggregations:
      - DT_TĐ = sum(Doanh thu thực tế)
      - a10_CP_Xuc_tien_ban_hang_max = max(a10_CP Xúc tiến bán hàng)
      - a1_Doanh số thực tế Sum = sum(Doanh số thực tế)
      - a3_Giá Vốn = sum(Giá Vốn)
      - a5_CP CKKM = sum(CP CKKM)
      - a19_Doanh thu ngành khác = sum(Doanh thu ngành khác)
      - DS Xanh Sum = sum(DS Xanh)
      - DS Đỏ Sum = sum(DS Đỏ)
      - a6_NVKD_TD = sum(a6_CP nhân viên KD)
    - step: InputDataset_1
      type: InputDataset
      label: '[KGR] AOP'
      input_dataset: (KGR) AOP Dataset
      dataset_type: datamodel
      physical_tables:
        DW_NS_ACCOUNTINGPERIOD_D:
        - PERIODNAME
        DW_NS_X_AOP_HEADER_SF_1:
        - POSTINGPERIOD
        DW_NS_X_AOP_HEADER_CF_1:
        - CUSTBODY_SCV_AOP_LOAI_BAO_CAO
        DW_NS_X_AOP_LINE_SF_1:
        - SUBSIDIARY
        - CLASS
        - ID
        - NETAMOUNT
        DW_NS_X_AOP_LINE_CF:
        - CSEG_SCV_CHAIN
        - Per DS (AOP)
        - CSEG_SCV_NHOMXANHDO
        - Chỉ tiêu (AOP)
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_PRODCATG:
        - Ngành hàng
    - step: Filter_2
      type: Filter
      label: Filter 2
      filters:
      - '"CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 2 and 2 and "Chỉ tiêu (AOP)" between 1 and 200'
    - step: AddColumns_4
      type: AddColumns
      label: Add Columns 4
      adds:
      - name: per_A6
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 6 THEN "Per DS (AOP)" END
      - name: per_A7
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 7 THEN "Per DS (AOP)" END
      - name: per_A8
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 8 THEN "Per DS (AOP)" END
      - name: per_A15
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 15 THEN "Per DS (AOP)" END
      - name: per_A16
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 16 THEN "Per DS (AOP)" END
      - name: per_A17
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 17 THEN "Per DS (AOP)" END
      - name: amt_A10
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 10 THEN ABS("NETAMOUNT") END
      - name: amt_A12
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 12 THEN ABS("NETAMOUNT") END
      - name: amt_A18
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 18 THEN ABS("NETAMOUNT") END
      - name: amt_A19
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 19 THEN ABS("NETAMOUNT") END
    - step: GroupBy_2
      type: GroupBy
      label: Aggregate 2
      group_by:
      - PERIODNAME
      - Ngành hàng
      aggregations:
      - per_A6 Maximum = max(per_A6)
      - per_A7 Sum = sum(per_A7)
      - per_A8 Maximum = max(per_A8)
      - per_A15 Maximum = max(per_A15)
      - per_A16 Sum = sum(per_A16)
      - per_A17 Sum = sum(per_A17)
      - amt_A10 Sum = sum(amt_A10)
      - amt_A12 Maximum = max(amt_A12)
      - amt_A18 Maximum = max(amt_A18)
      - amt_A19 Sum = sum(amt_A19)
    - step: GroupBy_3
      type: GroupBy
      label: Aggregate 2 TĐ
      group_by:
      - PERIODNAME
      aggregations:
      - AOP_PER_A6 = max(per_A6 Maximum)
      - AOP_PER_A7 = max(per_A7 Sum)
      - AOP_PER_A8 = max(per_A8 Maximum)
      - AOP_PER_A15 = sum(per_A15 Maximum)
      - AOP_PER_A16 = max(per_A16 Sum)
      - AOP_PER_A17 = max(per_A17 Sum)
      - AOP_AMT_A10 = sum(amt_A10 Sum)
      - AOP_AMT_A12 = sum(amt_A12 Maximum)
      - AOP_AMT_A18 = sum(amt_A18 Maximum)
      - AOP_AMT_A19 = sum(amt_A19 Sum)
    - step: Join_1
      type: Join
      label: Join AOP TĐ
      join_type: leftouterjoin
      left: AddColumns_1
      right: GroupBy_3
      'on':
      - PERIODNAME = PERIODNAME
      condition: and
    - step: AddColumns_1
      type: AddColumns
      label: Add So_Ngay
      adds:
      - name: So_Ngay
        expression: DayOfMonth("AsOfDate")
    - step: AddColumns_3
      type: AddColumns
      label: Metrics leaf
      adds:
      - name: a4
        expression: '"DT_TĐ" - "a3_Giá Vốn"'
      - name: a6
        expression: ifnull("a6_NVKD_TD",0)
      - name: a7
        expression: '"AOP_PER_A7" * "DT_TĐ"'
      - name: a8
        expression: '"AOP_PER_A8" * "DT_TĐ"'
      - name: a15
        expression: '"AOP_PER_A15" * "DT_TĐ"'
      - name: a16
        expression: '"AOP_PER_A16" * "DT_TĐ"'
      - name: a17
        expression: '"AOP_PER_A17" * "DT_TĐ"'
      - name: adp
        expression: 0.015 * "DT_TĐ"
      - name: a10
        expression: '"So_Ngay" * "AOP_AMT_A10" / 30'
      - name: a12
        expression: '"So_Ngay" * "AOP_AMT_A12" / 30'
      - name: a18
        expression: '"So_Ngay" * "AOP_AMT_A18" / 30'
    - step: AddColumns_5
      type: AddColumns
      label: Subtotal T1
      adds:
      - name: a14
        expression: '"a15" + "a16" + "a17" + "adp" + "a18"'
      - name: a9
        expression: '"a4" - "a5_CP CKKM" - "a6" - "a7" - "a8"'
    - step: AddColumns_6
      type: AddColumns
      label: Subtotal T2
      adds:
      - name: a11
        expression: '"a9" - "a10"'
    - step: AddColumns_7
      type: AddColumns
      label: Subtotal T3
      adds:
      - name: a13
        expression: '"a11" - "a12"'
    - step: AddColumns_8
      type: AddColumns
      label: Subtotal T4
      adds:
      - name: a20
        expression: '"a13" - "a14" + "a19_Doanh thu ngành khác"'
    - step: AddColumns_9
      type: AddColumns
      label: Subtotal T5
      adds:
      - name: a21
        expression: |
          case when ("a20" < 0) then 0 else ("a20" * 0.21) end
    - step: AddColumns_10
      type: AddColumns
      label: Subtotal T6
      adds:
      - name: a22
        expression: '"a20" - "a21"'
      - name: a23
        expression: '"a20" - "a21"'
      - name: a24
        expression: CASE WHEN "DS Đỏ Sum" = 0 THEN NULL ELSE "DS Xanh Sum" / "DS Đỏ Sum" END
    - step: AddColumns_2
      type: AddColumns
      label: M1 wide _k
      adds:
      - name: _k
        expression: '1'
    - step: InputDataset_2
      type: InputDataset
      label: Metric_Dim
      input_dataset: Metric_Dim
      dataset_type: datamodel
      physical_tables:
        Metric_Dim:
        - "\uFEFFSort_Order"
        - Metric_Code
        - Metric_Name
        - Type
    - step: AddColumns_11
      type: AddColumns
      label: M2 dim _k
      adds:
      - name: _k
        expression: '1'
    - step: Join_2
      type: Join
      label: M3 Join cross
      join_type: leftouterjoin
      left: AddColumns_2
      right: AddColumns_11
      'on':
      - _k = _k
      condition: and
    - step: AddColumns_12
