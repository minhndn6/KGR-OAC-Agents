      label: Aggregate 6
      group_by:
      - GVMT_LINE_MSP
      - Month Key
      aggregations:
      - GVMT = max(GVMT_LINE_GVMT_SP)
    - step: RenameColumns_1
      type: RenameColumns
      label: Rename Columns 1
      renames:
      - CUSTRECORD_SCV_GVMT_LINE_END_DATE -> GVMT_LINE_END_DATE
      - CUSTRECORD_SCV_GVMT_LINE_GVMT_SP -> GVMT_LINE_GVMT_SP
      - CUSTRECORD_SCV_GVMT_LINE_MODEL -> GVMT_LINE_MODEL
      - CUSTRECORD_SCV_GVMT_LINE_MSP -> GVMT_LINE_MSP
      - CUSTRECORD_SCV_GVMT_LINE_START_DATE -> GVMT_LINE_START_DATE
    - step: Filter_3
      type: Filter
      label: Filter 3
      filters:
      - '"ISINACTIVE" IN(''F'')'
    - step: RenameColumns_2
      type: RenameColumns
      label: Rename Columns 2
      renames:
      - CUSTRECORD_SCV_GVTK_ITEM_CODE_L -> GVTK_ITEM_CODE_L
      - CUSTRECORD_SCV_GVTK_ITEM_NAME_L -> GVTK_ITEM_NAME_L
      - CUSTRECORD_SCV_GVTK_PERIOD_L -> GVTK_PERIOD_L
      - CUSTRECORD_SCV_GVTK_SUBSIDIARY_L -> GVTK_SUBSIDIARY_L
      - CUSTRECORD_SCV_GVTK_UNITS_L -> GVTK_UNITS_L
      - CUSTRECORD_SCV_GVTK_UNIT_COST_L -> GVTK_UNIT_COST_L
    - step: Filter_4
