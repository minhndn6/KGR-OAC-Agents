  (KGR) DF_GRAIN_ACTUAL_AOP:
    dataflow_id: '''anhdk@bizin.vn''.''(KGR) DF_BC02_ACTUAL_MONTH'''
    name: (KGR) DF_GRAIN_ACTUAL_AOP
    object_path:
    last_modified: '2026-06-11'
    version: '2.6'
    input_datasets:
    - (KGR) AOP Dataset
    - (KGR) DTF_CALC_INVOICE_MEMO_#
    output_datasets:
    - (KGR) DTF_GRAIN_ACTUAL_AOP
    in_closure: false
    n_steps: 32
    steps:
    - step: InputDataset_0
      type: InputDataset
      label: (KGR) DTF_CALC_INVOICE_MEMO_#
      input_dataset: (KGR) DTF_CALC_INVOICE_MEMO_#
      dataset_type: db
    - step: InputDataset_1
      type: InputDataset
      label: (KGR) DW_AOP
      input_dataset: (KGR) AOP Dataset
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_AOP_HEADER_SF_1:
        - POSTINGPERIOD
        DW_NS_ACCOUNTINGPERIOD_D:
        - PERIODNAME
        DW_NS_X_AOP_LINE_SF_1:
        - SUBSIDIARY
        - CLASS
        DW_NS_SUBSIDIARY_D:
        - Tên Đơn vị
        DW_NS_CLASSIFICATION_D:
        - Tên Ngành
        DW_NS_X_SALE_CHANNEL:
        - CUSTRECORD_SCV_SALE_CHANEL_NS
        - Kênh
        DW_NS_X_LIST_SALE_CHANEL_NS:
        - Nhóm kênh
        DW_NS_X_AOP_LINE_CF:
        - CSEG_SCV_SC
        - CSEG_SCV_CHAIN
        - Doanh số (AOP)
        - LN Giao (AOP)
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_CHAIN:
        - Chuỗi
        DW_NS_X_AOP_HEADER_CF_1:
        - CUSTBODY_SCV_AOP_LOAI_BAO_CAO
    - step: RenameColumns_0
      type: RenameColumns
      label: Rename Columns
      renames:
      - CLASS -> ID CLASS
      - CUSTRECORD_SCV_SALE_CHANEL_NS -> ID Nhóm kênh
      - Nhóm kênh -> Tên Nhóm kênh
      - CSEG_SCV_SC -> ID Kênh
      - Kênh -> Tên Kênh
      - CSEG_SCV_CHAIN -> ID  Chuỗi
      - Chuỗi -> Tên Chuỗi
    - step: GroupBy_1
      type: GroupBy
      label: Aggregate 1
      group_by:
      - POSTINGPERIOD
      - SUBSIDIARY
      - ID CLASS
      - ID Kênh
      - ID  Chuỗi
      - CUSTBODY_SCV_AOP_LOAI_BAO_CAO
      aggregations:
      - Doanh số (AOP) = max(Doanh số (AOP))
      - LN Giao (AOP) = max(LN Giao (AOP))
    - step: OutputDataset_0
      type: OutputDataset
      label: Save Data
      output_dataset: (KGR) DTF_GRAIN_ACTUAL_AOP
      save_type: conn
      output_type: Create
      dataset_description: Actual vs Aop cùng 1 Grain, phục vụ báo cáo Tháng
      output_columns:
      - Posting Period
      - Subsidiary Id
      - ID CLASS
      - ID Sales Channel
      - ID Chain
      - Doanh số (AOP) TĐ
      - LN Giao (AOP) TĐ
      - Doanh số (AOP) Ngành
      - LN Giao (AOP) Ngành
      - Doanh số (AOP) Kênh
      - LN Giao (AOP) Kênh
      - Doanh số (AOP) Chuỗi
      - LN Giao (AOP) Chuỗi
      - Doanh số thực tế
      - Doanh thu thực tế
      - Giá Vốn
      - LN Gộp
      - DS T1
      - DS T2
      - DS T3
      - DS T4
      - DS T5
      - DS T6
      - DS T7
      - DS T8
      - DS T9
      - DS T10
      - DS T11
      - DS T12
      - Doanh số lũy kế
      - Doanh số quy đổi
      - Doanh thu ngành khác
    - step: Filter_0
      type: Filter
      label: Filter
      filters:
      - '"Lọc báo cáo" IN(''T'')'
    - step: AddColumns_0
      type: AddColumns
      label: Lọc báo cáo
      adds:
      - name: Lọc báo cáo
        expression: Case when "CUSTBODY_SCV_AOP_LOAI_BAO_CAO" in (1,4,5) Then 'T' else 'F' end
    - step: Branch_0
      type: Branch
      label: Branch
    - step: Filter_1
      type: Filter
      label: Filter Daily Tập đoàn
      filters:
      - '"CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 5 and 5 and "CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 5 and 5'
    - step: SelectColumns_0
      type: SelectColumns
      label: Select Columns
      selected_columns:
      - POSTINGPERIOD
      - SUBSIDIARY
      - CUSTBODY_SCV_AOP_LOAI_BAO_CAO
      - Doanh số (AOP)
      - LN Giao (AOP)
    - step: RenameColumns_1
      type: RenameColumns
      label: Rename Columns 1
      renames:
      - CUSTBODY_SCV_AOP_LOAI_BAO_CAO -> Id Báo cáo
      - Doanh số (AOP) -> Doanh số (AOP) TĐ
      - LN Giao (AOP) -> LN Giao (AOP) TĐ
    - step: Join_0
      type: Join
      label: Join AOP TĐ vs Actual
      join_type: fullouterjoin
      left: GroupBy_0
      right: GroupBy_2
      'on':
      - POSTINGPERIOD = POSTINGPERIOD
      condition: and
    - step: Filter_2
      type: Filter
      label: Filter Daily Ngành
      filters:
      - '"CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 4 and 4 and "CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 4 and 4'
    - step: SelectColumns_2
      type: SelectColumns
      label: Select Columns 2
      selected_columns:
      - POSTINGPERIOD
      - ID CLASS
      - CUSTBODY_SCV_AOP_LOAI_BAO_CAO
      - Doanh số (AOP)
      - LN Giao (AOP)
      - SUBSIDIARY
    - step: RenameColumns_2
      type: RenameColumns
      label: Rename Columns 2
      renames:
      - CUSTBODY_SCV_AOP_LOAI_BAO_CAO -> Id Báo cáo
      - Doanh số (AOP) -> Doanh số (AOP) Ngành
      - LN Giao (AOP) -> LN Giao (AOP) Ngành
    - step: Join_1
      type: Join
      label: Join AOP ngành vs Actual
      join_type: fullouterjoin
      left: Join_0
      right: GroupBy_5
      'on':
      - POSTINGPERIOD = POSTINGPERIOD
      - ID CLASS = ID CLASS
      condition: and
    - step: Filter_3
      type: Filter
      label: Filter Daily Kênh
      filters:
      - '"CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 1 and 1 and "CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 1 and 1 and "ID Kênh"
        >= 0'
    - step: SelectColumns_3
      type: SelectColumns
      label: Select Columns 3
      selected_columns:
      - POSTINGPERIOD
      - ID Kênh
      - CUSTBODY_SCV_AOP_LOAI_BAO_CAO
      - Doanh số (AOP)
      - LN Giao (AOP)
      - SUBSIDIARY
    - step: RenameColumns_3
      type: RenameColumns
      label: Rename Columns 3
      renames:
      - Doanh số (AOP) -> Doanh số (AOP) Kênh
      - LN Giao (AOP) -> LN Giao (AOP) Kênh
    - step: Join_2
      type: Join
      label: Join AOP kênh vs actual
      join_type: fullouterjoin
      left: Join_1
      right: GroupBy_4
      'on':
      - POSTINGPERIOD = POSTINGPERIOD
      - ID Kênh = ID Kênh
      condition: and
    - step: Filter_5
      type: Filter
      label: Filter Daily Chuỗi
      filters:
      - '"CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 1 and 1 and "CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 1 and 1 and "ID  Chuỗi"
        >= 0'
    - step: SelectColumns_4
      type: SelectColumns
      label: Select Columns 4
      selected_columns:
      - POSTINGPERIOD
      - ID  Chuỗi
      - CUSTBODY_SCV_AOP_LOAI_BAO_CAO
      - Doanh số (AOP)
      - LN Giao (AOP)
      - SUBSIDIARY
    - step: RenameColumns_4
      type: RenameColumns
      label: Rename Columns 4
      renames:
      - CUSTBODY_SCV_AOP_LOAI_BAO_CAO -> Id Báo cáo
      - Doanh số (AOP) -> Doanh số (AOP) Chuỗi
      - LN Giao (AOP) -> LN Giao (AOP) Chuỗi
    - step: Join_3
      type: Join
      label: Join AOP Chuỗi vs Actual
      join_type: fullouterjoin
      left: AddColumns_2
      right: GroupBy_3
      'on':
      - POSTINGPERIOD = POSTINGPERIOD
      - ID Chuỗi = ID  Chuỗi
      condition: and
    - step: SelectColumns_5
      type: SelectColumns
      label: Select Columns 5
      selected_columns:
      - Posting Period
      - Subsidiary Id
      - ID CLASS
      - ID Sales Channel
      - ID Chain
      - Doanh số (AOP) TĐ
      - LN Giao (AOP) TĐ
      - Doanh số (AOP) Ngành
      - LN Giao (AOP) Ngành
      - Doanh số (AOP) Kênh
      - LN Giao (AOP) Kênh
      - Doanh số (AOP) Chuỗi
      - LN Giao (AOP) Chuỗi
      - Doanh số thực tế
      - Doanh thu thực tế
      - Giá Vốn
      - LN Gộp
      - DS T1
      - DS T2
      - DS T3
      - DS T4
      - DS T5
      - DS T6
      - DS T7
      - DS T8
      - DS T9
      - DS T10
      - DS T11
      - DS T12
      - Doanh số lũy kế
      - Doanh số quy đổi
      - Doanh thu ngành khác
    - step: GroupBy_0
      type: GroupBy
      label: Aggregate
      group_by:
      - POSTINGPERIOD
      - SUBSIDIARY
      - ID CLASS
      - ID Kênh
      - ID Chuỗi
      aggregations:
      - Doanh số thực tế = sum(Doanh số thực tế)
      - Doanh thu thực tế = sum(Doanh thu thực tế)
      - DS T1 = sum(DS T1)
      - DS T2 = sum(DS T2)
      - DS T3 = sum(DS T3)
      - DS T4 = sum(DS T4)
      - DS T5 = sum(DS T5)
      - DS T6 = sum(DS T6)
      - DS T7 = sum(DS T7)
      - DS T8 = sum(DS T8)
      - DS T9 = sum(DS T9)
      - DS T10 = sum(DS T10)
      - DS T11 = sum(DS T11)
      - DS T12 = sum(DS T12)
      - Doanh số lũy kế = sum(Doanh số lũy kế)
      - Doanh số quy đổi = sum(Doanh số quy đổi)
      - Giá Vốn = sum(Giá Vốn)
      - LN Gộp = sum(LN Gộp)
      - Doanh thu ngành khác = sum(Doanh thu ngành khác)
    - step: AddColumns_2
      type: AddColumns
      label: Adđ tên kênh final
      adds:
      - name: ID Sales Channel
        expression: |-
          IFNULL(
            "ID Kênh",
            "ID Kênh_1"
          )
    - step: AddColumns_3
      type: AddColumns
      label: Add Period, chuỗi, sub final
      adds:
      - name: Posting Period
        expression: |-
          IFNULL(
              "POSTINGPERIOD",
              IFNULL(
                  "POSTINGPERIOD_1",
                  IFNULL(
                      "POSTINGPERIOD_2",
                      IFNULL(
                          "POSTINGPERIOD_3",
                          "POSTINGPERIOD_4"
                      )
                  )
              )
          )
      - name: ID Chain
        expression: |-
          IFNULL(
            "ID Chuỗi", "ID  Chuỗi")
      - name: Subsidiary Id
        expression: |
          IFNULL(
              "SUBSIDIARY",
              IFNULL(
                  "SUBSIDIARY_1",
                  IFNULL(
                      "SUBSIDIARY_2",
                          "SUBSIDIARY_3"
                      )
                  )
              )
    - step: GroupBy_2
      type: GroupBy
      label: Aggregate 2
      group_by:
      - POSTINGPERIOD
      - SUBSIDIARY
      aggregations:
      - Doanh số (AOP) TĐ = sum(Doanh số (AOP) TĐ)
      - LN Giao (AOP) TĐ = sum(LN Giao (AOP) TĐ)
    - step: GroupBy_3
      type: GroupBy
      label: Aggregate 3
      group_by:
      - POSTINGPERIOD
      - SUBSIDIARY
      - ID  Chuỗi
      aggregations:
      - Doanh số (AOP) Chuỗi = sum(Doanh số (AOP) Chuỗi)
      - LN Giao (AOP) Chuỗi = sum(LN Giao (AOP) Chuỗi)
    - step: GroupBy_4
      type: GroupBy
      label: Aggregate 4
      group_by:
      - POSTINGPERIOD
      - ID Kênh
      aggregations:
      - Doanh số (AOP) Kênh = sum(Doanh số (AOP) Kênh)
      - LN Giao (AOP) Kênh = sum(LN Giao (AOP) Kênh)
    - step: GroupBy_5
      type: GroupBy
      label: Aggregate 5
      group_by:
      - POSTINGPERIOD
      - SUBSIDIARY
      - ID CLASS
      aggregations:
      - Doanh số (AOP) Ngành = sum(Doanh số (AOP) Ngành)
      - LN Giao (AOP) Ngành = sum(LN Giao (AOP) Ngành)
