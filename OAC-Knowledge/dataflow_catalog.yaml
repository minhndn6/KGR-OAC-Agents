  KGR_DF_Daily_TD_Report:
    description: 'Báo cáo ngày cấp Tập đoàn: ghép bảng lãi lỗ Tập đoàn với kế hoạch AOP theo ngày và tỷ trọng sản phẩm mới,
      để theo dõi lũy kế so với kế hoạch.'
    dataflow_id: '''minhndn@bizin.vn''.''KGR_DF_Daily_TD_Report'''
    name: KGR_DF_Daily_TD_Report
    object_path: /@default/{dataflows}'minhndn@bizin.vn'.'KGR_DF_Daily_TD_Report'
    last_modified: '2026-06-25'
    version:
    input_datasets:
    - TD_Report_Long
    - AOP LINE CF
    - SPmoi_ng_v3
    output_datasets:
    - Daily_TD_Report
    in_closure: true
    n_steps: 14
    steps:
    - step: InputDataset_0
      type: InputDataset
      label: TD_Report_Long
      input_dataset: TD_Report_Long
      dataset_type: db
    - step: AddColumns_0
      type: AddColumns
      label: Add Columns
      adds:
      - name: DS_TT
        expression: CASE WHEN Metric_Code = 1 THEN Actual_Amount END
      - name: CKKM_TT
        expression: CASE WHEN Metric_Code = 5 THEN Actual_Amount END
      - name: LNST
        expression: CASE WHEN Metric_Code = 23 THEN Actual_Amount END
      - name: TyLeXD
        expression: CASE WHEN Metric_Code = 24 THEN Actual_Amount END
    - step: GroupBy_0
      type: GroupBy
      label: Aggregate
      group_by:
      - PERIODNAME
      - AsOfDate
      aggregations:
      - Metric_Code Maximum = max(Metric_Code)
      - "\uFEFFSort_Order Sum = sum(\uFEFFSort_Order)"
      - Actual_Amount Sum = sum(Actual_Amount)
      - DT_grain Sum = sum(DT_grain)
      - AOP_Amount Sum = sum(AOP_Amount)
      - Chỉ tiêu (AOP) Sum = sum(Chỉ tiêu (AOP))
      - AOP_Amount_1 Sum = sum(AOP_Amount_1)
      - AOP_Per Sum = sum(AOP_Per)
      - AOP_Amount_2 Sum = sum(AOP_Amount_2)
      - AOP_Per_24 Sum = sum(AOP_Per_24)
      - DS_TT Sum = sum(DS_TT)
      - CKKM_TT Sum = sum(CKKM_TT)
      - LNST Sum = sum(LNST)
      - TyLeXD = sum(TyLeXD)
    - step: RenameColumns_0
      type: RenameColumns
      label: Rename Columns
      renames:
      - DS_TT Sum -> DS_TT
      - CKKM_TT Sum -> CKKM_TT
      - LNST Sum -> LNST
    - step: AddColumns_2
      type: AddColumns
      label: Add Columns 2
      adds:
      - name: DS_ConPhaiThucHien
        expression: '"CUSTCOL_SCV_AOP_DOANH_SO Sum" - "DS_TT"'
      - name: CKKM_ConDuocSuDung
        expression: '"CUSTCOL_SCV_AOP_CP_CKKM Sum" - "CKKM_TT"'
      - name: PhanTram_CKKM_AOP
        expression: '"CUSTCOL_SCV_AOP_CKKM Average"'
      - name: PhanTram_LoiNhuan_AOP
        expression: '"CUSTCOL_SCV_AOP_LOI_NHUAN Average"'
      - name: LN_ConPhaiThucHien
        expression: '"CUSTCOL_SCV_AOP_LN_GIAO Sum" - "LNST"'
      - name: DS_AOP
        expression: '"CUSTCOL_SCV_AOP_DOANH_SO Sum"'
      - name: CKKM_AOP
        expression: '"CUSTCOL_SCV_AOP_CP_CKKM Sum"'
      - name: LNGiao
        expression: '"CUSTCOL_SCV_AOP_LN_GIAO Sum"'
    - step: OutputDataset_0
      type: OutputDataset
      label: Save Data
      output_dataset: Daily_TD_Report
      save_type: obi
      output_type: Create
      output_columns:
      - PERIODNAME
      - AsOfDate
      - Metric_Code Maximum
      - "\uFEFFSort_Order Sum"
      - Actual_Amount Sum
      - DT_grain Sum
      - AOP_Amount Sum
      - Chỉ tiêu (AOP) Sum
      - AOP_Amount_1 Sum
      - AOP_Per Sum
      - AOP_Amount_2 Sum
      - AOP_Per_24 Sum
      - DS_AOP
      - DS_TT
      - CKKM_AOP
      - CKKM_TT
      - LNGiao
      - LNST
      - TyLeXD
      - PERIODNAME_1
      - CUSTCOL_SCV_AOP_DOANH_SO Sum
      - CUSTCOL_SCV_AOP_CP_CKKM Sum
      - CUSTCOL_SCV_AOP_LN_GIAO Sum
      - CUSTCOL_SCV_AOP_CKKM Average
      - CUSTCOL_SCV_AOP_LOI_NHUAN Average
      - DS_ConPhaiThucHien
      - CKKM_ConDuocSuDung
      - PhanTram_CKKM_AOP
      - PhanTram_LoiNhuan_AOP
      - LN_ConPhaiThucHien
      - PERIODNAME_2
      - AsOfDate_1
      - ID CLASS Maximum
      - DT_ng Sum
      - a10_ng Sum
      - a1_ng Sum
      - a3_ng Sum
      - a5_ng Sum
      - a19_Doanh thu ngành khác_ng Sum
      - DS Xanh Sum_ng Sum
      - DS Đỏ Sum_ng Sum
      - DT_SPmoi_ng Sum
      - TyTrong_SP_Moi
    - step: InputDataset_1
      type: InputDataset
      label: (KGR) AOP_UPDATE
      input_dataset: AOP LINE CF
      dataset_type: datamodel
      physical_tables:
        DW_NS_ACCOUNTINGPERIOD_D:
        - PERIODNAME
        DW_NS_X_AOP_HEADER_SF:
        - POSTINGPERIOD
        DW_NS_X_AOP_LINE_CF:
        - CUSTCOL_SCV_AOP_DOANH_SO
        - CUSTCOL_SCV_AOP_CP_CKKM
        - CUSTCOL_SCV_AOP_LN_GIAO
        - CUSTCOL_SCV_AOP_CKKM
        - CUSTCOL_SCV_AOP_LOI_NHUAN
        DW_NS_X_AOP_HEADER_CF:
        - CUSTBODY_SCV_AOP_LOAI_BAO_CAO
    - step: GroupBy_1
      type: GroupBy
      label: Aggregate 1
      group_by:
      - PERIODNAME
      aggregations:
      - CUSTCOL_SCV_AOP_DOANH_SO Sum = sum(CUSTCOL_SCV_AOP_DOANH_SO)
      - CUSTCOL_SCV_AOP_CP_CKKM Sum = sum(CUSTCOL_SCV_AOP_CP_CKKM)
      - CUSTCOL_SCV_AOP_LN_GIAO Sum = sum(CUSTCOL_SCV_AOP_LN_GIAO)
      - CUSTCOL_SCV_AOP_CKKM Average = avg(CUSTCOL_SCV_AOP_CKKM)
      - CUSTCOL_SCV_AOP_LOI_NHUAN Average = avg(CUSTCOL_SCV_AOP_LOI_NHUAN)
    - step: Filter_0
      type: Filter
      label: Filter
      filters:
      - '"CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 5 and 5'
    - step: Join_0
      type: Join
      label: Join
      join_type: innerjoin
      left: RenameColumns_0
      right: GroupBy_1
      'on':
      - PERIODNAME = PERIODNAME
      condition: and
    - step: InputDataset_2
      type: InputDataset
      label: SPmoi_ng_v3
      input_dataset: SPmoi_ng_v3
      dataset_type: parquet
    - step: GroupBy_2
      type: GroupBy
      label: Aggregate 2
      group_by:
      - PERIODNAME
      - AsOfDate
      aggregations:
      - ID CLASS Maximum = max(ID CLASS)
      - DT_ng Sum = sum(DT_ng)
      - a10_ng Sum = sum(a10_ng)
      - a1_ng Sum = sum(a1_ng)
      - a3_ng Sum = sum(a3_ng)
      - a5_ng Sum = sum(a5_ng)
      - a19_Doanh thu ngành khác_ng Sum = sum(a19_Doanh thu ngành khác_ng)
      - DS Xanh Sum_ng Sum = sum(DS Xanh Sum_ng)
      - DS Đỏ Sum_ng Sum = sum(DS Đỏ Sum_ng)
      - DT_SPmoi_ng Sum = sum(DT_SPmoi_ng)
    - step: Join_2
      type: Join
      label: Join 2
      join_type: leftouterjoin
      left: AddColumns_2
      right: GroupBy_2
      'on':
      - PERIODNAME = PERIODNAME
      - AsOfDate = AsOfDate
      condition: and
    - step: AddColumns_1
      type: AddColumns
      label: Add Columns 1
      adds:
      - name: TyTrong_SP_Moi
        expression: '"DT_SPmoi_ng Sum"/"DT_ng Sum"'
