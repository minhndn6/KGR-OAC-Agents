      - Tên Chuỗi
      - Nhóm Kênh
      - Model name
      - Nhóm xanh đỏ
      - Quy hoạch SP
      - ID Kênh
      - POSTINGPERIOD
      - ID XD
      - Location Name
      - Sales Category
      - Vụ việc
      - Nhóm SP
      - CUSTOMER
      - Item Name
      - Doanh thu thực tế
      - TAX AMT
      - TAX RATE
      - Doanh thu thực tế_total
      - Doanh thu ngành khác
      - ID MODEL
      - ID NHOMXANHDO
      - ID CLASS
      - ID Nhóm kênh
      - a6_CP nhân viên KD
      - Month Key
      - Doanh số quy đổi
      - ITEMTYPE
      - CUSTCOL_SCV_LINE_ISFREEGIFT
      - PARENT_NAME
      - CUSTBODY_SCV_TRANS_SCT_FAST
      - CUSTCOL_SCV_DISCOUNT_AMOUNT_01
      - CKKM theo Line (+VAT)
      - UPCCODE
    - step: AddColumns_8
      type: AddColumns
      label: Doanh số thực tế vs a6_CP NVKD
      adds:
      - name: Doanh số thực tế
        expression: '"Doanh thu thực tế" - "TAX AMT" + "Thuế ngành khác" - "Thuế CKKM theo line"'
      - name: a6_CP nhân viên KD
        expression: '"Doanh thu thực tế"* "CUSTRECORD_SCV_TY_LE_PER_LUONG"'
    - step: RenameColumns_5
      type: RenameColumns
      label: Rename Columns 5
      renames:
