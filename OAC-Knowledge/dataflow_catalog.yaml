      label: Select Columns 4
      selected_columns:
      - DT_TĐ
      - a6
      - a7
      - a8
      - a15
      - a16
      - a17
      - adp
      - a10
      - a12
      - a18
      - a19_Doanh thu ngành khác
      - AOP_AMT_A10
      - AOP_AMT_A12
      - AOP_AMT_A18
      - AOP_AMT_A19
      - PERIODNAME
      - AsOfDate
      - ID CLASS
      - DT_ng
      - a10_ng
      - a1_ng
      - a3_ng
      - a5_ng
      - a19_Doanh thu ngành khác_ng
      - DS Xanh Sum_ng
      - DS Đỏ Sum_ng
      - So_Ngay
      - PERIODNAME_1
      - AsOfDate_1
      - a10_CP_Xuc_tien_ban_hang_max
      - a1_Doanh số thực tế Sum
      - a3_Giá Vốn
      - a5_CP CKKM
      - DS Xanh Sum
      - DS Đỏ Sum
      - So_Ngay_1
      - PERIODNAME_1_1
      - AOP_PER_A6
