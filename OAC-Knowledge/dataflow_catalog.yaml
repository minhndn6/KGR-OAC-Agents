dataflows:
  (KGR) 1. DTF_CALC_INVOICE_MEMO_#:
    description: Dataflow gốc tính doanh thu và giá vốn ở mức từng dòng hóa đơn. Hợp nhất hóa đơn bán hàng với chứng từ điều
      chỉnh giảm (credit memo) để ra doanh thu thực tế; tính giá vốn theo 3 tầng (ưu tiên giá vốn mục tiêu, thiếu thì lấy
      giá vốn tồn kho); trừ chiết khấu khuyến mãi (CKKM). Chỉ tính cho 2 pháp nhân 'CTCP LD Kangaroo Quốc tế' và 'Chi nhánh
      HCM', chỉ lấy giao dịch đã hạch toán, loại vụ việc 'HTL' và khách ký gửi. Là nguồn dữ liệu cho hầu hết báo cáo doanh
      thu, lợi nhuận và SFC.
    dataflow_id: '''anhdk@bizin.vn''.''(KGR) 1. DTF_CALC_INVOICE_MEMO_V2'''
    name: (KGR) 1. DTF_CALC_INVOICE_MEMO_#
    object_path: /@default/{dataflows}'anhdk@bizin.vn'.'(KGR) 1. DTF_CALC_INVOICE_MEMO_V2'
    last_modified: '2026-07-06'
    version:
    input_datasets:
    - Giá vốn mục tiêu
    - Giá vốn tồn kho
    - 1. Invoice_v2
    - (KGR) CKKM TT
    - (KGR) Tỉ lệ chi phí Lương
    - (KGR) Invoice_Line+Header+Pro
    - DW_CREDIT_MEMO
    - CreditMemo_Line+Pro
    output_datasets:
    - (KGR) DTF_CALC_INVOICE_MEMO_#
    in_closure: true
    n_steps: 57
    steps:
    - step: InputDataset_3
      type: InputDataset
      label: Giá vốn mục tiêu
      input_dataset: Giá vốn mục tiêu
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_GIA_VON_MUC_TIEU_CT:
        - CUSTRECORD_SCV_GVMT_LINE_END_DATE
        - CUSTRECORD_SCV_GVMT_LINE_GVMT_SP
        - CUSTRECORD_SCV_GVMT_LINE_MODEL
        - CUSTRECORD_SCV_GVMT_LINE_MSP
        - CUSTRECORD_SCV_GVMT_LINE_START_DATE
        - ID
        - ISINACTIVE
        - NAME
    - step: InputDataset_4
      type: InputDataset
      label: Giá vốn tồn kho
      input_dataset: Giá vốn tồn kho
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_GIA_VON_TON_KHO:
        - CUSTRECORD_SCV_GVTK_ITEM_CODE_L
        - Next period
        - CUSTRECORD_SCV_GVTK_ITEM_NAME_L
        - CUSTRECORD_SCV_GVTK_PERIOD_L
        - CUSTRECORD_SCV_GVTK_SUBSIDIARY_L
