      type: Join
      label: Join
      join_type: leftouterjoin
      left: InputDataset_0
      right: InputDataset_5
      'on':
      - ID = ID
      - TRANSACTION = TRANSACTION
      condition: and
    - step: AddColumns_16
      type: AddColumns
      label: Add Columns 16
      adds:
      - name: Is Công ty con Chi nhánh Memo
        expression: Case When "CSEG_SCV_SC" = 14 then 'T' when "CSEG_SCV_SC_1" = 14 then 'T' Else 'F' End
    - step: Filter_5
      type: Filter
      label: Filter 5
      filters:
      - '"Is Công ty con Chi nhánh Memo" IN(''F'') and ("Is Công ty con Chi nhánh Memo" IS NULL or "Is Công ty con Chi nhánh
        Memo" NOT IN(''T''))'
    - step: AddColumns_15
      type: AddColumns
      label: Add Columns 15
      adds:
      - name: Is Công ty con Chi nhánh Invoice
        expression: Case When "CSEG_SCV_SC" = 14 then 'T' Else 'F' End
    - step: Filter_2
      type: Filter
      label: Filter 2
      filters:
      - ("Is Công ty con Chi nhánh Invoice" IS NULL or "Is Công ty con Chi nhánh Invoice" NOT IN('T'))
    - step: AddColumns_17
      type: AddColumns
      label: Add Columns 17
      adds:
      - name: Month Key
        expression: YEAR("GVMT_LINE_START_DATE") * 100 + MONTH("GVMT_LINE_START_DATE")
    - step: AddColumns_18
      type: AddColumns
      label: CP CKKM Kênh/Chuỗi, CKKM Per
      adds:
      - name: CP CKKM Chuỗi
        expression: '"Doanh thu thực tế"*IFNULL("CKKM Per Chuỗi",0)'
      - name: CP CKKM Kênh
        expression: '"Doanh thu thực tế" * IFNULL ("CKKM Per Kênh",0)'
      - name: CKKM Per
        expression: |-
          CASE
              WHEN "CKKM Per Kênh" IS NOT NULL
                   AND "CKKM Per Kênh" <> 0
              THEN "CKKM Per Kênh"

              WHEN "CKKM Per Chuỗi" IS NOT NULL
                   AND  "CKKM Per Chuỗi" <> 0
              THEN  "CKKM Per Chuỗi"

              ELSE 0
          END
    - step: Branch_0
      type: Branch
      label: Branch
    - step: GroupBy_0
      type: GroupBy
      label: Kênh + Model
      group_by:
      - NAME
      - Model
      - Tên Kênh
      - CUSTRECORD_SCV_PRO_DIS_PERIOD
      aggregations:
      - CKKM Per Kênh = sum(CUSTRECORD_SCV_PRO_DIS_LINE_DISCOUNT)
    - step: GroupBy_2
