      - T1_GVMT
      - T2_GVTK
      - T3_FB50
      - Unit Cost
      - Doanh số thực tế
      - Doanh thu ngành khác
      - Doanh thu thực tế
      - DS Xanh
      - DS Đỏ
      - LN Gộp
      - Doanh thu SP mới
      - '%LN Gộp'
      - Tỷ trọng SP mới
      - CP CKKM
      - '%GP Ròng'
      - a6_CP nhân viên KD
      - 'a25_CP dự phòng (trả hàng, thanh lý, hủy...) '
      - CKKM Per
      - DS T1
      - DS T2
      - DS T3
      - DS T4
      - DS T5
      - DS T6
      - DS T7
      - DS T8
      - DS T9
      - DS T10
      - DS T11
      - DS T12
      - Doanh số lũy kế
      - Doanh số quy đổi
      - QUANTITY
      - CUSTCOL_SCV_LINE_ISFREEGIFT
      - PARENT_NAME
      - CUSTBODY_SCV_TRANS_SCT_FAST
      - 'CUSTCOL_SCV_DISCOUNT_AMOUNT_01 '
      - CKKM theo Line (+VAT)
    - step: InputDataset_1
      type: InputDataset
      label: (KGR) CKKM TT
      input_dataset: (KGR) CKKM TT
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_TRADE_PROMOTION_HEADER:
        - NAME
        - CUSTRECORD_SCV_PRO_DIS_PERIOD
        - W$_INSERT_DT
        DW_NS_X_TRADE_PROMOTION_LINE:
        - CUSTRECORD_SCV_PRO_DIS_LINE_DISCOUNT
        - CUSTRECORD_SCV_PRO_DIS_LINE_KENH_CHUOI
        - CUSTRECORD_SCV_PRO_DIS_LINE_MODEL
        - CUSTRECORD_SCV_PRO_DIS_LINE_SALES_CHAN
    - step: Join_2
      type: Join
      label: Join 2
      join_type: leftouterjoin
      left: AddColumns_0
      right: GroupBy_5
      'on':
      - ID Chuỗi = ID Chuỗi
      - ID MODEL = ID Model
      - POSTINGPERIOD = CUSTRECORD_SCV_PRO_DIS_PERIOD
      condition: and
    - step: AddColumns_0
      type: AddColumns
      label: '%LN Gộp'
      adds:
      - name: '%LN Gộp'
        expression: '"LN Gộp"/"Doanh thu thực tế"'
      - name: Tỷ trọng SP mới
        expression: '"Doanh thu SP mới"/"Doanh thu thực tế"'
    - step: AddColumns_4
      type: AddColumns
      label: CP CKKM Kênh/Chuỗi, CKKM Per
      adds:
      - name: CKKM Per
        expression: "CASE\n    WHEN \"CKKM Per Kênh\" IS NOT NULL AND \"ID Kênh\" IS NOT NULL \n       \n    THEN \"CKKM Per\
          \ Kênh\"\n\n    WHEN \"CKKM Per Chuỗi\" IS NOT NULL\n         AND \"ID Chuỗi\" IS NOT NULL\n    THEN  \"CKKM Per\
          \ Chuỗi\"\n\n    ELSE 0\nEND"
    - step: AddColumns_6
      type: AddColumns
      label: CP CKKM VS % GP Ròng
      adds:
      - name: '%GP Ròng'
        expression: IFNULL("%LN Gộp",0) - IFNULL("CKKM Per",0)
      - name: CP CKKM
        expression: '"Doanh thu thực tế" * "CKKM Per"'
    - step: RenameColumns_6
      type: RenameColumns
      label: Rename Columns 6
      renames:
      - ID -> LINE ID
      - Tên ngành -> Tên Ngành
      - CSEG_SCV_MODEL -> ID MODEL
      - CSEG_SCV_NHOMXANHDO -> ID NHOMXANHDO
      - CLASS -> ID CLASS
    - step: RenameColumns_7
      type: RenameColumns
      label: Rename Columns 7
      renames:
      - ID_1 -> ID Kênh
      - Tên ngành -> Tên Ngành
      - NAME -> Model name
      - ID -> LINE ID
      - TAX1AMT -> TAX AMT
      - TAXRATE1 -> TAX RATE
      - CSEG_SCV_MODEL -> ID MODEL
      - CSEG_SCV_NHOMXANHDO -> ID NHOMXANHDO
      - CLASS -> ID CLASS
      - CSEG_SCV_CHAIN -> ID Chuỗi
      - CSEG_SCV_CHAIN_1 -> ID Chuỗi
      - CSEG_SCV_SC_1 -> ID Kênh Customer
      - CSEG_SCV_SC -> ID Kênh
      - NAME_1 -> Vụ việc
    - step: Concatenate_1
      type: Concatenate
      label: Union Rows 1
      union_type: union all
      left: RenameColumns_6
      right: Filter_1
      match:
    - step: Filter_1
      type: Filter
      label: Filter 1
      filters:
      - '"ISPOSTING" IN(''T'') and "ACCTTYPE" IN(''Income'', ''OthCurrLiab'') and "Tên Đơn vị" IN(''CTCP LD Kangaroo Quốc
        tế'', ''Chi nhánh HCM'') and "Kênh nội bộ" IN(''T'')'
