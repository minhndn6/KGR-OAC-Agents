      group_by:
      - PERIODNAME
      - AsOfDate
      - TenNganh
      - "\uFEFFSort_Order"
      - IDCLASS
      - Metric_Code
      - Metric_Name
      aggregations:
      - Actual_Amount Sum = sum(Actual_Amount)
      - DT_grain Sum = sum(DT_grain)
      - AOP_Amount Sum = sum(AOP_Amount)
      - DS_TT Sum = sum(DS_TT)
      - CKKM_TT Sum = sum(CKKM_TT)
      - LNST Sum = sum(LNST)
      - LNGop Sum = sum(LNGop)
      - TyLeXD Sum = sum(TyLeXD)
    - step: RenameColumns_1
