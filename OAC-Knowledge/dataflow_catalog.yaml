          0 End
      - name: Chi phí Roadshow HN
        expression: Case when "VALID_FLAG_RSHN_NVKD" = 'T' Then "Doanh thu thực tế" * "CUSTRECORD_SCV_RSHN_PER" Else 0 End
      - name: Chi phí CTTK
        expression: Case when "VALID_FLAG_KHAC_NVKD" = 'T' Then "Doanh thu thực tế" * "CUSTRECORD_SCV_TY_LE_CTTK_PER" Else
          0 End
