      - Model
      - CUSTRECORD_SCV_PRO_DIS_PERIOD
      aggregations:
      - CKKM Per Chuỗi = sum(CUSTRECORD_SCV_PRO_DIS_LINE_DISCOUNT)
    - step: Join_1
      type: Join
      label: Join 1
      join_type: leftouterjoin
      left: Join_2
      right: GroupBy_0
      'on':
      - Tên Kênh = Tên Kênh
      - Model name = Model
      - POSTINGPERIOD = CUSTRECORD_SCV_PRO_DIS_PERIOD
      condition: and
