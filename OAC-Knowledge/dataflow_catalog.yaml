      - AOP_Amount
      - PERIODNAME_1
      - Chỉ tiêu (AOP)
      - AOP_Amount_1
      - AOP_Per
      - AOP_Amount_2
      - AOP_Per_24
    - step: Branch_1
      type: Branch
