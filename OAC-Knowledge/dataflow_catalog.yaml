  DF_TD_Report_PNL_Bridge_Nganh:
    dataflow_id: '''b9af193b-0871-430d-aae5-bb90ecfaf792''.''DF_TD_Report_PNL_Bridge_Nganh'''
    name: DF_TD_Report_PNL_Bridge_Nganh
    object_path: /users/minhndn@bizin.vn
    last_modified: '2026-06-18'
    version: '2.6'
    input_datasets:
    - Nganh_Report_Long_#
    output_datasets:
    - TD_Report_PNL_Bridge_Nganh
    in_closure: true
    n_steps: 18
    steps:
    - step: InputDataset_M
      type: InputDataset
      label: Nganh_Report_Long_#
      input_dataset: Nganh_Report_Long_#
      dataset_type: db
    - step: AddColumns_M
      type: AddColumns
      label: Map movements
      adds:
      - name: Bridge_Order
        expression: "CASE WHEN \"\uFEFFSort_Order\"=2 THEN 1 WHEN \"\uFEFFSort_Order\"=3 THEN 2 WHEN \"\uFEFFSort_Order\"\
          \ IN (5,6,7,8) THEN 4 WHEN \"\uFEFFSort_Order\"=10 THEN 6 WHEN \"\uFEFFSort_Order\"=12 THEN 8 WHEN \"\uFEFFSort_Order\"\
          =14 THEN 10 WHEN \"\uFEFFSort_Order\"=20 THEN 11 WHEN \"\uFEFFSort_Order\"=22 THEN 13 ELSE NULL END"
      - name: Bridge_Label
        expression: "CASE WHEN \"\uFEFFSort_Order\"=2 THEN 'Doanh thu' WHEN \"\uFEFFSort_Order\"=3 THEN 'Giá vốn' WHEN \"\uFEFF\
          Sort_Order\" IN (5,6,7,8) THEN 'CP bán hàng & quản lý KD' WHEN \"\uFEFFSort_Order\"=10 THEN 'CP xúc tiến bán hàng'\
          \ WHEN \"\uFEFFSort_Order\"=12 THEN 'CP nhân viên BO' WHEN \"\uFEFFSort_Order\"=14 THEN 'CP quản lý vận hành' WHEN\
          \ \"\uFEFFSort_Order\"=20 THEN 'Thu nhập khác' WHEN \"\uFEFFSort_Order\"=22 THEN 'CP dự phòng hoạt động năm trước'\
          \ ELSE NULL END"
      - name: Direction
        expression: "CASE WHEN \"\uFEFFSort_Order\"=2 THEN 'Start' WHEN \"\uFEFFSort_Order\"=20 THEN 'Increase' WHEN \"\uFEFF\
          Sort_Order\" IN (3,5,6,7,8,10,12,14,22) THEN 'Decrease' ELSE NULL END"
      - name: Step_Value
        expression: "CASE WHEN \"\uFEFFSort_Order\" IN (2,20) THEN \"Actual_Amount\" WHEN \"\uFEFFSort_Order\" IN (3,5,6,7,8,10,12,14,22)\
          \ THEN 0 - \"Actual_Amount\" ELSE 0 END"
      - name: Tên Ngành
        expression: CASE WHEN "ID CLASS"=1 THEN 'Water care' WHEN "ID CLASS"=2 THEN 'Home care' WHEN "ID CLASS"=3 THEN 'Cold
          & Hygen care' WHEN "ID CLASS"=4 THEN 'Sanitary care' WHEN "ID CLASS"=5 THEN 'Khác' ELSE '~No Value~' END
    - step: Filter_M
      type: Filter
      label: Filter movements
      filters:
      - "\"\uFEFFSort_Order\" IN (2,3,5,6,7,8,10,12,14,20,22)"
    - step: GroupBy_M
      type: GroupBy
      label: Aggregate movements
      group_by:
      - AsOfDate
      - ID CLASS
      - Tên Ngành
      - Bridge_Order
      - Bridge_Label
      - Direction
      aggregations:
      - Step_Value = sum(Step_Value)
    - step: CumulativeAggregate_M
      type: AddColumns
      label: Cumulative cum_after
      adds:
      - name: cum_after
        expression: RSUM("Step_Value" BY "AsOfDate","ID CLASS")
    - step: AddColumns_M2
      type: AddColumns
      label: cum_before & Magnitude (M)
      adds:
      - name: cum_before
        expression: IFNULL("cum_after",0) - IFNULL("Step_Value",0)
      - name: Magnitude
        expression: Abs("Step_Value")
    - step: InputDataset_A
      type: InputDataset
      label: Nganh_Report_Long_#
      input_dataset: Nganh_Report_Long_#
      dataset_type: db
    - step: AddColumns_A
      type: AddColumns
      label: Map anchors
      adds:
      - name: Bridge_Order
        expression: "CASE WHEN \"\uFEFFSort_Order\"=4 THEN 3 WHEN \"\uFEFFSort_Order\"=9 THEN 5 WHEN \"\uFEFFSort_Order\"\
          =11 THEN 7 WHEN \"\uFEFFSort_Order\"=13 THEN 9 WHEN \"\uFEFFSort_Order\"=21 THEN 12 WHEN \"\uFEFFSort_Order\"=23\
          \ THEN 14 ELSE NULL END"
      - name: Bridge_Label
        expression: "CASE WHEN \"\uFEFFSort_Order\"=4 THEN 'Lợi nhuận gộp' WHEN \"\uFEFFSort_Order\"=9 THEN 'Lợi nhuận gộp\
          \ Kinh doanh' WHEN \"\uFEFFSort_Order\"=11 THEN 'Lợi nhuận xúc tiến bán hàng' WHEN \"\uFEFFSort_Order\"=13 THEN\
          \ 'Lợi nhuận nhân viên' WHEN \"\uFEFFSort_Order\"=21 THEN 'Lợi nhuận quản lý vận hành' WHEN \"\uFEFFSort_Order\"\
          =23 THEN 'Lợi nhuận trước thuế' ELSE NULL END"
      - name: Direction
        expression: '''Subtotal'''
      - name: Step_Value
        expression: '"Actual_Amount"'
      - name: Tên Ngành
        expression: CASE WHEN "ID CLASS"=1 THEN 'Water care' WHEN "ID CLASS"=2 THEN 'Home care' WHEN "ID CLASS"=3 THEN 'Cold
          & Hygen care' WHEN "ID CLASS"=4 THEN 'Sanitary care' WHEN "ID CLASS"=5 THEN 'Khác' ELSE '~No Value~' END
    - step: Filter_A
      type: Filter
      label: Filter anchors
      filters:
      - "\"\uFEFFSort_Order\" IN (4,9,11,13,21,23)"
    - step: GroupBy_A
      type: GroupBy
      label: Aggregate anchors
      group_by:
      - AsOfDate
      - ID CLASS
      - Tên Ngành
      - Bridge_Order
      - Bridge_Label
      - Direction
      aggregations:
      - Step_Value = sum(Step_Value)
    - step: AddColumns_A2
      type: AddColumns
      label: cum_before/after & Magnitude (A)
      adds:
      - name: cum_before
        expression: '0'
      - name: cum_after
        expression: IFNULL("Step_Value",0)
      - name: Magnitude
        expression: Abs("Step_Value")
    - step: Concatenate_0
      type: Concatenate
      label: Union Rows
      union_type: union all
      left: AddColumns_M2
      right: AddColumns_A2
      match: byName
    - step: OutputDataset_0
      type: OutputDataset
      label: Save Data
      output_dataset: TD_Report_PNL_Bridge_Nganh
      save_type: obi
      output_type: Create
      dataset_description: 'Per-NGÀNH P&L bridge: 14 rows/snapshot per ngành (8 movements + 6 subtotal anchors), running total
        restart per (AsOfDate, ID CLASS). Columns: AsOfDate, ID CLASS, Tên Ngành, Bridge_Order, Bridge_Label, Direction, Step_Value,
        Magnitude, cum_before, cum_after.'
      output_columns:
      - AsOfDate
      - ID CLASS
      - Tên Ngành
      - Bridge_Order
      - Bridge_Label
      - Direction
      - Step_Value
      - Magnitude
      - cum_before
      - cum_after
      - AOP_LNTT
    - step: InputDataset_AOP
      type: InputDataset
      label: Nganh_Report_Long_# (AOP)
      input_dataset: Nganh_Report_Long_#
      dataset_type: db
    - step: Filter_AOP
      type: Filter
      label: Filter LNTT plan
      filters:
      - "\"\uFEFFSort_Order\" = 23"
    - step: GroupBy_AOP
      type: GroupBy
      label: Aggregate AOP LNTT
      group_by:
      - AsOfDate
      - ID CLASS
      aggregations:
      - AOP_LNTT = sum(AOP_Amount)
    - step: Join_AOP
      type: Join
      label: Join AOP_LNTT
      join_type: leftouterjoin
      left: Concatenate_0
      right: GroupBy_AOP
      'on':
      - AsOfDate = AsOfDate
      - ID CLASS = ID CLASS
      condition: and
    - step: Select_AOP
      type: SelectColumns
      label: Keep cols + AOP_LNTT
      selected_columns:
      - AsOfDate
      - ID CLASS
      - Tên Ngành
      - Bridge_Order
      - Bridge_Label
      - Direction
      - Step_Value
      - Magnitude
      - cum_before
      - cum_after
      - AOP_LNTT
