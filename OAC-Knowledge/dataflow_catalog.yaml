      label: ID CLASS = 0
      adds:
      - name: ID CLASS
        expression: '0'
    - step: Select_Group
      type: SelectColumns
      label: Keep 5 cols (group)
      selected_columns:
      - Metric_Name
      - AsOfDate
      - Actual_Amount
      - AOP_Amount
      - ID CLASS
    - step: Union_0
      type: Concatenate
      label: Union Rows
      union_type: union all
      left: Select_Sectors
      right: Select_Group
      match: byName
    - step: OutputDataset_0
      type: OutputDataset
      label: Save Data
      output_dataset: Nganh_Report_Long_TD
      save_type: obi
      output_type: Create
      dataset_description: Sector P&L rows (ID CLASS 1-4/5) + added Group-total rows (ID CLASS=0 = SUM over sectors per Metric_Name
