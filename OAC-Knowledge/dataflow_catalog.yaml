        expression: YEAR("GVMT_LINE_START_DATE") * 100 + MONTH("GVMT_LINE_START_DATE")
    - step: AddColumns_18
      type: AddColumns
      label: CKKM Per
      adds:
      - name: CKKM Per
        expression: "CASE\n    WHEN \"CKKM Per Kênh\" IS NOT NULL AND \"ID Kênh\" IS NOT NULL\n       \n    THEN \"CKKM Per\
          \ Kênh\"\n\n    WHEN \"CKKM Per Chuỗi\" IS NOT NULL AND \"ID Chuỗi\" IS NOT NULL\n      \n    THEN  \"CKKM Per Chuỗi\"\
          \n\n    ELSE 0\nEND"
    - step: Branch_0
      type: Branch
      label: Branch
    - step: GroupBy_0
      type: GroupBy
      label: Kênh + Model
      group_by:
      - NAME
      - Model
      - Tên Kênh
      - CUSTRECORD_SCV_PRO_DIS_PERIOD
      - ID Kênh
      - ID Model
      aggregations:
      - CKKM Per Kênh = sum(CUSTRECORD_SCV_PRO_DIS_LINE_DISCOUNT)
    - step: GroupBy_2
      type: GroupBy
      label: Chuỗi + Model
      group_by:
