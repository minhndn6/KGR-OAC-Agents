      - CKKM -> CKKM Per
    - step: Filter_2
      type: Filter
      label: Filter lương
      filters:
      - ("Filter CP Lương" IS NULL or "Filter CP Lương" NOT IN('F'))
    - step: AddColumns_17
      type: AddColumns
      label: Add Columns 17
      adds:
      - name: Filter CP Lương
        expression: |-
          Case when "VALID_FLAG_LUONG_NVKD" = 1 then 'T'
          When "CUSTRECORD_SCV_TY_LE_PER_LUONG" is null then 'T'
          Else 'F' end
    - step: Branch_0
      type: Branch
      label: Branch
    - step: GroupBy_2
      type: GroupBy
      label: Agg Kênh + model
      group_by:
      - ID Model
      - ID Kênh
      - CUSTRECORD_SCV_PRO_DIS_PERIOD
      aggregations:
      - CKKM Per Kênh = avg(CKKM Per)
    - step: Join_0
      type: Join
      label: Join
      join_type: leftouterjoin
      left: Join_2
      right: GroupBy_2
      'on':
      - ID Kênh = ID Kênh
      - ID MODEL = ID Model
      - POSTINGPERIOD = CUSTRECORD_SCV_PRO_DIS_PERIOD
      condition: and
  DF_TD_Report_PNL_v2:
    dataflow_id: '''e2a77749-2452-4dda-a813-6f9c81455ceb''.''DF_TD_Report_PNL_v2'''
    name: DF_TD_Report_PNL_v2
    object_path: /users/minhndn@bizin.vn
    last_modified: '2026-06-17'
    version: '2.6'
    input_datasets:
    - TD_Report_Long
    output_datasets:
    - TD_Report_PNL_v2
    in_closure: false
    n_steps: 5
    steps:
    - step: InputDataset_0
      type: InputDataset
      label: TD_Report_Long
      input_dataset: TD_Report_Long
      dataset_type: db
    - step: AddColumns_0
      type: AddColumns
      label: Add Columns
      adds:
      - name: Signed_Amount
        expression: "CASE WHEN \"\uFEFFSort_Order\" IN (2, 20) THEN \"Actual_Amount\" WHEN \"\uFEFFSort_Order\" IN (3, 5,\
          \ 6, 7, 8, 10, 12, 15, 16, 17, 18, 19, 22) THEN 0 - \"Actual_Amount\" ELSE 0 END"
      - name: PL_Step
        expression: "CASE WHEN \"\uFEFFSort_Order\"=2 THEN '01. ' WHEN \"\uFEFFSort_Order\"=3 THEN '02. ' WHEN \"\uFEFFSort_Order\"\
          =5 THEN '03. ' WHEN \"\uFEFFSort_Order\"=6 THEN '04. ' WHEN \"\uFEFFSort_Order\"=7 THEN '05. ' WHEN \"\uFEFFSort_Order\"\
          =8 THEN '06. ' WHEN \"\uFEFFSort_Order\"=10 THEN '07. ' WHEN \"\uFEFFSort_Order\"=12 THEN '08. ' WHEN \"\uFEFFSort_Order\"\
          =15 THEN '09. ' WHEN \"\uFEFFSort_Order\"=16 THEN '10. ' WHEN \"\uFEFFSort_Order\"=17 THEN '11. ' WHEN \"\uFEFF\
          Sort_Order\"=18 THEN '12. ' WHEN \"\uFEFFSort_Order\"=19 THEN '13. ' WHEN \"\uFEFFSort_Order\"=20 THEN '14. ' WHEN\
          \ \"\uFEFFSort_Order\"=22 THEN '15. ' ELSE NULL END || \"Metric_Name\""
    - step: CumulativeAggregate_0
      type: AddColumns
      label: Cumulative Value
      adds:
      - name: cum_after
        expression: RSUM("Signed_Amount" BY "AsOfDate")
    - step: AddColumns_1
      type: AddColumns
      label: cum_before
      adds:
      - name: cum_before
        expression: IFNULL("cum_after",0) - IFNULL("Signed_Amount",0)
    - step: OutputDataset_0
      type: OutputDataset
      label: Save Data
      output_dataset: TD_Report_PNL_v2
      save_type: obi
      output_type: Create
      dataset_description: P&L long-format with Signed_Amount, PL_Step, cum_after, cum_before (running P&L for waterfall)
      output_columns:
      - PERIODNAME
      - AsOfDate
      - Metric_Code
      - Metric_Name
      - "\uFEFFSort_Order"
      - Type
      - Actual_Amount
      - DT_grain
      - AOP_Amount
      - PERIODNAME_1
      - Chỉ tiêu (AOP)
      - AOP_Amount_1
      - AOP_Per
      - AOP_Amount_2
      - AOP_Per_24
      - Signed_Amount
      - PL_Step
      - cum_after
      - cum_before
