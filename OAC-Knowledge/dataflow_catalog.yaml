    - step: InputDataset_0
      type: InputDataset
      label: DW_INVOICE
      input_dataset: 1. Invoice_v2
      dataset_type: datamodel
      physical_tables:
        DW_NS_CUSTOMER_INVOICE_LINES_F:
        - ID
        - TRANDATE
        - TRANSACTION
        - ITEM
        - QUANTITY
        - BASE_REVENUE
        - TAXLINE
        - TYPE
        - POSTINGPERIOD - 1
        - SUBSIDIARY
        - POSTINGPERIOD
        - CUSTOMER
        - CLASS
        - ITEMTYPE
        DW_NS_ACCOUNT_D:
        - ACCTTYPE
        DW_NS_ACCOUNTINGPERIOD_D:
        - PERIODNAME
        - Month_No
        - ISPOSTING
        DW_NS_X_CAM_CUSTINVCTRANSACTIONLINEEXTENSION:
        - CSEG_SCV_CHAIN
        - CSEG_SCV_NHOMXANHDO
        - CSEG_SCV_SC
        - CUSTCOL_SCV_LINE_ISFREEGIFT
        - CUSTCOL_SCV_DISCOUNT_AMOUNT_01
        DW_NS_X_SALE_CHANNEL:
        - Tên Kênh
        - ID
        DW_NS_SUBSIDIARY_D:
        - Tên Đơn vị
        DW_NS_CLASSIFICATION_D:
        - Tên ngành
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_CHAIN:
        - Tên Chuỗi
        DW_NS_X_LIST_SALE_CHANEL_NS:
        - Nhóm Kênh
        - ID Nhóm kênh
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_MODEL:
        - NAME
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_NHOMXANHDO:
        - Nhóm xanh đỏ
        - ID XD
        DW_NS_X_CAM_CUSTOMLIST_SCV_QUY_HOACH_SP:
        - Quy hoạch SP
        DW_NS_X_CAM_EMPLOYEEEXTENSION:
        - ID_employee
        DW_NS_LOCATION_D:
        - Location Name
        DW_NS_X_CAM_CUSTOMLIST_SCV_SALES_CATEGORY:
        - Sales Category
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_PRODGROUP:
        - Nhóm SP
        DW_NS_ITEM_D:
        - Item Name
        DW_NS_X_CAM_CUSTOMEREXTENSION:
        - CSEG_SCV_CHAIN
        - CSEG_SCV_SC
        DW_NS_X_CUST_INVOICE_LINES_SUPPLEMENTARY_1:
        - ID
        - TAX1AMT
        - TAXCODE
        - TAXRATE1
        DW_NS_X_CUSTOMER_EXTENSION_AUGMENTATION:
        - CUSTENTITY_SCV_KH_KY_GUI
        DW_NS_LOCATION_CF_DH:
        - PARENT_NAME
        DW_NS_X_CAM_CUSTINVCTRANSACTIONSEXTENSION:
        - CUSTBODY_SCV_TRANS_SCT_FAST
        DW_NS_X_CAM_ITEMEXTENSION:
        - CSEG_SCV_MODEL
    - step: Filter_0
      type: Filter
      label: Filter
      filters:
      - '"ISPOSTING" IN(''T'') and "ACCTTYPE" IN(''Income'', ''OthCurrLiab'') and "Tên Đơn vị" IN(''CTCP LD Kangaroo Quốc
        tế'', ''Chi nhánh HCM'') and "Kênh nội bộ" IN(''T'') and "Kênh nội bộ" IN(''T'')'
    - step: RenameColumns_3
      type: RenameColumns
      label: Rename Columns 3
      renames:
      - FULLNAME -> Ngành
      - ID_1 -> ID Kênh
      - NAME -> Model name
      - ID -> LINE ID
      - TAX1AMT -> TAX AMT
      - TAXRATE1 -> TAX RATE
      - Vụ việc_1 -> Vụ việc
      - CSEG_SCV_CHAIN_1 -> ID Chuỗi
      - CSEG_SCV_SC_1 -> ID Kênh Customer
      - CSEG_SCV_CHAIN -> ID Kênh
      - CSEG_SCV_SC -> ID Kênh
    - step: AddColumns_1
      type: AddColumns
      label: Giá vốn vs  a25_CP dự phòng (trả hàng,
      adds:
      - name: Giá Vốn
        expression: |-
          CASE

              WHEN
                  "CUSTCOL_SCV_LINE_ISFREEGIFT" = 'T'
                  AND
                  (
                      "Doanh thu thực tế" IS NULL
                      OR
                      "Doanh thu thực tế" = 0
                  )
              THEN 0

              WHEN "ITEMTYPE" = 'Discount'
              THEN 0

              ELSE

                  (
                      CASE
                          WHEN "TYPE" = 'CustCred'
                          THEN -1
                          ELSE 1
                      END
                  )

                  *

                  (

                      CASE

                          WHEN "GVMT" IS NOT NULL
                           AND "GVMT" <> 0
                          THEN
                              "GVMT"
                              *
                              ABS(
                                  "QUANTITY"
                              )

                          WHEN "GVTK" IS NOT NULL
                           AND "GVTK" <> 0
                          THEN
                              "GVTK"
                              *
                              ABS(
                                  "QUANTITY"
                              )

                          ELSE
                              ABS(
                                  "Doanh thu thực tế"
                              ) / 2

                      END

                  )

          END
      - name: T1_GVMT
        expression: |-
          CASE
          WHEN "ITEMTYPE" = 'Discount'
              THEN 0

              WHEN "GVMT" IS NOT NULL
               and "GVMT" <> 0

              THEN

                  "GVMT"
                  *
                  ABS(
                      "QUANTITY"
                  )

              ELSE 0

          END
      - name: T2_GVTK
        expression: |-
          CASE

              WHEN (
                      "GVMT" IS NULL
                   OR "GVMT" = 0
                   )

               AND "GVTK" IS NOT NULL
               AND "GVTK" <> 0

              THEN

                  "GVTK"
                  *
                  ABS(
                      "QUANTITY"
                  )

              ELSE 0

          END
      - name: T3_FB50
        expression: |-
          CASE
          WHEN "ITEMTYPE" = 'Discount'
              THEN 0
              WHEN (
                      "GVMT" IS NULL
                   OR "GVMT" = 0
                   )

               AND (
                      "GVTK" IS NULL
                   OR "GVTK" = 0
                   )

              THEN

                   "Doanh thu thực tế"  / 2

              ELSE 0

          END
      - name: Unit Cost
        expression: "CASE\nWHEN \"ITEMTYPE\" = 'Discount'\n    THEN 0\n\n    WHEN \"GVMT\" IS NOT NULL\n     AND \"GVMT\"\
          \ <> 0\n\n    THEN\n\n        \"GVMT\"\n     \n\n    WHEN \"GVTK\" IS NOT NULL\n     AND \"GVTK\" <> 0\n\n    THEN\n\
          \n        \"GVTK\"\n        \n   \n    ELSE\n\n        ( \"Doanh thu thực tế\"  / 2) /  ABS(\n            \"QUANTITY\"\
          \n        )\n\n\nEND"
      - name: a25_CP dự phòng (trả hàng, thanh lý, hủy...)
        expression: '"Doanh thu thực tế" *0.015'
    - step: GroupBy_1
      type: GroupBy
      label: Aggregate 1
      group_by:
      - POSTINGPERIOD
      - PERIODNAME
      - Month_No
      - TRANDATE
      - Tên Đơn vị
      - SUBSIDIARY
      - Tên Ngành
      - Tên Chuỗi
      - Nhóm Kênh
      - Tên Kênh
      - ID Kênh
      - Nhóm xanh đỏ
      - Quy hoạch SP
      - Nhóm SP
      - Vụ việc
      - Model name
      - ITEM
      - LINE ID
      - TRANSACTION
      - TYPE
      - ACCTTYPE
      - ID XD
      - CUSTOMER
      - ID Chuỗi
      - ID MODEL
      - ID CLASS
      - ID NHOMXANHDO
      - ID Nhóm kênh
      - CUSTCOL_SCV_LINE_ISFREEGIFT
      - PARENT_NAME
      - CUSTBODY_SCV_TRANS_SCT_FAST
      - Item Name
      - ITEMTYPE
      aggregations:
      - Giá Vốn = sum(Giá Vốn)
      - T1_GVMT = sum(T1_GVMT)
      - T2_GVTK = sum(T2_GVTK)
      - T3_FB50 = sum(T3_FB50)
      - Unit Cost = sum(Unit Cost)
      - Doanh số thực tế = sum(Doanh số thực tế)
      - Doanh thu ngành khác = sum(Doanh thu ngành khác)
      - Doanh thu thực tế = sum(Doanh thu thực tế)
