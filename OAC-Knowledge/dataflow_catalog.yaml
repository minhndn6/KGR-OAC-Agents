      - a6_CP nhân viên KD = sum(a6_CP nhân viên KD)
      - a7_CP roadshow hội nghị = sum(a7_CP roadshow hội nghị)
      - a8_CP công tác, tiếp khách KD = sum(a8_CP công tác, tiếp khách KD)
