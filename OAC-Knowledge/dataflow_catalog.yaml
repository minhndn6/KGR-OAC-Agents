  (KGR) DF_ACTUAL_AOP_EXPENSE:
    description: Ghép bảng so sánh thực tế–kế hoạch với bảng chi phí thực, tạo báo cáo thực tế so với kế hoạch kèm chi phí
      thực ghi sổ, chi tiết theo kỳ, pháp nhân, ngành, chuỗi.
    dataflow_id: '''d216fd48-fd32-42d9-ab97-fc2e2e9b4614''.''(KGR) DF_ACTUAL_AOP_EXPENSE'''
    name: (KGR) DF_ACTUAL_AOP_EXPENSE
    object_path: /@default/{dataflows}'d216fd48-fd32-42d9-ab97-fc2e2e9b4614'.'(KGR) DF_ACTUAL_AOP_EXPENSE'
    last_modified: '2026-06-22'
    version:
    input_datasets:
    - (KGR) DTF_GRAIN_ACTUAL_AOP
    - (KGR) DTF_FACT_EXPENSE
    output_datasets:
    - (KGR) DTF_ACTUAL_AOP_EXPENSE
    in_closure: false
    n_steps: 15
    steps:
    - step: InputDataset_0
      type: InputDataset
      label: (KGR) DTF_GRAIN_ACTUAL_AOP
      input_dataset: (KGR) DTF_GRAIN_ACTUAL_AOP
      dataset_type: db
    - step: InputDataset_1
      type: InputDataset
      label: (KGR) DTF_FACT_EXPENSE
      input_dataset: (KGR) DTF_FACT_EXPENSE
      dataset_type: db
    - step: Join_0
      type: Join
      label: Join
      join_type: fullouterjoin
      left: InputDataset_0
      right: InputDataset_1
      'on':
      - Posting Period = POSTINGPERIOD
      - Subsidiary Id = Sub Id
      - ID CLASS = ID CLASS
      - ID Sales Channel = ID Kênh
      - ID Chain = ID Chuỗi
      condition: and
    - step: AddColumns_0
      type: AddColumns
      label: Add Final Grain
      adds:
      - name: Posting_Period
        expression: IFNULL("Posting Period", "POSTINGPERIOD")
      - name: Sub_Id
        expression: IFNULL("Subsidiary Id", "Sub Id")
      - name: Class Id
        expression: IFNULL("ID CLASS", "ID CLASS_1")
      - name: SC id
        expression: IFNULL("ID Sales Channel", "ID Kênh")
      - name: Chain Id
        expression: IFNULL("ID Chain", "ID Chuỗi")
    - step: SelectColumns_0
      type: SelectColumns
      label: Select Columns
      selected_columns:
      - Posting_Period
      - Sub_Id
      - Class Id
      - SC id
      - Chain Id
      - Doanh số thực tế
      - Doanh thu thực tế
      - Doanh số quy đổi
      - Doanh số lũy kế
      - Giá Vốn
      - LN Gộp
      - Doanh số (AOP) TĐ
      - LN Giao (AOP) TĐ
      - Doanh số (AOP) Ngành
      - LN Giao (AOP) Ngành
      - Doanh số (AOP) Kênh
      - LN Giao (AOP) Kênh
      - Doanh số (AOP) Chuỗi
      - LN Giao (AOP) Chuỗi
      - DS T1
      - DS T2
      - DS T3
      - DS T4
      - DS T5
      - DS T6
      - DS T7
      - DS T8
      - DS T9
      - DS T10
      - DS T11
      - DS T12
      - a5_CP chiết khấu khuyến mại
      - a6_CP nhân viên KD
      - a7_CP roadshow hội nghị
      - a8_CP công tác, tiếp khách KD
      - a10_CP xúc tiến bán hàng
      - a12_CP nhân viên BO
      - a15_+ CP vận chuyển
      - a16_+ CP bảo hành
      - a17_+ CP tài chính
      - a18_+ CP khác
      - Doanh thu ngành khác
    - step: OutputDataset_0
      type: OutputDataset
      label: Save Data
      output_dataset: (KGR) DTF_ACTUAL_AOP_EXPENSE
      save_type: conn
      output_type: Create
      output_columns:
      - Posting_Period
      - Sub_Id
      - Class Id
      - SC id
      - Chain Id
      - Doanh số thực tế
      - Doanh thu thực tế
      - Doanh số quy đổi
      - Doanh số lũy kế
      - Giá Vốn
      - LN Gộp
      - Doanh số (AOP) TĐ
      - LN Giao (AOP) TĐ
      - Doanh số (AOP) Ngành
      - LN Giao (AOP) Ngành
      - Doanh số (AOP) Kênh
      - LN Giao (AOP) Kênh
      - Doanh số (AOP) Chuỗi
      - LN Giao (AOP) Chuỗi
      - DS T1
