        expression: Case When "Transaction Type"  like 'Invoice' then "Doanh thu thực tế" Else 0 End
      - name: Thuế
        expression: Case When "Transaction Type"  like 'Invoice' then - "TAX AMT" Else 0 End
      - name: Chiết khấu
        expression: Case When "Transaction Type"  like 'Invoice'then Ifnull("CP CKKM",0) Else 0 End
      - name: Tiền vốn
        expression: Case When "Transaction Type"  like 'Invoice' then "Giá Vốn" Else 0 End
    - step: AddColumns_11
      type: AddColumns
      label: Credit Memo Column
      adds:
      - name: SL trả lại
        expression: Case When "Transaction Type"  like 'Credit Memo' then "QUANTITY" Else 0 End
      - name: Giá trả lại TB
        expression: Case When "Transaction Type"  like 'Credit Memo' then -"Đơn Giá (-VAT)" Else 0 End
      - name: Doanh thu trả lại
        expression: Case When "Transaction Type"  like 'Credit Memo' then -"Doanh thu thực tế" Else 0 End
      - name: Thuế trả lại
        expression: Case When "Transaction Type"  like 'Credit Memo' then "TAX AMT" Else 0 End
      - name: Chiết khấu trả lại
        expression: Case When "Transaction Type"  like 'Credit Memo' then -Ifnull("CP CKKM",0) Else 0 End
      - name: Tiền vốn tl
        expression: Case When "Transaction Type"  like 'Credit Memo' then "Giá Vốn" Else 0 End
    - step: AddColumns_12
      type: AddColumns
      label: Thực bán
      adds:
      - name: Thực bán
        expression: (Ifnull("Doanh thu xuất bán",0) - Ifnull("Chiết khấu",0))-(Ifnull("Doanh thu trả lại",0) - Ifnull("Chiết
          khấu trả lại",0))
    - step: AddColumns_13
      type: AddColumns
      label: Tiền vốn thực tế, lãi
      adds:
      - name: Lãi
        expression: Ifnull("Thực bán",0) - (Ifnull("Tiền vốn",0) - Ifnull("Tiền vốn tl",0))
      - name: Tiền vốn thực tế
        expression: Ifnull("Tiền vốn",0) - Ifnull("Tiền vốn tl",0)
    - step: AddColumns_14
      type: AddColumns
      label: '%TB/DT, %GV/DT'
      adds:
      - name: '%TB/DT'
        expression: Case when "Thực bán" > 0 then "Thực bán"/"Doanh thu xuất bán" Else 0 End
      - name: '%GV/DT'
        expression: Case when "Tiền vốn" > 0 then "Tiền vốn"/"Doanh thu xuất bán" Else 0 End
    - step: SplitColumn_0
      type: AddColumns
      label: Split Columns
      adds:
      - name: Mã tỉnh
        expression: CASE WHEN POSITION('_' IN "Địa chỉ") > 0 THEN       CASE WHEN POSITION('_' IN "Địa chỉ") = 1 THEN ''      ELSE
          SUBSTRING("Địa chỉ",1, POSITION('_' IN "Địa chỉ")-1) END   ELSE "Địa chỉ" END
      - name: Địa chỉ KH
        expression: CASE WHEN POSITION('_' IN "Địa chỉ") > 0 THEN  SUBSTRING("Địa chỉ", POSITION('_' IN "Địa chỉ")+1, LENGTH("Địa
          chỉ")) ELSE '' END
    - step: SplitColumn_1
      type: AddColumns
      label: Split Columns 1
      adds:
      - name: Mã KH
        expression: CASE WHEN POSITION(' ' IN "ALTNAME") > 0 THEN       CASE WHEN POSITION(' ' IN "ALTNAME") = 1 THEN ''      ELSE
          SUBSTRING("ALTNAME",1, POSITION(' ' IN "ALTNAME")-1) END   ELSE "ALTNAME" END
      - name: new_name2
        expression: CASE WHEN POSITION(' ' IN "ALTNAME") > 0 THEN  SUBSTRING("ALTNAME", POSITION(' ' IN "ALTNAME")+1, LENGTH("ALTNAME"))
          ELSE '' END
    - step: SplitColumn_2
      type: AddColumns
      label: Split Columns 2
      adds:
      - name: Mã KH
        expression: CASE WHEN POSITION(' ' IN "ALTNAME") > 0 THEN       CASE WHEN POSITION(' ' IN "ALTNAME") = 1 THEN ''      ELSE
          SUBSTRING("ALTNAME",1, POSITION(' ' IN "ALTNAME")-1) END   ELSE "ALTNAME" END
      - name: new_name2
        expression: CASE WHEN POSITION(' ' IN "ALTNAME") > 0 THEN  SUBSTRING("ALTNAME", POSITION(' ' IN "ALTNAME")+1, LENGTH("ALTNAME"))
          ELSE '' END
    - step: GroupBy_0
      type: GroupBy
      label: Aggregate
      group_by:
      - Chuỗi
      - Model
      - NAME
      - CUSTRECORD_SCV_PRO_DIS_PERIOD
      aggregations:
      - CKKM = avg(CKKM)
    - step: Filter_8
      type: Filter
      label: Filter 8
      filters:
      - (1 = 1)
    - step: InputDataset_5
      type: InputDataset
      label: (KGR) Invoice_Line+Header+Pro
      input_dataset: (KGR) Invoice_Line+Header+Pro
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_CAM_CUSTINVCTRANSACTIONLINEEXTENSION:
        - TRANSACTION
        - ID
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_SG_PRO:
        - Vụ việc
    - step: Join_0
      type: Join
      label: Join
      join_type: leftouterjoin
      left: InputDataset_0
      right: InputDataset_5
      'on':
      - ID = ID
      - TRANSACTION = TRANSACTION
      condition: and
    - step: AddColumns_16
      type: AddColumns
      label: Add Columns 16
      adds:
      - name: Is Công ty con Chi nhánh Memo
        expression: Case When "CSEG_SCV_SC" = 14 then 'T' when "CSEG_SCV_SC_1" = 14 then 'T' Else 'F' End
    - step: Filter_5
      type: Filter
      label: Filter 5
      filters:
      - '"Is Công ty con Chi nhánh Memo" IN(''F'') and ("Is Công ty con Chi nhánh Memo" IS NULL or "Is Công ty con Chi nhánh
        Memo" NOT IN(''T''))'
    - step: AddColumns_15
      type: AddColumns
      label: Add Columns 15
      adds:
      - name: Is Công ty con Chi nhánh Invoice
        expression: Case When "CSEG_SCV_SC" = 14 then 'T' Else 'F' End
    - step: Filter_2
      type: Filter
      label: Filter 2
      filters:
      - ("Is Công ty con Chi nhánh Invoice" IS NULL or "Is Công ty con Chi nhánh Invoice" NOT IN('T'))
    - step: AddColumns_17
      type: AddColumns
      label: Add Columns 17
      adds:
      - name: Month Key
        expression: YEAR("GVMT_LINE_START_DATE") * 100 + MONTH("GVMT_LINE_START_DATE")
  DF_TD_Report_PNL_Bridge_Nganh:
    description: Giống biểu đồ thác nước lãi lỗ Tập đoàn nhưng vẽ cho từng ngành, mỗi ngành cộng dồn riêng theo ngày chốt
      số.
    dataflow_id: '''b9af193b-0871-430d-aae5-bb90ecfaf792''.''DF_TD_Report_PNL_Bridge_Nganh'''
    name: DF_TD_Report_PNL_Bridge_Nganh
    object_path: /@default/{dataflows}'b9af193b-0871-430d-aae5-bb90ecfaf792'.'DF_TD_Report_PNL_Bridge_Nganh'
    last_modified: '2026-06-23'
    version:
    input_datasets:
    - Nganh_Report_Long_#
    output_datasets:
    - TD_Report_PNL_Bridge_Nganh
    in_closure: true
    n_steps: 18
    steps:
    - step: InputDataset_M
      type: InputDataset
      label: Nganh_Report_Long_#
      input_dataset: Nganh_Report_Long_#
      dataset_type: db
    - step: AddColumns_M
      type: AddColumns
      label: Map movements
      adds:
      - name: Bridge_Order
        expression: "CASE WHEN \"\uFEFFSort_Order\"=2 THEN 1 WHEN \"\uFEFFSort_Order\"=3 THEN 2 WHEN \"\uFEFFSort_Order\"\
          \ IN (5,6,7,8) THEN 4 WHEN \"\uFEFFSort_Order\"=10 THEN 6 WHEN \"\uFEFFSort_Order\"=12 THEN 8 WHEN \"\uFEFFSort_Order\"\
          =14 THEN 10 WHEN \"\uFEFFSort_Order\"=20 THEN 11 WHEN \"\uFEFFSort_Order\"=22 THEN 13 ELSE NULL END"
      - name: Bridge_Label
        expression: "CASE WHEN \"\uFEFFSort_Order\"=2 THEN 'Doanh thu' WHEN \"\uFEFFSort_Order\"=3 THEN 'Giá vốn' WHEN \"\uFEFF\
          Sort_Order\" IN (5,6,7,8) THEN 'CP bán hàng & quản lý KD' WHEN \"\uFEFFSort_Order\"=10 THEN 'CP xúc tiến bán hàng'\
          \ WHEN \"\uFEFFSort_Order\"=12 THEN 'CP nhân viên BO' WHEN \"\uFEFFSort_Order\"=14 THEN 'CP quản lý vận hành' WHEN\
          \ \"\uFEFFSort_Order\"=20 THEN 'Thu nhập khác' WHEN \"\uFEFFSort_Order\"=22 THEN 'CP dự phòng hoạt động năm trước'\
          \ ELSE NULL END"
      - name: Direction
        expression: "CASE WHEN \"\uFEFFSort_Order\"=2 THEN 'Start' WHEN \"\uFEFFSort_Order\"=20 THEN 'Increase' WHEN \"\uFEFF\
          Sort_Order\" IN (3,5,6,7,8,10,12,14,22) THEN 'Decrease' ELSE NULL END"
      - name: Step_Value
        expression: "CASE WHEN \"\uFEFFSort_Order\" IN (2,20) THEN \"Actual_Amount\" WHEN \"\uFEFFSort_Order\" IN (3,5,6,7,8,10,12,14,22)\
          \ THEN 0 - \"Actual_Amount\" ELSE 0 END"
      - name: Tên Ngành
        expression: CASE WHEN "ID CLASS"=1 THEN 'Water care' WHEN "ID CLASS"=2 THEN 'Home care' WHEN "ID CLASS"=3 THEN 'Cold
          & Hygen care' WHEN "ID CLASS"=4 THEN 'Sanitary care' WHEN "ID CLASS"=5 THEN 'Khác' ELSE '~No Value~' END
    - step: Filter_M
      type: Filter
      label: Filter movements
      filters:
      - "\"\uFEFFSort_Order\" IN (2,3,5,6,7,8,10,12,14,20,22)"
    - step: GroupBy_M
      type: GroupBy
      label: Aggregate movements
      group_by:
      - AsOfDate
      - ID CLASS
      - Tên Ngành
      - Bridge_Order
      - Bridge_Label
      - Direction
      aggregations:
      - Step_Value = sum(Step_Value)
    - step: CumulativeAggregate_M
      type: AddColumns
      label: Cumulative cum_after
      adds:
      - name: cum_after
        expression: RSUM("Step_Value" BY "AsOfDate","ID CLASS")
    - step: AddColumns_M2
      type: AddColumns
      label: cum_before & Magnitude (M)
      adds:
      - name: cum_before
        expression: IFNULL("cum_after",0) - IFNULL("Step_Value",0)
      - name: Magnitude
        expression: Abs("Step_Value")
    - step: InputDataset_A
      type: InputDataset
      label: Nganh_Report_Long_#
      input_dataset: Nganh_Report_Long_#
      dataset_type: db
    - step: AddColumns_A
      type: AddColumns
      label: Map anchors
      adds:
      - name: Bridge_Order
        expression: "CASE WHEN \"\uFEFFSort_Order\"=4 THEN 3 WHEN \"\uFEFFSort_Order\"=9 THEN 5 WHEN \"\uFEFFSort_Order\"\
          =11 THEN 7 WHEN \"\uFEFFSort_Order\"=13 THEN 9 WHEN \"\uFEFFSort_Order\"=21 THEN 12 WHEN \"\uFEFFSort_Order\"=23\
          \ THEN 14 ELSE NULL END"
      - name: Bridge_Label
        expression: "CASE WHEN \"\uFEFFSort_Order\"=4 THEN 'Lợi nhuận gộp' WHEN \"\uFEFFSort_Order\"=9 THEN 'Lợi nhuận gộp\
          \ Kinh doanh' WHEN \"\uFEFFSort_Order\"=11 THEN 'Lợi nhuận xúc tiến bán hàng' WHEN \"\uFEFFSort_Order\"=13 THEN\
          \ 'Lợi nhuận nhân viên' WHEN \"\uFEFFSort_Order\"=21 THEN 'Lợi nhuận quản lý vận hành' WHEN \"\uFEFFSort_Order\"\
          =23 THEN 'Lợi nhuận trước thuế' ELSE NULL END"
      - name: Direction
        expression: '''Subtotal'''
      - name: Step_Value
        expression: '"Actual_Amount"'
      - name: Tên Ngành
        expression: CASE WHEN "ID CLASS"=1 THEN 'Water care' WHEN "ID CLASS"=2 THEN 'Home care' WHEN "ID CLASS"=3 THEN 'Cold
          & Hygen care' WHEN "ID CLASS"=4 THEN 'Sanitary care' WHEN "ID CLASS"=5 THEN 'Khác' ELSE '~No Value~' END
    - step: Filter_A
      type: Filter
      label: Filter anchors
      filters:
      - "\"\uFEFFSort_Order\" IN (4,9,11,13,21,23)"
    - step: GroupBy_A
      type: GroupBy
      label: Aggregate anchors
      group_by:
      - AsOfDate
      - ID CLASS
      - Tên Ngành
      - Bridge_Order
      - Bridge_Label
      - Direction
      aggregations:
      - Step_Value = sum(Step_Value)
    - step: AddColumns_A2
      type: AddColumns
      label: cum_before/after & Magnitude (A)
      adds:
      - name: cum_before
        expression: '0'
      - name: cum_after
        expression: IFNULL("Step_Value",0)
      - name: Magnitude
        expression: Abs("Step_Value")
    - step: Concatenate_0
      type: Concatenate
      label: Union Rows
      union_type: union all
      left: AddColumns_M2
      right: AddColumns_A2
      match:
    - step: OutputDataset_0
      type: OutputDataset
      label: Save Data
      output_dataset: TD_Report_PNL_Bridge_Nganh
      save_type: obi
      output_type: Create
      dataset_description: 'Per-NGÀNH P&L bridge: 14 rows/snapshot per ngành (8 movements + 6 subtotal anchors), running total
        restart per (AsOfDate, ID CLASS). Columns: AsOfDate, ID CLASS, Tên Ngành, Bridge_Order, Bridge_Label, Direction, Step_Value,
        Magnitude, cum_before, cum_after.'
      output_columns:
      - AsOfDate
      - ID CLASS
      - Tên Ngành
      - Bridge_Order
      - Bridge_Label
      - Direction
      - Step_Value
      - Magnitude
      - cum_before
      - cum_after
      - AOP_LNTT
    - step: InputDataset_AOP
      type: InputDataset
      label: Nganh_Report_Long_# (AOP)
      input_dataset: Nganh_Report_Long_#
      dataset_type: db
    - step: Filter_AOP
      type: Filter
      label: Filter LNTT plan
      filters:
      - "\"\uFEFFSort_Order\" = 23"
    - step: GroupBy_AOP
      type: GroupBy
      label: Aggregate AOP LNTT
      group_by:
      - AsOfDate
      - ID CLASS
      aggregations:
      - AOP_LNTT = sum(AOP_Amount)
    - step: Join_AOP
      type: Join
      label: Join AOP_LNTT
      join_type: leftouterjoin
      left: Concatenate_0
      right: GroupBy_AOP
      'on':
      - AsOfDate = AsOfDate
      - ID CLASS = ID CLASS
      condition: and
    - step: Select_AOP
      type: SelectColumns
      label: Keep cols + AOP_LNTT
      selected_columns:
      - AsOfDate
      - ID CLASS
      - Tên Ngành
      - Bridge_Order
      - Bridge_Label
      - Direction
      - Step_Value
      - Magnitude
      - cum_before
      - cum_after
      - AOP_LNTT
