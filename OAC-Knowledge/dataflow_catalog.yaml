        expression: "Case when \"ID Kênh Customer\" = 14 then 'F' \nWhen \"ID Kênh\" = 14 then 'F' else 'T' end"
    - step: RenameColumns_4
      type: RenameColumns
      label: Rename Columns 4
      renames:
