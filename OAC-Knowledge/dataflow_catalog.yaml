  KGR_DF_Daily_Nganh_Report:
    description: 'Báo cáo ngày theo từng ngành (bản trước của KGR_DF_Daily_Nganh_Report_m), cùng cách dựng: ghép bảng lãi
      lỗ ngành với kế hoạch AOP theo ngày và tỷ trọng sản phẩm mới.'
    dataflow_id: '''minhndn@bizin.vn''.''KGR_DF_Daily_Nganh_Report'''
    name: KGR_DF_Daily_Nganh_Report
    object_path: /@default/{dataflows}'minhndn@bizin.vn'.'KGR_DF_Daily_Nganh_Report'
    last_modified: '2026-06-22'
    version:
    input_datasets:
    - Nganh_Report_Long_#
    - AOP LINE CF
    - SPmoi_ng_v3
    output_datasets:
    - Daily_Nganh_Report
    in_closure: true
    n_steps: 14
    steps:
    - step: InputDataset_0
      type: InputDataset
      label: Nganh_Report_Long_#
      input_dataset: Nganh_Report_Long_#
      dataset_type: db
    - step: AddColumns_0
      type: AddColumns
      label: Add Columns
      adds:
      - name: DS_AOP
        expression: CASE WHEN Metric_Code = 1 THEN AOP_Amount END
      - name: DS_TT
        expression: CASE WHEN Metric_Code = 1 THEN Actual_Amount END
      - name: CKKM_AOP
        expression: CASE WHEN Metric_Code = 5 THEN AOP_Amount END
      - name: CKKM_TT
        expression: CASE WHEN Metric_Code = 5 THEN Actual_Amount END
      - name: LNGiao
        expression: CASE WHEN Metric_Code = 23 THEN AOP_Amount END
      - name: LNST
        expression: CASE WHEN Metric_Code = 23 THEN Actual_Amount END
      - name: LNGop
        expression: CASE WHEN Metric_Code = 4 THEN Actual_Amount END
      - name: TyLeXD
        expression: CASE WHEN Metric_Code = 24 THEN Actual_Amount END
    - step: RenameColumns_0
      type: RenameColumns
      label: Rename Columns
      renames:
      - ID CLASS -> IDCLASS
    - step: AddColumns_1
      type: AddColumns
      label: Add Columns 1
      adds:
      - name: TenNganh
        expression: CASE WHEN IDCLASS = 1 THEN 'Water care' WHEN IDCLASS = 2 THEN 'Home care' WHEN IDCLASS = 3 THEN 'Cold
          & Hygen care' WHEN IDCLASS = 4 THEN 'Sanitary care' ELSE 'Khac' END
    - step: GroupBy_1
      type: GroupBy
      label: Aggregate 1
      group_by:
      - PERIODNAME
      - AsOfDate
      - TenNganh
      aggregations:
      - Metric_Code Sum = sum(Metric_Code)
      - "\uFEFFSort_Order Sum = sum(\uFEFFSort_Order)"
      - Actual_Amount Sum = sum(Actual_Amount)
      - DT_grain Sum = sum(DT_grain)
      - AOP_Amount Sum = sum(AOP_Amount)
      - IDCLASS Maximum = max(IDCLASS)
      - DS_AOP Sum = sum(DS_AOP)
      - DS_TT Sum = sum(DS_TT)
      - CKKM_AOP Sum = sum(CKKM_AOP)
      - CKKM_TT Sum = sum(CKKM_TT)
      - LNGiao Sum = sum(LNGiao)
      - LNST Sum = sum(LNST)
      - LNGop Sum = sum(LNGop)
      - TyLeXD Sum = sum(TyLeXD)
    - step: RenameColumns_1
      type: RenameColumns
      label: Rename Columns 1
      renames:
      - DS_AOP Sum -> DS_AOP
      - DS_TT Sum -> DS_TT
      - CKKM_AOP Sum -> CKKM_AOP
      - CKKM_TT Sum -> CKKM_TT
      - LNGiao Sum -> LNGiao
      - LNST Sum -> LNST
      - LNGop Sum -> LNGop
      - TyLeXD Sum -> TyLeXD
    - step: AddColumns_2
      type: AddColumns
      label: Add Columns 2
      adds:
      - name: DS_ConPhaiThucHien
        expression: '"CUSTCOL_SCV_AOP_DOANH_SO Sum" - "DS_TT"'
      - name: CKKM_ConDuocSuDung
        expression: '"CUSTCOL_SCV_AOP_CP_CKKM Sum" - "CKKM_TT"'
      - name: LN_ConPhaiThucHien
        expression: ' "CUSTCOL_SCV_AOP_LN_GIAO Sum" - "LNGop"'
      - name: PhanTram_CKKM_AOP
        expression: ' "CUSTCOL_SCV_AOP_CKKM Average"'
      - name: PhanTram_LoiNhuan_AOP
        expression: CASE WHEN TenNganh = 'Cold & Hygen care' THEN 0.012 WHEN TenNganh = 'Home care' THEN 0.021 WHEN TenNganh
          = 'Sanitary care' THEN 0.014 WHEN TenNganh = 'Water care' THEN 0.030 ELSE 0 END
      - name: TyTrong_SP_Moi
        expression: CASE WHEN TenNganh = 'Cold & Hygen care' THEN 0.0734 WHEN TenNganh = 'Home care' THEN 0.2884 WHEN TenNganh
          = 'Sanitary care' THEN 0.0 WHEN TenNganh = 'Water care' THEN 0.0472 ELSE 0 END
      - name: TyTrong_SP_Moi_dyn
        expression: '"DT_SPmoi_ng" / "DT_ng"'
    - step: OutputDataset_0
      type: OutputDataset
      label: Save Data
      output_dataset: Daily_Nganh_Report
      save_type: obi
      output_type: Create
      output_columns:
      - PERIODNAME
      - AsOfDate
      - TenNganh
      - Metric_Code Sum
      - "\uFEFFSort_Order Sum"
      - Actual_Amount Sum
      - DT_grain Sum
      - AOP_Amount Sum
      - IDCLASS Maximum
      - DS_AOP
      - DS_TT
      - CKKM_AOP
      - CKKM_TT
      - LNGiao
      - LNST
      - LNGop
      - TyLeXD
      - PERIODNAME_1
      - CLASS
      - CUSTCOL_SCV_AOP_DOANH_SO Sum
      - NETAMOUNT Sum
      - CUSTCOL_SCV_AOP_CP_CKKM Sum
      - CUSTCOL_SCV_AOP_LN_GIAO Sum
      - CUSTCOL_SCV_AOP_CKKM Average
      - CUSTCOL_SCV_AOP_LOI_NHUAN Sum
      - DS_ConPhaiThucHien
      - CKKM_ConDuocSuDung
      - LN_ConPhaiThucHien
      - PhanTram_CKKM_AOP
      - PhanTram_LoiNhuan_AOP
      - TyTrong_SP_Moi
    - step: InputDataset_2
      type: InputDataset
      label: (KGR) AOP_UPDATE
      input_dataset: AOP LINE CF
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_AOP_HEADER_CF:
        - CUSTBODY_SCV_AOP_LOAI_BAO_CAO
        DW_NS_X_AOP_LINE_SF:
        - CLASS
        - NETAMOUNT
        DW_NS_ACCOUNTINGPERIOD_D:
        - PERIODNAME
        DW_NS_X_AOP_HEADER_SF:
        - POSTINGPERIOD
        DW_NS_X_AOP_LINE_CF:
        - CUSTCOL_SCV_AOP_DOANH_SO
        - CUSTCOL_SCV_AOP_CP_CKKM
        - CUSTCOL_SCV_AOP_LN_GIAO
        - CUSTCOL_SCV_AOP_CKKM
        - CUSTCOL_SCV_AOP_LOI_NHUAN
    - step: Filter_0
      type: Filter
      label: Filter
      filters:
      - '"CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 4 and 4'
    - step: GroupBy_0
      type: GroupBy
      label: Aggregate
      group_by:
      - PERIODNAME
      - CLASS
      aggregations:
      - CUSTCOL_SCV_AOP_DOANH_SO Sum = sum(CUSTCOL_SCV_AOP_DOANH_SO)
      - NETAMOUNT Sum = sum(NETAMOUNT)
      - CUSTCOL_SCV_AOP_CP_CKKM Sum = sum(CUSTCOL_SCV_AOP_CP_CKKM)
      - CUSTCOL_SCV_AOP_LN_GIAO Sum = sum(CUSTCOL_SCV_AOP_LN_GIAO)
      - CUSTCOL_SCV_AOP_CKKM Average = avg(CUSTCOL_SCV_AOP_CKKM)
      - CUSTCOL_SCV_AOP_LOI_NHUAN Sum = sum(CUSTCOL_SCV_AOP_LOI_NHUAN)
    - step: Join_1
      type: Join
      label: Join 1
      join_type: innerjoin
      left: RenameColumns_1
      right: GroupBy_0
      'on':
      - PERIODNAME = PERIODNAME
      - IDCLASS Maximum = CLASS
      condition: and
    - step: InputDataset_1
      type: InputDataset
      label: SPmoi_ng_v3
      input_dataset: SPmoi_ng_v3
      dataset_type: parquet
    - step: Join_0
      type: Join
      label: Join
      join_type: innerjoin
      left: Join_1
      right: InputDataset_1
      'on':
      - PERIODNAME = PERIODNAME
      - AsOfDate = AsOfDate
      - IDCLASS Maximum = ID CLASS
      condition: and
  DF_TD_Report_PNL_v2:
    description: Chuyển bảng lãi lỗ Tập đoàn sang dạng dài (mỗi dòng một bước, có dấu cộng/trừ, thứ tự bước và cột cộng dồn
      đầu/cuối) để vẽ biểu đồ.
    dataflow_id: '''e2a77749-2452-4dda-a813-6f9c81455ceb''.''DF_TD_Report_PNL_v2'''
    name: DF_TD_Report_PNL_v2
    object_path: /@default/{dataflows}'e2a77749-2452-4dda-a813-6f9c81455ceb'.'DF_TD_Report_PNL_v2'
    last_modified: '2026-06-22'
    version:
    input_datasets:
    - TD_Report_Long
    output_datasets:
    - TD_Report_PNL_v2
    in_closure: false
    n_steps: 5
    steps:
    - step: InputDataset_0
      type: InputDataset
      label: TD_Report_Long
      input_dataset: TD_Report_Long
      dataset_type: db
    - step: AddColumns_0
      type: AddColumns
      label: Add Columns
      adds:
      - name: Signed_Amount
        expression: "CASE WHEN \"\uFEFFSort_Order\" IN (2, 20) THEN \"Actual_Amount\" WHEN \"\uFEFFSort_Order\" IN (3, 5,\
          \ 6, 7, 8, 10, 12, 15, 16, 17, 18, 19, 22) THEN 0 - \"Actual_Amount\" ELSE 0 END"
      - name: PL_Step
        expression: "CASE WHEN \"\uFEFFSort_Order\"=2 THEN '01. ' WHEN \"\uFEFFSort_Order\"=3 THEN '02. ' WHEN \"\uFEFFSort_Order\"\
          =5 THEN '03. ' WHEN \"\uFEFFSort_Order\"=6 THEN '04. ' WHEN \"\uFEFFSort_Order\"=7 THEN '05. ' WHEN \"\uFEFFSort_Order\"\
          =8 THEN '06. ' WHEN \"\uFEFFSort_Order\"=10 THEN '07. ' WHEN \"\uFEFFSort_Order\"=12 THEN '08. ' WHEN \"\uFEFFSort_Order\"\
          =15 THEN '09. ' WHEN \"\uFEFFSort_Order\"=16 THEN '10. ' WHEN \"\uFEFFSort_Order\"=17 THEN '11. ' WHEN \"\uFEFF\
          Sort_Order\"=18 THEN '12. ' WHEN \"\uFEFFSort_Order\"=19 THEN '13. ' WHEN \"\uFEFFSort_Order\"=20 THEN '14. ' WHEN\
          \ \"\uFEFFSort_Order\"=22 THEN '15. ' ELSE NULL END || \"Metric_Name\""
    - step: CumulativeAggregate_0
      type: AddColumns
      label: Cumulative Value
      adds:
      - name: cum_after
        expression: RSUM("Signed_Amount" BY "AsOfDate")
    - step: AddColumns_1
      type: AddColumns
      label: cum_before
      adds:
      - name: cum_before
        expression: IFNULL("cum_after",0) - IFNULL("Signed_Amount",0)
    - step: OutputDataset_0
      type: OutputDataset
      label: Save Data
      output_dataset: TD_Report_PNL_v2
      save_type: obi
      output_type: Create
      dataset_description: P&L long-format with Signed_Amount, PL_Step, cum_after, cum_before (running P&L for waterfall)
      output_columns:
      - PERIODNAME
      - AsOfDate
      - Metric_Code
      - Metric_Name
      - "\uFEFFSort_Order"
      - Type
      - Actual_Amount
      - DT_grain
      - AOP_Amount
      - PERIODNAME_1
      - Chỉ tiêu (AOP)
      - AOP_Amount_1
      - AOP_Per
      - AOP_Amount_2
      - AOP_Per_24
      - Signed_Amount
      - PL_Step
      - cum_after
      - cum_before
