    - step: AddColumns_1
      type: AddColumns
      label: Giá vốn vs  a25_CP dự phòng (trả hàng,
      adds:
      - name: Giá Vốn
        expression: |-
          CASE

              WHEN
                  "CUSTCOL_SCV_LINE_ISFREEGIFT" = 'T'
                  AND
                  (
                      "Doanh thu thực tế" IS NULL
                      OR
                      "Doanh thu thực tế" = 0
                  )
              THEN 0

              WHEN "ITEMTYPE" = 'Discount'
              THEN 0

              ELSE

                  (
                      CASE
                          WHEN "TYPE" = 'CustCred'
                          THEN -1
                          ELSE 1
                      END
                  )

                  *

                  (

                      CASE

                          WHEN "GVMT" IS NOT NULL
                           AND "GVMT" <> 0
                          THEN
                              "GVMT"
                              *
                              ABS(
                                  "QUANTITY"
                              )

                          WHEN "GVTK" IS NOT NULL
                           AND "GVTK" <> 0
                          THEN
                              "GVTK"
                              *
                              ABS(
                                  "QUANTITY"
                              )

                          ELSE
                              ABS(
                                  "Doanh thu thực tế"
                              ) / 2

                      END

                  )

          END
      - name: T1_GVMT
        expression: |-
          CASE
          WHEN "ITEMTYPE" = 'Discount'
              THEN 0

              WHEN "GVMT" IS NOT NULL
               and "GVMT" <> 0

              THEN

                  "GVMT"
                  *
                  ABS(
                      "QUANTITY"
                  )

              ELSE 0

          END
      - name: T2_GVTK
        expression: |-
          CASE

              WHEN (
                      "GVMT" IS NULL
                   OR "GVMT" = 0
                   )

               AND "GVTK" IS NOT NULL
               AND "GVTK" <> 0

              THEN

                  "GVTK"
                  *
                  ABS(
                      "QUANTITY"
                  )

              ELSE 0

          END
      - name: T3_FB50
        expression: |-
          CASE
          WHEN "ITEMTYPE" = 'Discount'
              THEN 0
              WHEN (
                      "GVMT" IS NULL
                   OR "GVMT" = 0
                   )

               AND (
                      "GVTK" IS NULL
                   OR "GVTK" = 0
                   )

              THEN

                   "Doanh thu thực tế"  / 2

              ELSE 0

          END
      - name: Unit Cost
        expression: "CASE\nWHEN \"ITEMTYPE\" = 'Discount'\n    THEN 0\n\n    WHEN \"GVMT\" IS NOT NULL\n     AND \"GVMT\"\
          \ <> 0\n\n    THEN\n\n        \"GVMT\"\n     \n\n    WHEN \"GVTK\" IS NOT NULL\n     AND \"GVTK\" <> 0\n\n    THEN\n\
          \n        \"GVTK\"\n        \n   \n    ELSE\n\n        ( \"Doanh thu thực tế\"  / 2) /  ABS(\n            \"QUANTITY\"\
          \n        )\n\n\nEND"
      - name: a25_CP dự phòng (trả hàng, thanh lý, hủy...)
        expression: '"Doanh thu thực tế" *0.015'
