        DW_NS_X_CAM_CUSTOMLIST_SCV_PRODUCT_SOURCE:
        - Phân nhóm SP
        DW_NS_X_CAM_ITEMEXTENSION:
        - CSEG_SCV_MODEL
    - step: Filter_0
      type: Filter
      label: Filter
      filters:
      - '"ISPOSTING" IN(''T'') and "ACCTTYPE" IN(''Income'', ''OthCurrLiab'') and "ISPOSTING" IN(''T'')'
    - step: RenameColumns_3
      type: RenameColumns
      label: Rename Columns 3
      renames:
      - FULLNAME -> Ngành
      - NAME -> Model name
      - ID -> LINE ID
      - TAX1AMT -> TAX AMT
      - TAXRATE1 -> TAX RATE
      - CUSTENTITY_SCV_ENTITY_CODE_1 -> Mã NVBH
      - CUSTENTITY_SCV_EMP_ASM_CODE -> Mã NVBH
      - Vụ việc_1 -> Vụ việc
      - PARENT_NAME -> Mã Kho
      - CUSTENTITY_SCV_ENTITY_CODE -> Mã KH
      - CUSTENTITY_SCV_LEGAL_NAME -> Tên KH
      - ID_1 -> (bỏ)
      - CSEG_SCV_SC_1 -> ID Kênh
      - CSEG_SCV_CHAIN -> ID Chuỗi
      - CSEG_SCV_MODEL -> ID Model
    - step: AddColumns_1
      type: AddColumns
      label: Gvon
      adds:
      - name: Giá Vốn
        expression: |-
          CASE

              WHEN "GVMT" IS NOT NULL
               AND "GVMT" <> 0

              THEN

                  "GVMT"
                  *
                  ABS(
                      "QUANTITY"
                  )

              WHEN "GVTK" IS NOT NULL
               AND "GVTK" <> 0

              THEN

                  "GVTK"
                  *
                  ABS(
                      "QUANTITY"
                  )

              ELSE

                  "Doanh thu thực tế" / 2

          END
      - name: T1_GVMT
        expression: |-
          CASE

              WHEN "GVMT" IS NOT NULL
               AND "GVMT" <> 0

              THEN

                  "GVMT"
                  *
                  ABS(
                      "QUANTITY"
                  )

              ELSE 0

          END
      - name: T2_GVTK
        expression: |-
          CASE

              WHEN (
                      "GVMT" IS NULL
                   OR "GVMT" = 0
                   )

               AND "GVTK" IS NOT NULL
               AND "GVTK" <> 0

              THEN

                  "GVTK"
                  *
                  ABS(
                      "QUANTITY"
                  )

              ELSE 0

          END
      - name: T3_FB50
        expression: |-
          CASE

              WHEN (
                      "GVMT" IS NULL
                   OR "GVMT" = 0
                   )

               AND (
                      "GVTK" IS NULL
                   OR "GVTK" = 0
                   )

              THEN

                   "Doanh thu thực tế"  / 2

              ELSE 0

          END
      - name: Unit Cost
        expression: "CASE\n\n    WHEN \"GVMT\" IS NOT NULL\n     AND \"GVMT\" <> 0\n\n    THEN\n\n        \"GVMT\"\n     \n\
          \n    WHEN \"GVTK\" IS NOT NULL\n     AND \"GVTK\" <> 0\n\n    THEN\n\n        \"GVTK\"\n        \n   \n    ELSE\n\
          \n        ( \"Doanh thu thực tế\"  / 2) /  ABS(\n            \"QUANTITY\"\n        )\n\n\nEND"
    - step: GroupBy_1
      type: GroupBy
      label: Aggregate 1
      group_by:
      - POSTINGPERIOD
      - PERIODNAME
      - Month_No
      - TRANDATE
      - Tên Đơn vị
      - SUBSIDIARY
      - Tên Ngành
      - Tên Chuỗi
      - Nhóm Kênh
      - Tên Kênh
      - Quy hoạch SP
      - Nhóm SP
      - Vụ việc
      - ITEM
      - LINE ID
      - TRANSACTION
      - TYPE
      - ACCTTYPE
      - ID XD
      - Transaction Type
      - Sales Category
      - UPCCODE
      - Model name
      - MEMO
      - ACCTNUMBER
      - Đvt
      - Location Name
      - Địa chỉ
      - Tên Khách Hàng
      - Nhóm xanh đỏ
      - Mã KH
      - Item Name
      - Ngày bắt đầu
      - Ngày kết thúc
      - Mã CKKM
      - Tên CKKM
      - Mã NVBH
      - CUSTBODY_SCV_TRANS_SCT_FAST
      - Là hàng tặng
      - KH ký gửi
      - Tên KH
      - Mã Kho
      - Mã Đơn Vị
      - Phân nhóm SP
      - TKĐƯ
      - ID Chuỗi
      - ID Model
      - ID Kênh
      aggregations:
      - Giá Vốn = sum(Giá Vốn)
      - T1_GVMT = sum(T1_GVMT)
      - T2_GVTK = sum(T2_GVTK)
      - T3_FB50 = sum(T3_FB50)
      - Unit Cost = sum(Unit Cost)
      - Doanh số thực tế = sum(Doanh số thực tế)
      - QUANTITY = sum(QUANTITY)
      - TAX RATE = avg(TAX RATE)
      - CUSTCOL_SCV_DISCOUNT_AMOUNT_01 = sum(CUSTCOL_SCV_DISCOUNT_AMOUNT_01)
      - Doanh thu thực tế = sum(Doanh thu thực tế)
      - TAX AMT = sum(TAX AMT)
    - step: RenameColumns_0
      type: RenameColumns
      label: Rename Columns
      renames:
      - NAME -> Kênh name
      - NAME_1 -> Chuỗi name
    - step: AddColumns_2
      type: AddColumns
      label: LN Gộp, Doanh thu SP mới, Đơn giá
      adds:
      - name: LN Gộp
        expression: ' "Doanh thu thực tế"  - "Giá Vốn"'
      - name: Doanh thu SP mới
        expression: Case when "Quy hoạch SP" = 'SP mới' then "Doanh thu thực tế" else 0 end
      - name: Đơn Giá (-VAT)
        expression: '"Doanh thu thực tế"/"QUANTITY"'
      - name: Đơn giá (+VAT)
        expression: '"Doanh số thực tế"/"QUANTITY"'
    - step: Join_3
      type: Join
      label: Join 3
      join_type: rightouterjoin
      left: GroupBy_6
      right: SelectColumns_0
      'on':
      - GVMT_LINE_MSP = ITEM
      - Month Key = Month Key
      condition: and
    - step: Join_4
      type: Join
      label: Join 4
      join_type: leftouterjoin
      left: Join_3
      right: GroupBy_7
      'on':
      - ITEM = GVTK_ITEM_CODE_L
      - POSTINGPERIOD - 1 = GVTK_PERIOD_L
      - SUBSIDIARY = GVTK_SUBSIDIARY_L
      condition: and
    - step: OutputDataset_0
      type: OutputDataset
      label: Save Data
      output_dataset: (KGR) DTF_CALC_MIS
      save_type: obi
      output_type: Create
      dataset_description: |-
        Tính toán DSTT, DSTT VAT, COGS, của Invoice và Credit Memo
        Grain dến invoice line id
      output_columns:
      - POSTINGPERIOD
      - PERIODNAME
