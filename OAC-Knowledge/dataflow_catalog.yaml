  DF_Nganh_Report_Long_TD:
    description: Cộng số liệu các ngành thành dòng tổng toàn Tập đoàn (theo từng chỉ tiêu và từng ngày chốt số), bổ sung vào
      bảng lãi lỗ theo ngành.
    dataflow_id: '''ce6fc407-89cb-4e42-9c09-dba4972e8951''.''DF_Nganh_Report_Long_TD'''
    name: DF_Nganh_Report_Long_TD
    object_path: /@default/{dataflows}'ce6fc407-89cb-4e42-9c09-dba4972e8951'.'DF_Nganh_Report_Long_TD'
    last_modified: '2026-06-23'
    version:
    input_datasets:
    - Nganh_Report_Long_#
    output_datasets:
    - Nganh_Report_Long_TD
    in_closure: true
    n_steps: 7
    steps:
    - step: InputDataset_0
      type: InputDataset
      label: Nganh_Report_Long_#
      input_dataset: Nganh_Report_Long_#
      dataset_type: db
    - step: Select_Sectors
      type: SelectColumns
      label: Keep 5 cols (sectors)
      selected_columns:
      - Metric_Name
      - AsOfDate
      - Actual_Amount
      - AOP_Amount
      - ID CLASS
    - step: GroupBy_Group
      type: GroupBy
      label: SUM over sectors
      group_by:
      - Metric_Name
      - AsOfDate
      aggregations:
      - Actual_Amount = sum(Actual_Amount)
      - AOP_Amount = sum(AOP_Amount)
    - step: AddIDClass
      type: AddColumns
