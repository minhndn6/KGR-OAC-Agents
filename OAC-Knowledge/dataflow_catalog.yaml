    - step: InputDataset_4
      type: InputDataset
      label: (KGR) Tỷ lệ chi phí khác
      input_dataset: (KGR) Tỷ lệ chi phí khác
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_TY_LE_CP_KHAC:
        - CUSTRECORD_SCV_TY_LE_KHAC
        - CUSTRECORD_SCV_TY_LE_KHAC_CHUOI
        - CUSTRECORD_SCV_TY_LE_KHAC_KENH
        - CUSTRECORD_SCV_TY_LE_KHAC_PER
        - CUSTRECORD_SCV_TY_LE_KHAC_TU_NGAY
        - ID
        - ISINACTIVE
        - NAME
    - step: Join_3
      type: Join
      label: Join 3
      join_type: leftouterjoin
      left: Join_2
      right: InputDataset_3
      'on':
      - ID Kênh = CUSTRECORD_SCV_RSHN_KENH
      - ID Chain = CUSTRECORD_SCV_TY_LE_RSHN_CHAIN
      condition: and
    - step: Join_4
      type: Join
      label: Join 4
      join_type: leftouterjoin
      left: Join_3
      right: InputDataset_4
      'on':
      - ID Kênh = CUSTRECORD_SCV_TY_LE_KHAC_KENH
      - ID Chain = CUSTRECORD_SCV_TY_LE_KHAC_CHUOI
      condition: and
    - step: SelectColumns_1
      type: SelectColumns
      label: Select Columns 1
      selected_columns:
      - CALENDAR_DATE
      - POSTINGPERIOD
      - TRANDATE
      - Tên Đơn vị
      - SUBSIDIARY
      - Tên Ngành
      - Tên Chuỗi
      - Tên Kênh
      - Nhóm Kênh
      - Nhóm xanh đỏ
      - Quy hoạch SP
      - Nhóm SP
      - ITEM
      - TYPE
      - CUSTOMER
      - Doanh số thực tế
      - Doanh thu ngành khác
      - Doanh thu thực tế
      - CUSTRECORD_SCV_TY_LE_CHAIN
      - CUSTRECORD_SCV_TY_LE_KENH
      - CUSTRECORD_SCV_TY_LE_PER_LUONG
      - NAME
      - CUSTRECORD_SCV_RSHN_KENH
      - CUSTRECORD_SCV_RSHN_PER
      - CUSTRECORD_SCV_TY_LE_RSHN_CHAIN
      - NAME_1
      - CUSTRECORD_SCV_TY_LE_KHAC
      - CUSTRECORD_SCV_TY_LE_KHAC_CHUOI
      - CUSTRECORD_SCV_TY_LE_KHAC_KENH
      - CUSTRECORD_SCV_TY_LE_KHAC_PER
      - NAME_2
      - LN Gộp
      - VALID_FLAG_LUONG_NVKD
      - VALID_FLAG_KHAC_NVKD
      - VALID_FLAG_RSHN_NVKD
      - CP CKKM
    - step: AddColumns_0
      type: AddColumns
      label: Tính 3 chi phí
      adds:
      - name: Chi phí Lương
        expression: Case when "VALID_FLAG_LUONG_NVKD" = 'T' Then "Doanh thu thực tế" * "CUSTRECORD_SCV_TY_LE_PER_LUONG" Else
          0 End
      - name: Chi phí Roadshow HN
        expression: Case when "VALID_FLAG_RSHN_NVKD" = 'T' Then "Doanh thu thực tế" * "CUSTRECORD_SCV_RSHN_PER" Else 0 End
      - name: Chi phí Khác
        expression: Case when "VALID_FLAG_KHAC_NVKD" = 'T' Then "Doanh thu thực tế" * "CUSTRECORD_SCV_TY_LE_KHAC_PER" Else
          0 End
    - step: AddColumns_1
      type: AddColumns
      label: Tính LN gộp KD
      adds:
      - name: LN gộp KD
        expression: IFNULL("LN Gộp",0)-IFNUll("CP CKKM",0)-IFNULL("Chi phí Lương",0)-IFNULL("Chi phí Roadshow HN",0)-IFNULL("Chi
          phí Khác",0)
    - step: OutputDataset_0
      type: OutputDataset
      label: Save Data
      output_dataset: (KGR) DTF_DAILY_KENH_CHUOI
      save_type: conn
      output_type: Create
      dataset_description: Tính lợi nhuận bước 2 theo kênh chuỗi
      output_columns:
      - Tên Kênh
    - step: SelectColumns_2
      type: SelectColumns
      label: Select Columns 2
      selected_columns:
      - Tên Kênh
    - step: AddColumns_2
      type: AddColumns
      label: Add Columns 2
      adds:
      - name: VALID_FLAG_LUONG_NVKD
        expression: |-
          CASE WHEN
          "TRANDATE" >= "CUSTRECORD_SCV_TY_LE_TU_NGAY"
          AND
          "TRANDATE" <= "CUSTRECORD_SCV_TY_LE_DEN_NGAY"
          THEN 'T'
          ELSE 'F'
          END
      - name: VALID_FLAG_KHAC_NVKD
        expression: |-
          CASE WHEN
          "TRANDATE" >= "CUSTRECORD_SCV_TY_LE_KHAC_TU_NGAY"
          THEN 'T'
          ELSE 'F'
          END
      - name: VALID_FLAG_RSHN_NVKD
        expression: |-
          CASE WHEN
          "TRANDATE" >= "CUSTRECORD_SCV_TY_LE_RSHN_TU_NGAY"
          AND
          "TRANDATE" <= "CUSTRECORD_SCV_TY_LE_RSHN_DEN_NGAY"
          THEN 'T'
          ELSE 'F'
          END
    - step: SelectColumns_3
      type: SelectColumns
      label: Select Columns 3
      selected_columns:
      - Tên Kênh
      - Doanh thu thực tế
      - CUSTRECORD_SCV_TY_LE_PER_LUONG
      - CUSTRECORD_SCV_RSHN_PER
      - CUSTRECORD_SCV_TY_LE_KHAC_PER
      - LN Gộp
      - CP CKKM
      - Chi phí Lương
      - Chi phí Roadshow HN
      - Chi phí Khác
      - LN gộp KD
    - step: GroupBy_1
      type: GroupBy
      label: Aggregate 1
      group_by:
      - Tên Kênh
      aggregations:
      - Doanh thu thực tế Sum = sum(Doanh thu thực tế)
      - CUSTRECORD_SCV_TY_LE_PER_LUONG Average = avg(CUSTRECORD_SCV_TY_LE_PER_LUONG)
      - CUSTRECORD_SCV_RSHN_PER Average = avg(CUSTRECORD_SCV_RSHN_PER)
      - CUSTRECORD_SCV_TY_LE_KHAC_PER Average = avg(CUSTRECORD_SCV_TY_LE_KHAC_PER)
      - LN Gộp Sum = sum(LN Gộp)
      - CP CKKM Sum = sum(CP CKKM)
      - Chi phí Lương Sum = sum(Chi phí Lương)
      - Chi phí Roadshow HN Sum = sum(Chi phí Roadshow HN)
      - Chi phí Khác Sum = sum(Chi phí Khác)
      - LN gộp KD Sum = sum(LN gộp KD)
    - step: Filter_0
      type: Filter
      label: Filter
      filters:
      - '"CALENDAR_DATE" between timestamp ''2026-05-01T00:00:00'' and timestamp ''2026-05-31T00:00:00'' and "Tên Kênh" IN(''KA
        - Water care'')'
    - step: AddColumns_3
      type: AddColumns
      label: Add Columns 3
      adds:
      - name: ID Chain
        expression: Case When "ID Chuỗi" = 5 then Null Else "ID Chuỗi" End
