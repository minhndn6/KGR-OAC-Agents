        - CUSTCOL_SCV_TRANS_TEN_CKKM
        - Is HTL
        - CUSTCOL_SCV_LINE_ISFREEGIFT
        - CUSTCOL_SCV_DISCOUNT_AMOUNT_01
        - CSEG_SCV_SC
