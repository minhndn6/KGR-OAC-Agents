    - step: Filter_0
      type: Filter
      label: Filter PERIOD
      filters:
      - '"POSTINGPERIOD" between 42 and 42'
    - step: Filter_1
      type: Filter
      label: Filter
      filters:
      - '"ACCTTYPE" IN(''Income'')'
    - step: Branch_0
      type: Branch
      label: Branch
    - step: RenameColumns_0
      type: RenameColumns
      label: Rename Columns
      renames:
      - TRANDATE -> AsOfDate
    - step: SelectColumns_0
      type: SelectColumns
      label: Select Columns
      selected_columns:
      - AsOfDate
      - PERIODNAME
      - POSTINGPERIOD
      - ID CLASS
    - step: GroupBy_0
      type: GroupBy
      label: Distinct AsOf list
      group_by:
      - AsOfDate
      - PERIODNAME
      - ID CLASS
      aggregations:
      - POSTINGPERIOD Count = count(POSTINGPERIOD)
    - step: SelectColumns_1
      type: SelectColumns
      label: Select Columns 1
      selected_columns:
      - POSTINGPERIOD
      - PERIODNAME
      - TRANDATE
      - SUBSIDIARY
      - Tên Ngành
      - ACCTTYPE
      - Giá Vốn
      - Doanh số thực tế
      - Doanh thu ngành khác
      - Doanh thu thực tế
      - a10_CP Xúc tiến bán hàng
      - CP CKKM
      - DS Xanh
      - DS Đỏ
      - Vụ việc
      - LN Gộp
      - ID CLASS
      - Doanh thu SP mới
    - step: Join_0
      type: Join
      label: Join non-equi cum
      join_type: rightouterjoin
      left: SelectColumns_1
      right: GroupBy_0
      'on':
      - PERIODNAME = PERIODNAME
      - TRANDATE <= AsOfDate
      - ID CLASS = ID CLASS
      condition: and
    - step: GroupBy_1
      type: GroupBy
      label: Aggregate cumulative
      group_by:
      - PERIODNAME
      - AsOfDate
      - ID CLASS
      aggregations:
      - DT_ng = sum(Doanh thu thực tế)
      - a10_ng = max(a10_CP Xúc tiến bán hàng)
      - a1_ng = sum(Doanh số thực tế)
      - a3_ng = sum(Giá Vốn)
      - a5_ng = sum(CP CKKM)
      - a19_Doanh thu ngành khác_ng = sum(Doanh thu ngành khác)
      - DS Xanh Sum_ng = sum(DS Xanh)
      - DS Đỏ Sum_ng = sum(DS Đỏ)
      - DT_SPmoi_ng = sum(Doanh thu SP mới)
    - step: InputDataset_1
      type: InputDataset
      label: '[KGR] AOP'
      input_dataset: (KGR) AOP Dataset
      dataset_type: datamodel
      physical_tables:
        DW_NS_ACCOUNTINGPERIOD_D:
        - PERIODNAME
        DW_NS_X_AOP_HEADER_SF_1:
        - POSTINGPERIOD
        DW_NS_X_AOP_HEADER_CF_1:
        - CUSTBODY_SCV_AOP_LOAI_BAO_CAO
        DW_NS_X_AOP_LINE_SF_1:
        - SUBSIDIARY
        - CLASS
        - ID
        - NETAMOUNT
        DW_NS_X_AOP_LINE_CF:
        - CSEG_SCV_CHAIN
        - Per DS (AOP)
        - CSEG_SCV_NHOMXANHDO
        - Chỉ tiêu (AOP)
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_PRODCATG:
        - Ngành hàng
    - step: Filter_2
      type: Filter
      label: Filter 2
      filters:
      - '"PERIODNAME" IN(''May 2026'') and "CUSTBODY_SCV_AOP_LOAI_BAO_CAO" between 3 and 3 and "Chỉ tiêu (AOP)" between 1
        and 200'
    - step: AddColumns_4
      type: AddColumns
      label: Add Columns 4
      adds:
      - name: per_A6
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 6 THEN ABS("NETAMOUNT") END
      - name: per_A7
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 7 THEN ABS("NETAMOUNT") END
      - name: per_A8
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 8 THEN ABS("NETAMOUNT") END
      - name: per_A15
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 15 THEN ABS("NETAMOUNT") END
      - name: per_A16
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 16 THEN ABS("NETAMOUNT") END
      - name: per_A17
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 17 THEN ABS("NETAMOUNT") END
      - name: amt_A10
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 10 THEN ABS("NETAMOUNT") END
      - name: amt_A12
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 12 THEN ABS("NETAMOUNT") END
      - name: amt_A18
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 18 THEN ABS("NETAMOUNT") END
      - name: amt_A19
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 19 THEN ABS("NETAMOUNT") END
      - name: amt_A2
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 2 THEN ABS("NETAMOUNT") END
      - name: amt_A1
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 1 THEN ABS("NETAMOUNT") END
      - name: amt_A3
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 3 THEN ABS("NETAMOUNT") END
      - name: amt_A5
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 5 THEN ABS("NETAMOUNT") END
      - name: amt_A101
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 103 THEN ABS("NETAMOUNT") END
      - name: amt_A21src
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 21 THEN ABS("NETAMOUNT") END
      - name: amt_A105
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 105 THEN ABS("NETAMOUNT") END
      - name: amt_A104
        expression: CASE WHEN "Chỉ tiêu (AOP)" = 104 THEN ABS("NETAMOUNT") END
    - step: GroupBy_2
      type: GroupBy
      label: Aggregate 2
      group_by:
      - PERIODNAME
      - Ngành hàng
      - CLASS
      - CSEG_SCV_CHAIN
      aggregations:
      - per_A6 Sum = sum(per_A6)
      - per_A7 Sum = sum(per_A7)
      - per_A8 Sum = sum(per_A8)
      - per_A15 Sum = sum(per_A15)
      - per_A16 Sum = sum(per_A16)
      - per_A17 Sum = sum(per_A17)
      - amt_A10 Sum_ng = sum(amt_A10)
      - amt_A12 Maximum_ng = max(amt_A12)
      - amt_A18 Maximum_ng = max(amt_A18)
      - amt_A19 Sum_ng = sum(amt_A19)
      - amt_A2 Sum_ng = sum(amt_A2)
      - amt_A1 Sum_ng = sum(amt_A1)
      - amt_A3 Sum_ng = sum(amt_A3)
      - amt_A5 Sum_ng = sum(amt_A5)
      - amt_A101 Sum_ng = sum(amt_A101)
      - amt_A21src Sum_ng = sum(amt_A21src)
      - AOP_AMT_A104_ng = sum(amt_A104)
      - AOP_AMT_A105_ng = sum(amt_A105)
    - step: GroupBy_3
      type: GroupBy
      label: Aggregate 2 TĐ
      group_by:
      - PERIODNAME
      - CLASS
      aggregations:
      - AOP_PER_A7 = sum(per_A7 Sum)
      - AOP_PER_A16 = max(per_A16 Sum)
      - AOP_PER_A17 = max(per_A17 Sum)
      - AOP_AMT_A10_ng = sum(amt_A10 Sum_ng)
      - AOP_AMT_A12_ng = sum(amt_A12 Maximum_ng)
      - AOP_AMT_A18_ng = sum(amt_A18 Maximum_ng)
      - AOP_AMT_A19_ng = sum(amt_A19 Sum_ng)
      - AOP_DoanhSo_ng = sum(amt_A1 Sum_ng)
      - AOP_DT_ng = sum(amt_A2 Sum_ng)
      - AOP_GiaVon_ng = sum(amt_A3 Sum_ng)
      - AOP_CKKM_ng = sum(amt_A5 Sum_ng)
      - AOP_AMT_A101_ng = sum(amt_A101 Sum_ng)
      - AOP_AMT_A21_ng = sum(amt_A21src Sum_ng)
      - AOP_AMT_A104_ng = sum(AOP_AMT_A104_ng)
      - AOP_AMT_A105_ng = sum(AOP_AMT_A105_ng)
      - AOP_PER_A6 = sum(per_A6 Sum)
      - AOP_PER_A8 = sum(per_A8 Sum)
      - AOP_PER_A15 = sum(per_A15 Sum)
    - step: Join_1
      type: Join
      label: Join AOP TĐ
      join_type: leftouterjoin
      left: RenameColumns_1
      right: GroupBy_3
      'on':
      - PERIODNAME = PERIODNAME
      - ID CLASS = CLASS
      condition: and
    - step: AddColumns_1
      type: AddColumns
      label: Add So_Ngay
      adds:
      - name: So_Ngay
        expression: DayOfMonth("AsOfDate")
    - step: AddColumns_3
      type: AddColumns
      label: Metrics leaf
      adds:
      - name: a4
        expression: '"DT_ng" - "a3_ng"'
      - name: a6
        expression: CASE WHEN "DT_TĐ" = 0 THEN 0 ELSE "a6_TĐ" / "DT_TĐ" * "DT_ng" END
      - name: a7
        expression: CASE WHEN "DT_TĐ" = 0 THEN 0 ELSE "a7_TĐ" / "DT_TĐ" * "DT_ng" END
      - name: a8
        expression: CASE WHEN "DT_TĐ" = 0 THEN 0 ELSE "a8_TĐ" / "DT_TĐ" * "DT_ng" END
      - name: a15
        expression: CASE WHEN "DT_TĐ" = 0 THEN 0 ELSE "a15_TĐ" / "DT_TĐ" * "DT_ng" END
      - name: a16
        expression: CASE WHEN "DT_TĐ" = 0 THEN 0 ELSE "a16_TĐ" / "DT_TĐ" * "DT_ng" END
      - name: a17
        expression: CASE WHEN "DT_TĐ" = 0 THEN 0 ELSE "a17_TĐ" / "DT_TĐ" * "DT_ng" END
      - name: adp
        expression: CASE WHEN "DT_TĐ" = 0 THEN 0 ELSE "adp_TĐ" / "DT_TĐ" * "DT_ng" END
      - name: a10
        expression: CASE WHEN "AOP_AMT_A10_TĐ" = 0 THEN 0 ELSE "a10_TĐ" * "AOP_AMT_A10_ng" / "AOP_AMT_A10_TĐ" END
      - name: a12
        expression: CASE WHEN "AOP_AMT_A12_TĐ" = 0 THEN 0 ELSE "a12_TĐ" * "AOP_AMT_A12_ng" / "AOP_AMT_A12_TĐ" END
      - name: a18
        expression: CASE WHEN "AOP_AMT_A18_TĐ" = 0 THEN 0 ELSE "a18_TĐ" * "AOP_AMT_A18_ng" / "AOP_AMT_A18_TĐ" END
      - name: a19
        expression: CASE WHEN "AOP_AMT_A19_TĐ" = 0 THEN 0 ELSE "a19_TĐ" * "AOP_AMT_A19_ng" / "AOP_AMT_A19_TĐ" END
    - step: AddColumns_5
      type: AddColumns
      label: Subtotal T1
      adds:
      - name: a14
        expression: '"a15" + "a16" + "a17" + "adp" + "a18"'
      - name: a9
        expression: '"a4" - "a5_ng" - "a6" - "a7" - "a8"'
    - step: AddColumns_6
      type: AddColumns
      label: Subtotal T2
      adds:
      - name: a11
        expression: '"a9" - "a10"'
    - step: AddColumns_7
      type: AddColumns
      label: Subtotal T3
      adds:
      - name: a13
        expression: '"a11" - "a12"'
    - step: AddColumns_8
      type: AddColumns
      label: Subtotal T4
      adds:
      - name: a20
        expression: '"a13" - "a14" + "a19"'
    - step: AddColumns_9
      type: AddColumns
      label: Subtotal T5
      adds:
      - name: a21
        expression: '"a20" * 0.21'
    - step: AddColumns_10
      type: AddColumns
      label: Subtotal T6
      adds:
      - name: a22
        expression: '"a20" - "a21"'
      - name: a23
        expression: '"a20" - "a21"'
      - name: a24
        expression: CASE WHEN "DS Đỏ Sum_ng" = 0 THEN NULL ELSE "DS Xanh Sum_ng" / "DS Đỏ Sum_ng" END
    - step: AddColumns_2
      type: AddColumns
      label: M1 wide _k
      adds:
      - name: _k
        expression: '1'
    - step: InputDataset_2
      type: InputDataset
      label: Metric_Dim
      input_dataset: Metric_Dim
      dataset_type: datamodel
      physical_tables:
        Metric_Dim:
        - "\uFEFFSort_Order"
        - Metric_Code
        - Metric_Name
        - Type
    - step: AddColumns_11
      type: AddColumns
      label: M2 dim _k
      adds:
      - name: _k
        expression: '1'
    - step: Join_2
      type: Join
      label: M3 Join cross
      join_type: leftouterjoin
      left: AddColumns_2
      right: AddColumns_11
      'on':
      - _k = _k
      condition: and
    - step: AddColumns_12
      type: AddColumns
      label: M4 Actual_Amount
      adds:
      - name: Actual_Amount
        expression: |-
          CASE WHEN "Metric_Code" = 1 THEN "a1_ng"
               WHEN "Metric_Code" = 2 THEN "DT_ng"
               WHEN "Metric_Code" = 3 THEN "a3_ng"
               WHEN "Metric_Code" = 4 THEN "a4"
               WHEN "Metric_Code" = 5 THEN "a5_ng"
               WHEN "Metric_Code" = 6 THEN "a6"
               WHEN "Metric_Code" = 7 THEN "a7"
               WHEN "Metric_Code" = 8 THEN "a8"
               WHEN "Metric_Code" = 9 THEN "a9"
               WHEN "Metric_Code" = 10 THEN "a10"
               WHEN "Metric_Code" = 11 THEN "a11"
               WHEN "Metric_Code" = 12 THEN "a12"
               WHEN "Metric_Code" = 13 THEN "a13"
               WHEN "Metric_Code" = 14 THEN "a14"
               WHEN "Metric_Code" = 15 THEN "a15"
               WHEN "Metric_Code" = 16 THEN "a16"
               WHEN "Metric_Code" = 17 THEN "a17"
               WHEN "Metric_Code" = 101 THEN "adp"
               WHEN "Metric_Code" = 18 THEN "a18"
               WHEN "Metric_Code" = 19 THEN "a19"
               WHEN "Metric_Code" = 20 THEN "a20"
               WHEN "Metric_Code" = 21 THEN "a21"
               WHEN "Metric_Code" = 22 THEN "a22"
               WHEN "Metric_Code" = 23 THEN CASE WHEN "a22" > 0 THEN "a22" * 0.8 ELSE "a22" END
               WHEN "Metric_Code" = 24 THEN "a24"
               ELSE NULL END
      - name: DT_grain
        expression: '"DT_TĐ"'
      - name: AOP_Amount
        expression: CASE "Metric_Code" WHEN 1 THEN "AOP_DoanhSo_ng" WHEN 2 THEN "AOP_DT_ng" WHEN 3 THEN "AOP_GiaVon_ng" WHEN
          4 THEN ("AOP_DT_ng" - "AOP_GiaVon_ng") WHEN 5 THEN "AOP_CKKM_ng" WHEN 6 THEN "AOP_PER_A6_1" WHEN 7 THEN "AOP_PER_A7_1"
          WHEN 8 THEN "AOP_PER_A8_1" WHEN 9 THEN (("AOP_DT_ng" - "AOP_GiaVon_ng") - "AOP_CKKM_ng" - "AOP_PER_A6_1" - "AOP_PER_A7_1"
          - "AOP_PER_A8_1") WHEN 10 THEN ABS("AOP_AMT_A10_ng") WHEN 11 THEN ((("AOP_DT_ng" - "AOP_GiaVon_ng") - "AOP_CKKM_ng"
          - "AOP_PER_A6_1" - "AOP_PER_A7_1" - "AOP_PER_A8_1") - ABS("AOP_AMT_A10_ng")) WHEN 12 THEN ABS("AOP_AMT_A12_ng")
          WHEN 13 THEN (((("AOP_DT_ng" - "AOP_GiaVon_ng") - "AOP_CKKM_ng" - "AOP_PER_A6_1" - "AOP_PER_A7_1" - "AOP_PER_A8_1")
          - ABS("AOP_AMT_A10_ng")) - ABS("AOP_AMT_A12_ng")) WHEN 14 THEN ("AOP_PER_A15_1" + "AOP_PER_A16_1" + "AOP_PER_A17_1"
          + ABS("AOP_AMT_A101_ng") + ABS("AOP_AMT_A18_ng")) WHEN 15 THEN "AOP_PER_A15_1" WHEN 16 THEN "AOP_PER_A16_1" WHEN
          17 THEN "AOP_PER_A17_1" WHEN 101 THEN ABS("AOP_AMT_A101_ng") WHEN 18 THEN ABS("AOP_AMT_A18_ng") WHEN 19 THEN ABS("AOP_AMT_A19_ng")
          WHEN 20 THEN ((((("AOP_DT_ng" - "AOP_GiaVon_ng") - "AOP_CKKM_ng" - "AOP_PER_A6_1" - "AOP_PER_A7_1" - "AOP_PER_A8_1")
          - ABS("AOP_AMT_A10_ng")) - ABS("AOP_AMT_A12_ng")) - ("AOP_PER_A15_1" + "AOP_PER_A16_1" + "AOP_PER_A17_1" + ABS("AOP_AMT_A101_ng")
          + ABS("AOP_AMT_A18_ng")) + ABS("AOP_AMT_A19_ng")) WHEN 21 THEN ABS("AOP_AMT_A21_ng") WHEN 22 THEN ABS("AOP_AMT_A104_ng")
          WHEN 23 THEN ABS("AOP_AMT_A105_ng") WHEN 24 THEN CASE WHEN "DS Đỏ Sum" = 0 THEN NULL ELSE "DS Xanh Sum" / "DS Đỏ
          Sum" END ELSE NULL END
    - step: SelectColumns_2
      type: SelectColumns
      label: M5 Select 7 cols
      selected_columns:
      - PERIODNAME
      - Metric_Code
      - Metric_Name
      - "\uFEFFSort_Order"
      - Type
      - Actual_Amount
      - DT_grain
      - AOP_Amount
      - AsOfDate
      - ID CLASS
    - step: AddColumns_13
      type: AddColumns
      label: N2 AOP prep
      adds:
      - name: Metric_Code
        expression: '"Chỉ tiêu (AOP)"'
      - name: AOP_Amount
        expression: ABS("NETAMOUNT")
      - name: AOP_Per
        expression: '"Per DS (AOP)"'
    - step: OutputDataset_0
      type: OutputDataset
      label: Save Data
      output_dataset: Nganh_Report_Long_#
      save_type: conn
      output_type: Create
      dataset_description: Nganh_Report_Long_#
      output_columns:
      - PERIODNAME
      - Metric_Code
      - Metric_Name
      - "\uFEFFSort_Order"
      - Type
      - Actual_Amount
      - DT_grain
      - AOP_Amount
      - AsOfDate
      - ID CLASS
    - step: InputDataset_6
      type: InputDataset
      label: TD_Metrics_Wide
      input_dataset: TD_Metrics_Wide
      dataset_type: parquet
    - step: Join_8
      type: Join
      label: Join driver TĐ
      join_type: leftouterjoin
      left: AddColumns_1
      right: InputDataset_6
      'on':
      - PERIODNAME = PERIODNAME
      - AsOfDate = AsOfDate
      condition: and
    - step: SelectColumns_4
