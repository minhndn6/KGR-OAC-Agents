    - step: AddColumns_1
      type: AddColumns
      label: Gvon
      adds:
      - name: Giá Vốn
        expression: |-
          CASE

              WHEN "GVMT" IS NOT NULL
               AND "GVMT" <> 0

              THEN

                  "GVMT"
                  *
                  ABS(
                      "QUANTITY"
                  )

              WHEN "GVTK" IS NOT NULL
               AND "GVTK" <> 0

              THEN

                  "GVTK"
                  *
                  ABS(
                      "QUANTITY"
                  )

              ELSE

                  "Doanh thu thực tế" / 2

          END
      - name: T1_GVMT
        expression: |-
          CASE

              WHEN "GVMT" IS NOT NULL
               AND "GVMT" <> 0

              THEN

                  "GVMT"
                  *
                  ABS(
                      "QUANTITY"
                  )

              ELSE 0

          END
      - name: T2_GVTK
        expression: |-
          CASE

              WHEN (
                      "GVMT" IS NULL
                   OR "GVMT" = 0
                   )

               AND "GVTK" IS NOT NULL
               AND "GVTK" <> 0

              THEN

                  "GVTK"
                  *
                  ABS(
                      "QUANTITY"
                  )

              ELSE 0

          END
      - name: T3_FB50
        expression: |-
          CASE

              WHEN (
                      "GVMT" IS NULL
                   OR "GVMT" = 0
                   )

               AND (
                      "GVTK" IS NULL
                   OR "GVTK" = 0
                   )

              THEN

                   "Doanh thu thực tế"  / 2

              ELSE 0

          END
      - name: Unit Cost
        expression: "CASE\n\n    WHEN \"GVMT\" IS NOT NULL\n     AND \"GVMT\" <> 0\n\n    THEN\n\n        \"GVMT\"\n     \n\
          \n    WHEN \"GVTK\" IS NOT NULL\n     AND \"GVTK\" <> 0\n\n    THEN\n\n        \"GVTK\"\n        \n   \n    ELSE\n\
          \n        ( \"Doanh thu thực tế\"  / 2) /  ABS(\n            \"QUANTITY\"\n        )\n\n\nEND"
