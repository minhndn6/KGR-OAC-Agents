      input_dataset: (KGR) BTUT
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_BUT_TOAN_UT_TRANS_HEADER_1:
        - POSTINGPERIOD
        - VOIDED
        - VOID
        DW_NS_ACCOUNTINGPERIOD_D:
        - PERIODNAME
        DW_NS_X_BUT_TOAN_UT_TRANS_LINE:
        - SUBSIDIARY
        - CLASS
        - NETAMOUNT
        - DEPARTMENT
        - W$_UPDATE_DT
        - TRANSACTION
        DW_NS_SUBSIDIARY_D:
        - Tên Đơn vị
        DW_NS_CLASSIFICATION_D:
        - Tên Ngành
        DW_NS_X_LIST_SALE_CHANEL_NS:
        - ID Nhóm kênh
        - Nhóm kênh
        DW_NS_X_BUT_TOAN_UT_TRANS_LINE_EXT:
        - CSEG_SCV_SC
        - CSEG_SCV_CHAIN
        - CSEG_SCV_EXP_LIST
        - CSEG_SCV_EXP_TYPE
        DW_NS_X_SALE_CHANNEL:
        - Tên Kênh
        DW_NS_X_CAM_CUSTOMRECORD_CSEG_SCV_CHAIN:
        - Tên Chuỗi
        DW_NS_ACCOUNT_D:
        - ACCTTYPE
        - ACCTNUMBER
        DW_NS_X_CUSTOMRECORD_CSEG_SCV_EXP_LIST:
        - CUSTRECORD_SCV_EXPENSE_GROUP_EXP
    - step: RenameColumns_1
      type: RenameColumns
      label: Rename Columns 1
      renames:
      - CSEG_SCV_SC -> ID Kênh
      - CSEG_SCV_CHAIN -> ID Chuỗi
      - NETAMOUNT -> Chi phí
      - CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP -> ID Chỉ tiêu
      - CLASS -> ID CLASS
      - Tên chỉ tiêu -> Tên Chỉ tiêu
    - step: Filter_1
      type: Filter
      label: Filter AccType = Expense, Other Expense
      filters:
      - '"ACCTTYPE" IN(''Expense'', ''OthExpense'')'
    - step: GroupBy_1
      type: GroupBy
      label: Aggregate 1
      group_by:
      - POSTINGPERIOD
      - SUBSIDIARY
      - ID CLASS
      - ID Kênh
      - ID Chuỗi
      - CSEG_SCV_EXP_LIST
      - CSEG_SCV_EXP_TYPE
      - CUSTRECORD_SCV_EXPENSE_GROUP_EXP
      - DEPARTMENT
      - ACCTNUMBER
      aggregations:
      - Chi phí = sum(Chi phí)
    - step: Concatenate_0
      type: Concatenate
      label: Union Rows
      union_type: union all
      left: AddColumns_0
      right: AddColumns_1
      match:
    - step: AddColumns_0
      type: AddColumns
      label: Add Type
      adds:
      - name: Type
        expression: '''Journal'''
    - step: AddColumns_1
      type: AddColumns
      label: Add Type
      adds:
      - name: Type
        expression: '''BTUT'''
    - step: GroupBy_2
      type: GroupBy
      label: Aggregate 2
      group_by:
      - POSTINGPERIOD
      - Sub Id
      - ID CLASS
      - ID Kênh
      - ID Chuỗi
      - CSEG_SCV_EXP_LIST
      - CSEG_SCV_EXP_TYPE
      - CUSTRECORD_SCV_EXPENSE_GROUP_EXP
      - DEPARTMENT
      aggregations:
      - Chi phí = sum(Chi phí)
    - step: AddColumns_2
      type: AddColumns
      label: Chỉ tiêu Wide
      adds:
      - name: a5_CP chiết khấu khuyến mại
        expression: Case when "CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP " = 5 then "Chi phí" else 0 end
      - name: a6_CP nhân viên KD
        expression: Case when "CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP " = 6 then "Chi phí" else 0 end
      - name: a7_CP roadshow hội nghị
        expression: Case when "CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP " = 7 then "Chi phí" else 0 end
      - name: a8_CP công tác, tiếp khách KD
        expression: Case when "CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP " = 8 then "Chi phí" else 0 end
      - name: a10_CP xúc tiến bán hàng
        expression: Case when "CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP " = 10 then "Chi phí" else 0 end
      - name: a12_CP nhân viên BO
        expression: Case when "CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP " = 12 then "Chi phí" else 0 end
      - name: a15_+ CP vận chuyển
        expression: Case when "CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP " = 15 then "Chi phí" else 0 end
      - name: a16_+ CP bảo hành
        expression: Case when "CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP " = 16 then "Chi phí" else 0 end
      - name: a17_+ CP tài chính
        expression: Case when "CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP " = 17 then "Chi phí" else 0 end
      - name: a18_+ CP khác
        expression: Case when "CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP " = 18 then "Chi phí" else 0 end
    - step: AddColumns_3
      type: AddColumns
      label: Add Unique key
      adds:
      - name: Unique Key
        expression: |-
          CAST("DEPARTMENT" AS CHAR)
          || '~' ||
          CAST("CUSTRECORD_SCV_EXPENSE_GROUP_EXP" AS CHAR)
          || '~' ||
          CAST("CSEG_SCV_EXP_LIST" AS CHAR)
          || '~' ||
          CAST("CSEG_SCV_EXP_TYPE" AS CHAR)
    - step: InputDataset_2
      type: InputDataset
      label: (KGR) EXP_MAPPING_CHI_TIEU_AOP
      input_dataset: (KGR) EXP_MAPPING_CHI_TIEU_AOP
      dataset_type: datamodel
      physical_tables:
        DW_NS_X_CUSTOMRECORD_SCV_EXP_MAPPING:
        - CUSTRECORD_SCV_EXP_MAP_EXP_GROUP
        - CUSTRECORD_SCV_EXP_MAP_EXP_LIST
        - CUSTRECORD_SCV_EXP_MAP_EXP_TYPE
        - CUSTRECORD_SCV_EXP_MAP_DEP
        - CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP
    - step: AddColumns_4
      type: AddColumns
      label: Add Unique Key
      adds:
      - name: Unique_key
        expression: |-
          CAST("CUSTRECORD_SCV_EXP_MAP_DEP" AS CHAR)
          || '~' ||
          CAST("CUSTRECORD_SCV_EXP_MAP_EXP_GROUP" AS CHAR)
          || '~' ||
          CAST("CUSTRECORD_SCV_EXP_MAP_EXP_LIST" AS CHAR)
          || '~' ||
          CAST("CUSTRECORD_SCV_EXP_MAP_EXP_TYPE" AS CHAR)
    - step: Join_0
      type: Join
      label: Join
      join_type: leftouterjoin
      left: AddColumns_3
      right: AddColumns_4
      'on':
      - Unique Key = Unique_key
      condition: and
    - step: SelectColumns_0
      type: SelectColumns
      label: Select Columns
      selected_columns:
      - POSTINGPERIOD
      - Sub Id
      - ID CLASS
      - ID Kênh
      - ID Chuỗi
      - CSEG_SCV_EXP_LIST
      - CSEG_SCV_EXP_TYPE
      - CUSTRECORD_SCV_EXPENSE_GROUP_EXP
      - DEPARTMENT
      - Chi phí
      - 'CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP '
    - step: AddColumns_5
      type: AddColumns
      label: Add Sub ID gom NM về VU1
      adds:
      - name: Sub Id
        expression: Case when "SUBSIDIARY" = 4 then 2 else "SUBSIDIARY" end
    - step: AddColumns_6
      type: AddColumns
      label: Add Lọc Sub
      adds:
      - name: Lọc Sub
        expression: Case when "Sub Id" in (2,8) then 'T' else 'F' end
    - step: Filter_3
      type: Filter
      label: Filter Sub
      filters:
      - '"Lọc Sub" IN(''T'')'
    - step: AddColumns_7
      type: AddColumns
      label: Add Columns 7
      adds:
      - name: Lọc không đủ Mapping
        expression: |-
          CASE
              WHEN "DEPARTMENT" IS NULL
                   OR "DEPARTMENT" < 0
                   OR "CUSTRECORD_SCV_EXPENSE_GROUP_EXP" IS NULL
                   OR "CUSTRECORD_SCV_EXPENSE_GROUP_EXP" < 0
                   OR "CSEG_SCV_EXP_LIST" IS NULL
                   OR "CSEG_SCV_EXP_LIST" < 0
                   OR "CSEG_SCV_EXP_TYPE" IS NULL
                   OR "CSEG_SCV_EXP_TYPE" < 0
              THEN 'F'

              ELSE 'T'
          END
    - step: GroupBy_3
      type: GroupBy
      label: Aggregate 3
      group_by:
      - CUSTRECORD_SCV_EXP_MAP_EXP_GROUP
      - CUSTRECORD_SCV_EXP_MAP_EXP_LIST
      - CUSTRECORD_SCV_EXP_MAP_EXP_TYPE
      - CUSTRECORD_SCV_EXP_MAP_DEP
      aggregations:
      - CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP  = max(CUSTRECORD_SCV_EX_MAP_CHI_TIEU_AOP)
    - step: GroupBy_4
      type: GroupBy
      label: Aggregate 4
      group_by:
      - POSTINGPERIOD
      - Sub Id
      - ID CLASS
      - ID Kênh
      - ID Chuỗi
      aggregations:
      - a5_CP chiết khấu khuyến mại = sum(a5_CP chiết khấu khuyến mại)
      - a6_CP nhân viên KD = sum(a6_CP nhân viên KD)
      - a7_CP roadshow hội nghị = sum(a7_CP roadshow hội nghị)
      - a8_CP công tác, tiếp khách KD = sum(a8_CP công tác, tiếp khách KD)
      - a10_CP xúc tiến bán hàng = sum(a10_CP xúc tiến bán hàng)
      - a12_CP nhân viên BO = sum(a12_CP nhân viên BO)
      - a15_+ CP vận chuyển = sum(a15_+ CP vận chuyển)
      - a16_+ CP bảo hành = sum(a16_+ CP bảo hành)
      - a17_+ CP tài chính = sum(a17_+ CP tài chính)
      - a18_+ CP khác = sum(a18_+ CP khác)
  KGR_DF_Group Rate As-Of_Ngành:
